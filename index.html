صناف المنصرفة.\nc. الكمية المستلمة من كل صنف بالأرقام والحروف.\nعلى أن يكون الإيصال موقعاً من الطبيب المستلم بوضوح مع ذكر الاسم بالكامل ومعتمداً ومختوماً من مدير المستشفى.\n3. ينشئ الطبيب المختص بصرف المخدرات دفتر حرف ز معتمد (مختوم) ومرقم لقيد ما يصرف من مخدرات من الصيدلية ويوقع الصيدلي أمام سطر الإضافة بالدفتر كما يوقع الطبيب المختص أمام الكمية المنصرفة له بدفتر عهدة الصيدلية.\n4. يدون بخط الطبيب بدفتر المخدرات للقسم اسم المريض المنصرف له المخدرات والتشخيص وتاريخ الصرف واسم الدواء وقوة التركيز والكمية المنصرفة له بالحروف والأرقام كما يوقع عليه الطبيب الآمر بالصرف.\n5. يراجع صيدلي المستشفى هذا الدفتر مرة كل خمسة عشر يوماً ويوقع بذلك، وإذا وجد أي مخالفة في القيد والصرف يكتب تقريراً بذلك إلى مدير المستشفى.\n6. يجب حفظ الدفاتر الخاصة بالمخدرات وكذا الإيصالات (طلبات الصرف من المخازن أو طلبات الصرف من الصيدلية لأقسام المستشفى) لمدة عشر سنوات من تاريخ آخر قيد تم بها.\n7- يتم تحرير تذاكر المخدرات من أصل وصورتين ويوضح به اسم المريض، بياناته، التشخيص، تاريخ الصرف، اسم الدواء، قوة التركيز، الكمية المنصرفة له بالحروف والأرقام ويتم التوقيع عليه من النائب الإداري ومدير المستشفى ويختم بخاتم شعار الجمهورية.\n8- عند الاستعاضة يتم إرسال أصل وصورة لتذكرة صرف المخدرات مع الفوارغ للكمية المستهلكة مع إذن (111) بهذه الكمية موضحة بالأرقام والحروف وموقع في خانة الطالب والمستلم من النائب الإداري على أن يكون معتمد ومختوم.\n9- يتم تخصيم إذن (111) من دفتر (118) ويتم توقيع النائب الإداري على الكمية المخصومة.\n\nمراجعة عهدة المخدرات بالوحدة:\n1- يقوم كاتب الشطب بتجميع بيان حركة المخدرات في الصيدلية التابعة له كل ثلاثة أشهر ويحرر بها كشف من أصل وصورة يحتفظ بالأصل ويرسل الصورة مرفقاً به بيان بعهدة المخدرات بالصيدلية إلى إدارة التموين الطبي التابع لها المستشفى – على أن يتم ارسال الكشوف خلال الخمسة عشر يوماً من شهري يناير ويوليو.", "2- يتم استلام وإعدام الفوارغ للأصناف المنصرفة بعد جردها بلجنة بعضوية كل من:\n1. السيد الدكتور / مدير المستشفى رئيساً.\n2. عضواً من التموين الطبي بالفرع.\n3. الصيدلي صاحب العهدة.\n4. مدير الشئون المالية والإدارية بالوحدة.\n\nحفظ المخدرات:\nتحفظ المخدرات بالصيدلية في خزينة خاصة أو مكان أمين تابع للصيدلي صاحب العهدة.\n\nطريقة صرف Morphine sulphate بالعيادات التي بها لجان أورام:\nيتم مراعاة الضوابط التالية عند الصرف:\n- لا يستخدم هذا الدواء إلا بعد استنفاد العلاج بمسكنات الألم العادية حتى لا يفقد العقار فاعليته من طول الاستخدام.\n- الجرعة اليومية قرصان.\n- يصرف علاج لمدة أسبوعين.\n- يتم مناظرة المريض في كل مرة لصرف الدواء.\n- ضرورة إرجاع العلب والشرائط الفارغة قبل صرف الدواء في المرة التالية.", "التعليمات المنظمة لصرف الفلانشات\n\nالمعدلات المناسبة لهذه الأصناف كالآتي:\n1- في حالة فتحة البراز بجدار البطن: 12 فلانشة شهرياً، 30 كيس جمع براز شهرياً.\n2- فتحة البول بجدار البطن: 15 فلانشة شهرياً، 15 كيس جمع بول شهرياً.\nعدا حالات Cystectomy and bilateral ureterocutaneous implantation حيث يصرف لهم ضعف الكمية.\n3- لا داعي لاستخدام المعجون اللاصق Adhesive Paste.\n\nالتعليمات المنظمة لصرف الشرابات الطبية لمرضى الدوالي:\nيتم وصف الشرابات الطبية فوق الركبة للحالات الآتية:\n- (أن تكون الساق سمينة \"بدينة\")\n- أن يكون هناك جلطة بالوريد الفخذي ولم يتحسن الورم بعد 10 أيام من العلاج.\nلباقي الحالات يصرف الشرابات الطبية تحت الركبة.\nيوقف صرف أدوية علاج الدوالي مثل Diosmine tab لجميع هذه الحالات.", "الفهرس\n\n- المقدمة: 1\n- أنظمة الانتفاع بالخدمات التأمينية: 2\n- القوانين واللوائح (القرارات) المنظمة للتعامل مع أدوية الهيئة العامة للتأمين الصحي: 3\n- أمثلة للمخالفات التي تندرج تحت طائلة قانون 10 لسنة 67: 4\n- أوامر إدارية: 5\n- تعليمات هامة للسادة الأطباء والصيادلة مستخدمي التذاكر الطبية: 6\n- الإجراءات التي تتبع عند استلام وإرجاع التذاكر الطبية: 7\n- الإجراءات التي تتبع في حال فقد دفتر التذاكر الطبية: 10\n- إجراءات التعامل مع المنتفع في تحرير وصرف التذاكر الطبية: 11\n- وصف الدواء: 15\n- الأمراض المزمنة: 17\n- إرشادات عامة للصيادلة: 21\n- الأخطاء الممكن حدوثها من بعض الأطباء والصيادلة وما يتبع حيالها من المراجعة الفنية: 24\n- إرشادات عامة للصيدليات المتعاقدة: 27\n- أحكام عامة: 32\n- لائحة المخالفات والجزاءات للصيدليات المتعاقدة: 34\n- آلية صرف أدوية الاسم التجاري: 36\n- آلية التعامل مع اللجنة العليا للدواء: 37\n- البروتوكولات المنظمة لصرف الأدوية: 40\n- أدوية الأورام: 41\n- أدوية الأوعية الدموية: 67\n- أدوية الصرع: 69\n- البروتوكول العلاجي لمرضى السكر: 70\n- ضوابط استخدام مثبطات المناعة بعد زرع الكلى: 75\n- ضوابط صرف عقار Alpha Calcidol: 76\n- بروتوكول عقار الإريثروبويتين: 77\n- ضوابط صرف Gilenya: 80\n- ضوابط صرف IVIG: 81\n- ضوابط استخدام الألبيومين البشري: 83\n- ضوابط استخدام الأدوية المسيلة للدم أثناء الحمل في وجود تغيير صمامات القلب: 85\n- ضوابط صرف الهيبارين منخفض الوزن الجزيئي: 86\n- ضوابط صرف LHRH Analogue: 87\n- ضوابط صرف Growth hormone: 88\n- أدوية الكبد: 91\n- أدوية أمراض الدم: 101\n- ضوابط صرف أدوية المضادات الحيوية: 114\n- أدوية الرمد: 118\n- أدوية هشاشة العظام: 121\n- ضوابط صرف المخدرات: 123\n- التعليمات المنظمة لصرف الفلانشات والشرابات الطبية: 126"];

const PAGE_OVERRIDES = {"83": "<div class=\"fmt-h\">أستخدام الألبيومين البشري في مرضي تليف الكبد</div><div class=\"fmt-p\">استخدام الألبيومين البشري في تليف الكبد ودواعي استعماله تقل تدريجياً بناءً علي توصيات كل جمعيات ومنظمات الكبد العالمية. لا يوجد دور أو داعٍ لاستخدام الألبيومين كعلاج للتليف أو لإصلاح أو رفع مستوي الألبيومين في الجسم مهما كان مستوي الألبيومين وبغض النظر عن قلته.</div><div class=\"fmt-h2\">حالياً يقتصر استخدام حقن الألبيومين علي الحالات التالية فقط</div><div class=\"fmt-p\">المرضي الذين يجري لهم بذل استسقاء بحجم كبير (Large volume paracentesis اكثر من 5 لتر في الجلسة): بجرعة 5 جرام ألبيومين لكل لتر من الاستسقاء يتم بذله، يعطي علي مرة واحدة مع البذل، ولا يكرر إلا بتكرار البذل بحجم كبير.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>التركيز</th><th>حجم الزجاجة</th><th>محتوي الألبيومين</th><th>تكفي عدد لترات من البذل</th></tr></thead><tbody><tr><td>20%</td><td>50ml</td><td>10 gm</td><td>2</td></tr><tr><td>20%</td><td>100ml</td><td>20 gm</td><td>4</td></tr><tr><td>25%</td><td>50ml</td><td>12.5 gm</td><td>2.5</td></tr><tr><td>25%</td><td>100ml</td><td>25 gm</td><td>5</td></tr></tbody></table></div><ol class=\"fmt-ul\"><li>مرضي الالتهاب البريتوني التلقائي (Spontaneous Bacterial Peritonitis - SBP): إذا كانت البيليروبين الإجمالية 4 ملجم أو أكثر أو كان الكرياتينين أعلي من الطبيعي لمنع الإصابة بفشل كلوي-كبدي، ولا يوجد داعٍ لاستعماله في المرضي الذين تقل فيهم البيليروبين عن 4 ملجم والكرياتينين طبيعي. الجرعة: 1.5 جرام لكل كيلوجرام من وزن المريض في أول يوم، ثم تكرر بجرعة 1 ملجم لكل كيلوجرام من وزن المريض في اليوم الثالث.</li><li>في علاج الفشل الكلوي-الكبدي (Hepato-Renal Syndrome): يستخدم فقط في مراكز العلاج المتقدم التي يتوفر فيها إمكانيات زرع كبد، ويستخدم فقط بالإضافة للأدوية المفعّلة للدورة الدموية (جليوبريسين أو خليط أوكتريوتايد-ميدودرين)، ولا يستخدم الألبيومين بمفرده لعدم جدواه. الجرعة: 20-40 جرام ألبيومين يومياً بالإضافة إلي 0.5-2 ملجم جليوبريسين بالوريد كل 4 ساعات.</li></ol><div class=\"fmt-note\">لا يجب استخدام الألبيومين في مرضي تليف الكبد من الكبار الذين لا يجري لهم جراحات إلا في الحالات المحددة أعلاه.</div>","86": "<div class=\"fmt-h\">بروتوكول العلاج بالهيبارين منخفض الوزن الجزيئي</div><div class=\"fmt-h2\">دواعي الاستخدام</div><ul class=\"fmt-ul\"><li>الوقاية من الجلطات الوريدية العميقة والتي قد تؤدي إلى الانسداد الرئوي: مرضي العمليات الجراحية في البطن، مرضي جراحة استبدال مفصل الورك، الحالات الحادة المقترنة بتقييد شديد للحركة.</li><li>علاج الجلطات الوريدية العميقة الحادة، يعطي مع وارفارين.</li><li>الوقاية من المضاعفات الإقفارية (Ischemic) للذبحة الصدرية غير المستقرة.</li><li>علاج متلازمة الشريان التاجي الحادة المصحوبة بارتفاع فترة الـ ST، يعطي مع الأسبرين. متوسط مدة العلاج: عشرة أيام.</li></ul><div class=\"fmt-h\">الجرعات</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الدواء</th><th>Prophylactic dose</th><th>Therapeutic dose</th></tr></thead><tbody><tr><td>Nadroparin</td><td>(0.3ml) 2,850 anti-Xa IU Once daily</td><td>86 anti-Xa IU per kg body weight / 12 hr</td></tr><tr><td>Enoxaparin</td><td>40 mg SC Once daily</td><td>1 mg / kg / 12 hr</td></tr></tbody></table></div><div class=\"fmt-p\">الوقاية من الجلطات أثناء الغسيل الكلوي: نادروبارين 65 وحدة/كجم من وزن الجسم تحقن في الشريان عند بدء كل جلسة. يستخدم نصف الجرعة في المرضي المعرضين لخطورة النزف.</div>","95": "<div class=\"fmt-h\">Immunosuppressed Patients</div><ul class=\"fmt-ul\"><li>HBsAg –ve, AntiHBc +ve, HBV PCR +ve should be managed in the same way as HBsAg +ve cases.</li><li>HBsAg –ve, AntiHBc +ve, HBV PCR –ve should be followed-up every 2-3 months. Start oral antiviral if HBV PCR becomes positive.</li></ul><div class=\"fmt-h2\">Which oral antiviral?</div><ul class=\"fmt-ul\"><li>Viral load &lt; 2000 IU/ml and short duration of immunosuppression: use Lamivudine.</li><li>Viral load &ge;2000 IU/ml and long duration or repeated courses of immunosuppression: use Entecavir or Tenofovir.</li></ul><div class=\"fmt-h\">When to stop antiviral therapy?</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Patient</th><th>PegIFN-α therapy</th><th>NA therapy</th></tr></thead><tbody><tr><td>HBeAg (+)</td><td>48 weeks</td><td>Stop treatment 6-12 months after seroconversion</td></tr><tr><td>HBeAg (−)</td><td>IFN not recommended</td><td>Indefinitely, or until HBsAg seroconversion</td></tr></tbody></table></div><div class=\"fmt-h2\">On-treatment monitoring</div><ul class=\"fmt-ul\"><li>Every month: visits to receive medication and monitor for compliance and side effects.</li><li>Every 3 months: check ALT. For patients on Tenofovir and Adefovir, check serum creatinine.</li><li>Every 6 months: check HBV DNA, liver profile, complete blood count, alpha-fetoprotein, abdominal ultrasound.</li></ul><div class=\"fmt-h2\">Monitoring patients who are NOT candidates for therapy</div><ul class=\"fmt-ul\"><li>HBeAg Positive: test ALT, HBeAg, HBV DNA, and HBsAg every 3-6 months.</li><li>HBeAg Negative: test ALT, HBV DNA, HBsAg every 3-6 months.</li></ul>","106": "<div class=\"fmt-h\">معايير استخدام Deferiprone – Ferriprox</div><div class=\"fmt-p\">يستخدم عقار Deferiprone – Ferriprox لمرضي أنيميا البحر المتوسط لعلاج زيادة الحديد بالجسم وذلك علي النحو التالي:</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Ferriprox Dose</th><th>S. Ferritin Level</th></tr></thead><tbody><tr><td>75 mg / kg / day (TDS)</td><td>1000 – 2500 mg / dl</td></tr><tr><td>100 mg / kg / day (TDS)</td><td>2500 – 4000 mg / dl</td></tr></tbody></table></div><ul class=\"fmt-ul\"><li>مع عمل وظائف الكبد وصورة دم كاملة للمريض شهرياً.</li><li>تحليل مخزون الحديد كل 3-6 شهور.</li></ul>","117": "<div class=\"fmt-h\">Dosage</div><div class=\"fmt-p\">Adults and children &gt; 30 kg: 1,200,000 international units (900mg), by intramuscular injection every 4 weeks. The recommended dose of BPG for children up to 27-30 kg is 450 mg (600,000 IU) IM every 4 weeks.</div><div class=\"fmt-h2\">Optimum frequency of administration</div><div class=\"fmt-p\">4-weekly injections are effective if good adherence can be assured. The drug can be given more frequently, every 5 weeks, if there is a desire to further increase the efficacy in preventing recurrent ARF.</div><div class=\"fmt-h2\">Standard care</div><div class=\"fmt-p\">Duration of secondary prophylaxis depends on history of carditis and if valvular involvement persists. Minimum duration is 10 years since last ARF episode or until age 21 years, whichever is longer, with prolongation till age 35-40 years in individuals with significant valvular disease.</div><div class=\"fmt-note\">Missing even a single dose of BPG raises the risk of recurrent RF.</div><div class=\"fmt-h\">Duration for secondary prophylaxis for rheumatic fever</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Type</th><th>Duration after last attack</th></tr></thead><tbody><tr><td>Rheumatic fever without carditis</td><td>5 years or until age 21 years (whichever is longer)</td></tr><tr><td>Rheumatic fever with carditis but no residual heart disease (no valvular disease)</td><td>10 years or until age 21 years (whichever is longer)</td></tr><tr><td>Rheumatic fever with carditis and residual heart disease (persistent valvular disease)</td><td>10 years or until age 40 years (whichever is longer); life time prophylaxis may be needed.</td></tr></tbody></table></div><div class=\"fmt-note\">Stop using BPG for treatment of other infections (e.g. streptococcal pharyngitis) where other effective antibiotics are available.</div>","1": "<div class=\"fmt-h\">الهيئة العامة للتأمين الصحي</div><div class=\"fmt-h2\">الإدارة المركزية للتموين الطبي والصيدليات</div><div class=\"fmt-h2\">مقدمة</div><div class=\"fmt-p\">تتشرف الإدارة المركزية للتموين الطبي والصيدليات بالهيئة العامة للتأمين الصحي بإعداد قائمة الأدوية الأساسية وإجراءات وبروتوكولات تداولها بالهيئة لعام 2019، حيث صدرت الطبعة الأولى عام 1966 وتوالى صدور الطبعات التالية خلال السنوات الماضية. وتعتبر تلك القائمة مع الدليل مرجعاً يضم جميع البروتوكولات والقرارات والقواعد والتعليمات المنظمة الصادرة من الهيئة، وهو دليل الطبيب والصيدلي المعين والمتعاقد مع التأمين الصحي للتعامل مع الأدوية المصرح بوصفها تنفيذاً لقوانين التأمين الصحي.</div><div class=\"fmt-note\">\" آملين من الله أن يكون نافعاً ومعيناً لهم لأداء خدمة طبية متميزة لصالح منتفعي التأمين الصحي \"</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><tbody><tr><td class=\"vt-num\" style=\"width:120px\">إعداد</td><td>د/ منيرة حسين</td></tr><tr><td class=\"vt-num\">مراجعة</td><td>د/ ليلى السيد على</td></tr><tr><td class=\"vt-num\">يعتمد</td><td>السيدة الدكتورة د/ ناهد عبد الرحيم — رئيس مجلس الإدارة</td></tr></tbody></table></div><div class=\"fmt-h2\">أعضاء الفريق</div><ul class=\"fmt-ul\"><li>د/ حنان العليمي</li><li>د/ سهير عبد الحميد</li><li>د/ أحمد سعودي</li><li>د/ مروة عباس</li><li>د/ مروة حلمي</li><li>د/ رحاب محمد</li><li>ك/ سناء يوسف</li></ul><div class=\"fmt-note\">تاريخ الإصدار: 1 / 1 / 2019</div>","9": "<div class=\"fmt-p\">يوقع الطبيب باستلام الدفاتر (غير مختومة) من أمين المخزن على السجل المخصص لذلك كما هو موضح بالنموذج التالي:</div><div class=\"fmt-note\">نموذج رقم \"399 ت.ص\"</div><div class=\"fmt-h2\">سجل تسليم التذاكر الطبية — الهيئة العامة للتأمين الصحي / فرع / المنطقة</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>تاريخ التسليم</th><th>أسم الطبيب</th><th>من رقم مسلسل — إلى رقم</th><th>تاريخ الاستلام في المنطقة</th><th>توقيع المستلم</th><th>توقيع الطبيب</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><div class=\"fmt-h2\">تعليمات</div><ul class=\"fmt-ul\"><li>على الطبيب أو مندوبه مراجعة سلامة الدفاتر وصحة البيانات المسجلة بالسجل، خاصة رقم المجموعة والرقم المسلسل المطبوع، وأن نوع الدفاتر والقانون هو الخاص به قبل التوقيع باستلامها.</li><li>على الطبيب أو مندوبه التوجه للموظف المختص بختم الدفاتر (المراجع)، والذي يكون مقره بنفس المبنى المتواجد به المخزن، ليقوم الأخير بختم الدفاتر بختم شعار الجمهورية المخصص لهذا الغرض، مع مراعاة الوضوح التام لبيانات الختم واستخدام ختامات سليمة وحبر مناسب.</li><li>على المراجع إعادة تسجيل بيانات الدفاتر في كارت يخصص لكل طبيب (أو صفحات مستقلة بسجل حرف ز)، وتكون بيانات الكارت: اسم الطبيب ورقم الإخطار الوارد من المنطقة بالتصريح له باستلام دفاتر، ثم جدول يدون به نوع الدفتر والقانون ورقم المجموعة ورقم أول تذكرة وتاريخ الختم وتوقيع الطبيب أو المندوب بما يفيد ختم الدفاتر، وتاريخ ارتجاع الكعب من واقع صورة الاستمارة 111 ع.ح. التي ترد إليه من أمين المخزن بإضافة الكعوب المرتجعة.</li><li>على الطبيب أو مندوبه التحقق من ختم كل التذاكر والتوقيع بما يفيد ذلك على السجل المشار إليه.</li><li>عند انتهاء استخدام الدفاتر ترتجع لنفس أمين المخزن، وعليه التحقق أنها منصرفة من نفس المخزن وأنها لا تحتوي على صور تذاكر مفقودة أو أصول لم تستخدم غير ملغاة. وعلى الطبيب التحقق من تسديد بيانات الارتجاع المشار إليها أعلاه بنفس سجل الاستلام، ويوقع بما يفيد الارتجاع للكعب.</li><li>لا يقوم أمين المخزن بصرف أكثر من دفتر من كل فئة في الدفعة الواحدة (فيما عدا المناطق النائية)، ويقوم الطبيب بالتوقيع في السجل المخصص لذلك.</li></ul>","31": "<div class=\"fmt-p\">وتقسم الفاتورة إلى الخانات الرأسية التالية:</div><ul class=\"fmt-ul\"><li>مسلسل (رقم المسلسل للتذكرة الموضوع بمعرفة الصيدلية)</li><li>اسم المنتفع أو الطالب أو المولود</li><li>الرقم التأميني للمنتفع أو الطالب أو المولود</li><li>رقم التذكرة المسلسل المطبوع عليها</li><li>تاريخ تحرير التذكرة</li><li>إجمالي قيمة الأدوية</li><li>المبلغ المسدد</li><li>الباقي</li><li>اسم وتخصص الطبيب</li></ul><div class=\"fmt-p\">وفي نهاية الفاتورة يتم جمع الخانات الحسابية رأسياً وتوقيع صاحب الصيدلية وختم الصيدلية، مع مراعاة عدم ترحيل إجمالي الفاتورة وإنما تستقل كل فاتورة بمجموعها لتسهيل إجراء التصويب عند المراجعة.</div><div class=\"fmt-p\">يتم حصر إجمالي المطالبة لتذاكر الممارس/الأخصائي/الاستشاري على نموذج تفريغ للفواتير كالتالي (من أصل وصورتين):</div><div class=\"fmt-h2\">فاتورة إجمالية لتذاكر (الممارس / الأخصائي / الاستشاري) — قانون ( ) — عن الفترة من .......... إلى ..........</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>رقم الفاتورة</th><th colspan=\"2\">الإجمالي</th><th colspan=\"2\">المسدد من المنتفع</th><th colspan=\"2\">الباقي</th></tr><tr><th></th><th>جنيه</th><th>قرش</th><th>جنيه</th><th>قرش</th><th>جنيه</th><th>قرش</th></tr></thead><tbody><tr><td class=\"vt-num\">1</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">2</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">3</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">4</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">5</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr class=\"fmt-vtable-section\"><td colspan=\"7\">المجموع</td></tr></tbody></table></div><div class=\"fmt-p\" style=\"display:flex;justify-content:space-between\"><span>توقيع صاحب الصيدلية</span><span>ختم الصيدلية</span></div><div class=\"fmt-note\">في حالة وجود فاتورة واحدة فقط، لا داعي لعمل النموذج، مع مراعاة أي تعليمات تفصيلية صادرة عن الفروع بخصوص تحرير المطالبات. مع فصل تذاكر المزمن المجاني للطالب عن تذاكر الأخصائي غير المزمن.</div>","32": "<div class=\"fmt-p\">ثم عمل كشف مطالبة نهائي من أصل وصورتين على النموذج كالتالي:</div><div class=\"fmt-h2\">اسم الصيدلية / عنوانها / الرقم الكودي / اسم صاحبها — المطلوب من الهيئة العامة للتأمين الصحي فرع .......... عن الفترة من .......... إلى .......... قانون ( )</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>النوع</th><th>عدد التذاكر</th><th>عدد الفواتير</th><th>عدد الدوسيهات</th><th colspan=\"2\">الإجمالي</th><th colspan=\"2\">المسدد</th><th colspan=\"2\">الباقي</th></tr><tr><th></th><th></th><th></th><th></th><th>ج</th><th>ق</th><th>ج</th><th>ق</th><th>ج</th><th>ق</th></tr></thead><tbody><tr><td>ممارس</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>أخصائي</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>إستشاري</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr class=\"fmt-vtable-section\"><td colspan=\"10\">الإجمالي</td></tr></tbody></table></div><div class=\"fmt-note\">فقط مبلغ وقدره: ......................................... لا غير</div><div class=\"fmt-p\">توضع الفواتير والكشوف والمطالبة النهائية في ملف مستقل وتسلم المطالبة للفرع المختص، ويكرر ما سبق لكل قانون، حيث يسلم لكل قانون على حدة:</div><ul class=\"fmt-ul\"><li>ملف أو أكثر به تذاكر الممارس.</li><li>ملف أو أكثر به تذاكر الأخصائي وتكرار علاج الأخصائي.</li><li>ملف أو أكثر به تذاكر الاستشاري وتكرار علاج الاستشاري.</li><li>ملف واحد أو أكثر به كشوف التفريغ والفواتير والمطالبة النهائية.</li></ul><div class=\"fmt-p\">يتم التسليم في المواعيد المحددة لكل صيدلية وحتى خمسة أيام على الأكثر:</div><ul class=\"fmt-ul\"><li>يوم 1 من كل شهر للدفعة (أ)</li><li>يوم 10 من كل شهر للدفعة (ب)</li><li>يوم 20 من كل شهر للدفعة (ج)</li><li>أو أي مواعيد أخرى يحددها الفرع المختص</li></ul><div class=\"fmt-p\">ويتم التسليم للموظف المختص بالهيئة، مقابل التوقيع على صورة المطالبة النهائية بالاستلام تحت المراجعة، وتحتفظ الصيدلية بهذه الصورة، بالإضافة لصورة من الفواتير والكشوف السابقة حتى ورود الشيك.</div><div class=\"fmt-note\">وعلى الصيدلية المتعاقدة المطالبة شهرياً عند تسليم المطالبات ببيانات المخالفات عن المطالبات السابقة لمعرفة الأخطاء وتفاديها حتى لا تتكرر.</div>","38": "<div class=\"fmt-h\">آلية التعامل مع اللجنة العليا للدواء</div><ul class=\"fmt-ul\"><li>الالتزام بالبروتوكولات السابق إرسالها وعدم كتابة أدوية غير مسجلة وغير مسعّرة بوزارة الصحة.</li><li>لا بد من إرسال طلبات الأدوية إلى اللجنة العليا مباشرةً وليس عن طريق المريض، على أن تكون مستوفاة لجميع الفحوصات ومدونة بالحاسب الآلي وليست بخط اليد، ومرفق بها صورة من بطاقة الرقم القومي وصورة البطاقة العلاجية.</li><li>لن يُلتفت إلى أي تقرير صادر من اللجنة الثلاثية بالفرع غير مستوفٍ لتاريخ العرض على اللجنة وتوقيع وأختام أعضاء اللجنة والمقرر.</li><li>عند إرسال طلبات الأدوية يجب أن يكون اسم المريض رباعياً ومطابقاً للاسم المذكور على صورة بطاقة الرقم القومي للمريض (ولن يُلتفت إلى الطلبات غير المستوفاة لهذا الشرط).</li><li>التقارير المرسلة يجب أن تشتمل على العلاج المطلوب بالجرعة المحددة والتاريخ المرضي وخطوط العلاج السابقة ومدى الاستجابة لها.</li><li>يقوم التموين الطبي بالفرع بفتح سجل لتسجيل الموافقات الخاصة باللجنة العليا للدواء، مع الاحتفاظ بصورة منها وتسليم الأصل لمدير الصيدلية بالعيادة وصورة للمريض بعد ختمهما بختم التموين الطبي بالفرع.</li><li>عند تحويل المريض إلى خط علاجي آخر مختلف عن قرار اللجنة العليا، يتم إصدار تقرير جديد من اللجنة الثلاثية بإيقاف قرار اللجنة، ويتم إخطار اللجنة العليا بذلك والأسباب.</li><li>في حالات الموافقة على التكرار عن طريق الفرع، يكون التكرار بمعرفة نفس لجنة الأورام بالفرع التي عرض عليها المريض عند رفع الطلب إلى اللجنة العليا، وليس الاستشاري أو لجنة أخرى.</li><li>في حالات التكرار يجب إرسال فحوصات حديثة للتقييم مرفق بها مقارنة للحالة قبل وبعد العلاج، مع ضرورة إرفاق بيان بعدد الموافقات السابقة وتواريخها وعدد الجرعات المستخدمة فعلياً عند التكرار من اللجنة العليا.</li><li>يقوم الطبيب المسئول بتحرير تذكرة طبية للمريض ويرفق بها صورة من قرار اللجنة.</li><li>يقوم مدير الصيدلية بعمل ملف لحفظ قرارات اللجنة ووضع أرقام مسلسلة لها من الأقدم إلى الأحدث بداية كل سنة مالية (مع الاحتفاظ بالقرارات المستمر تنفيذها في السنة الجديدة).</li></ul><div class=\"fmt-p\">يتم فتح دفتر (حرف ز) بالأدوية الخاصة بقرارات اللجنة على النموذج التالي — اسم الصنف: ..........</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>اسم المريض</th><th>تاريخ القرار ورقمه</th><th>عدد الجرعات أو الشهور</th><th>الجرعة الأولى</th><th>الجرعة الثانية</th><th>الجرعة الثالثة</th><th>...إلخ</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div>","15": "<div class=\"fmt-h\">وصف الدواء</div><div class=\"fmt-p\">يقتصر وصف الأدوية المدرجة بدليل أدوية الهيئة نوعاً وعدداً وكماً تبعاً للقواعد المنظمة لصرف الأدوية كالآتي:</div><ol class=\"fmt-ul\"><li>أصناف توصف بمعرفة الطبيب الممارس والأخصائي والاستشاري، ويرمز بجانبها بالرمز Gp.</li><li>أصناف توصف بمعرفة الطبيب الأخصائي والاستشاري ويرمز بجانبها بالرمز Sp.</li><li>أصناف توصف بمعرفة الطبيب الاستشاري فقط ويرمز بجانبها بالرمز Con.</li></ol><div class=\"fmt-h2\">سلطة الوصف — الممارس (الرمز Gp.)</div><div class=\"fmt-p\">يلتزم بوصف الأدوية المحددة للممارس فقط.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الفئة</th><th>الحد الأقصى</th></tr></thead><tbody><tr><td class=\"vt-num\">نوعاً</td><td>بحد أقصى في الزيارة الواحدة بما يكفي علاج أربعة أيام طبقاً للجرعة اليومية التي يحددها الطبيب. في حالة الربو الشعبي وضغط الدم يحق له كتابة ما يكفي علاج أسبوع. وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام.</td></tr><tr><td class=\"vt-num\">عدداً</td><td>بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة.</td></tr></tbody></table></div><div class=\"fmt-h2\">سلطة الوصف — الأخصائي (الرمز Sp.)</div><div class=\"fmt-p\">يلتزم بوصف الأدوية المحددة للأخصائي بالإضافة للأدوية المحددة للممارس.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الفئة</th><th>الحد الأقصى</th></tr></thead><tbody><tr><td class=\"vt-num\">نوعاً / كماً</td><td>بحد أقصى في الزيارة الواحدة بما يكفي علاج أسبوع طبقاً للجرعة اليومية التي يحددها الطبيب، حتى ولو أدى ذلك لوصف أكثر من عبوة. وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام. أما في حالة الأمراض المزمنة المستقرة علاجياً فيمكن للأخصائي وصف علاج في الزيارة الواحدة لمدة حدها الأقصى شهرين طبقاً لمدى استقرار الحالة.</td></tr><tr><td class=\"vt-num\">عدداً</td><td>بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة للكبار والمواليد والطلبة. أما إذا كان التشخيص لأكثر من مرض مزمن فيمكن لأخصائي واحد أو أكثر وصف لغاية ستة أصناف في الزيارة الواحدة (مع مراعاة أن للكبار جدول للأمراض المزمنة وللطلبة جدول آخر).</td></tr></tbody></table></div><div class=\"fmt-h2\">سلطة الوصف — الاستشاري (الرمز Con.)</div><div class=\"fmt-p\">وله الحق في وصف جميع الأدوية المدرجة بالدليل ولا يجوز له الخروج عنها إلا في الحالات الحرجة التي ترفق بها التحاليل الطبية وبموافقة اللجنة العليا للدواء (على ألا يكون من مجموعة الفيتامينات أو الأدوية التي تحتوي على حبوب اللقاح أو غذاء ملكات النحل)، وأن يكون مسجلاً بوزارة الصحة ومدوناً بالعبوة ذلك وأن يكون مسعّراً جبرياً. كماً وعدداً مثل الأخصائي.</div><div class=\"fmt-h2\">أطباء الأسنان</div><div class=\"fmt-p\">يصرح لهم بوصف أدوية الممارس فقط، فيما عدا الحاصلين على دبلوم أو ماجستير تخصص علي الأقل ويعاملون بهذه الصفة بالهيئة، فيجوز لهم وصف أدوية الأخصائي، ويحددهم مدير الشئون الطبية المختص بكل فرع.</div>","17": "<div class=\"fmt-h\">الأمراض المزمنة</div><div class=\"fmt-p\">بالنسبة للمنتفعين بقانون 79 والتي يشار إليها إجمالاً بالكبار، وهو ما جاء بالمادة الثالثة من قرار رئيس مجلس الإدارة رقم 1966 لسنة 2001. والأمراض المزمنة بقرار وزير الصحة رقم 321 لسنة 1992 وتعديلاته بالنسبة للطلبة، والتي استقرت علاجياً.</div><div class=\"fmt-h2\">أولاً: قوائم الأمراض المزمنة المحددة بالنسبة للمنتفعين بقانون رقم 79 — اسم المرض</div><ol class=\"fmt-ul\"><li>الأمراض الخبيثة بجميع أجزاء الجسم</li><li>الدرن بأنواعه</li><li>أمراض الدم المزمنة<ul class=\"fmt-ul\"><li>مرض تزايد كرات الدم الحمراء</li><li>اللوكيميا</li><li>الأنيميا المزمنة</li><li>الأنيميا الخبيثة</li><li>نقص صفائح الدم</li><li>الهيموفيليا</li></ul></li><li>أمراض الجهاز الدوري والقلب ومضاعفاتها<ul class=\"fmt-ul\"><li>ارتفاع ضغط الدم المزمن</li><li>أمراض القلب المزمنة ومضاعفاتها وأمراض القلب الخلقية ومضاعفاتها</li><li>أمراض الشرايين التاجية ومضاعفاتها</li><li>التهاب وانسداد الأوعية الدموية ومضاعفاتها</li><li>مرض رينودز</li><li>مرض بيرجر</li></ul></li><li>أمراض الجهاز الهضمي<ul class=\"fmt-ul\"><li>تمدد أوردة المريء ومضاعفاتها</li><li>قرحة المعدة والاثني عشر</li><li>الالتهاب البريتوني المزمن</li><li>تضخم الطحال المصحوب بمضاعفات خطيرة</li><li>أمراض الكبد المصحوبة epsy</li><li>Organic Paralysis</li><li>Chronic Neurological Organic Diseases</li><li>Chronic Psychiatric &amp; Mental Diseases</li></ul></li><li>Chronic Respiratory Diseases<ul class=\"fmt-ul\"><li>Bronchiectasis</li><li>Cystic Lung Diseases</li><li>Pleural Effusions</li><li>Emphysema</li></ul></li><li>Endocrine, Lymph &amp; Metabolic Diseases<ul class=\"fmt-ul\"><li>Chronic Sexual Organic Diseases</li><li>Thyrotoxicosis</li><li>Myxedema</li><li>Diabetes Mellitus &amp; Its Complications</li><li>Chronic Pituitary Diseases</li><li>Chronic Parathyroid Diseases</li><li>Lupus Erythematosus</li><li>Gout</li><li>Hodgkin's Disease</li><li>Elephantiasis</li><li>Lymphadenopathy</li><li>Chronic Supra-Renal Diseases</li></ul></li><li>Chronic Skin Disease<ul class=\"fmt-ul\"><li>Chronic Eczema</li><li>Chronic Neuro-Dermatitis</li><li>Psoriasis</li><li>Lichen Planus</li><li>Pemphigus</li><li>Vitiligo</li><li>T.B. Skin</li><li>Systemic Sclerosis, Mycosis Fungoides</li><li>Behcet's Disease</li></ul></li><li>Chronic Eye Diseases<ul class=\"fmt-ul\"><li>Chronic Myopic Degenerative Diseases</li><li>Retinal Detachment</li><li>Chronic Iridocyclitis</li><li>Chronic Glaucoma</li><li>Chronic Optic Neuritis Diseases</li><li>Diabetic Retinopathy</li></ul></li><li>Leprosy</li></ol><div class=\"fmt-h2\">أسم المرض (تابع)</div><ol class=\"fmt-ul\" start=\"8\"><li>أمراض الجهاز العصبي المزمنة<ul class=\"fmt-ul\"><li>الصرع بأنواعه</li><li>الشلل العضوي</li><li>أمراض الجهاز العصبي العضوية المزمنة</li><li>الأمراض النفسية والعقلية المزمنة</li></ul></li><li>أمراض الجهاز التنفسي المزمنة<ul class=\"fmt-ul\"><li>تمدد الشعب الهوائية</li><li>تكيسات الرئة</li><li>الانسكابات البلورية بأنواعها</li><li>الأمفيزيما</li></ul></li><li>أمراض الغدد الصماء والتمثيل الغذائي والجهاز الليمفاوي<ul class=\"fmt-ul\"><li>أمراض الغدد الجنسية فيما عدا العقم (فيرجع للبروتوكول المنظم لعلاجه)</li><li>التسمم الدرقي</li><li>هبوط نشاط الغدة الدرقية</li><li>مرض السكر ومضاعفاته</li><li>أمراض الغدة النخامية</li><li>أمراض الغدد جارات الد لحساب صيدلية متعاقدة.</div><div class=\"fmt-penalties\"><div class=\"fmt-penalty\"><span class=\"fmt-penalty-lbl\">أول مرة</span><span class=\"fmt-penalty-val\">الصيدلية المتعاقدة: إيقاف التعامل ثلاث سنوات ومصادرة التأمين. الصيدلية الغير متعاقدة: الإحالة للنقابة للمساءلة التأديبية مع تأخير التعاقد ثلاث سنوات.</span></div><div class=\"fmt-penalty\"><span class=\"fmt-penalty-lbl\">ثاني مرة</span><span class=\"fmt-penalty-val\">الصيدلية المتعاقدة: إيقاف التعامل خمس سنوات ومصادرة التأمين. الصيدلية الغير متعاقدة: عدم التعاقد نهائياً.</span></div><div class=\"fmt-penalty\"><span class=\"fmt-penalty-lbl\">ثالث مرة</span><span class=\"fmt-penalty-val\">الصيدلية المتعاقدة: إيقاف التعامل نهائياً ومصادرة التأمين. الصيدلية الغير متعاقدة: لا ينطبق</span></div></div></div></div>","75": "<div class=\"fmt-h\">ضوابط استخدام مثبطات المناعة بعد زرع الكلى</div><div class=\"fmt-drug\"><div class=\"fmt-drug-name\">سانديميون</div><div class=\"fmt-drug-cond\"><div class=\"fmt-drug-cond-lbl\">في حالة وجود حساسية مفرطة على المدى القصير (أسابيع) مدعمة بالتحاليل المعملية والباثولوجية، يُستبدل بـ</div><ol class=\"fmt-ul\"><li>راباميون 1-2 مجم في اليوم مع استخدام أقراص كيتوكونازول 200 ملجم ¼ قرص صباحاً ومساءً.</li><li>أو بروجراف 1-2 ملجم / اليوم + كيتوكونازول 200 ملجم ¼ قرص صباحاً ومساءً.</li></ol></div><div class=\"fmt-drug-cond\"><div class=\"fmt-drug-cond-lbl\">ب. في حالة وجود آثار جانبية على المدى الطويل (سنوات) مدعمة بالتحاليل المعملية والباثولوجية، وكانت كفاءة الكلى باستخلاص الكرياتنين أقل من 40 مللي لتر في الدقيقة</div><div class=\"fmt-p\">تُقلَّل الجرعة بالتدريج على مدى شهور إلى 1-2 ملجم/كجم/يوم، ومستوى العقار بالدم يبين 250-400 مجم بعد ساعتين من أخذ العينة أو 40-70 ملجم بعد أخذ العينة مباشرة، أو يوقف نهائياً بالتدرج البطيء.</div></div><div class=\"fmt-p\">في حالة حدوث رفض مدعم بالعينات الباثولوجية بعد إيقاف العقار الأول، يُعالَج المريض بالسوليوميدرول بالوريد مؤقتاً، ثم يعاد العقار الأول بجرعة مخفضة، ويُستبدل العقار الثاني بالسلسبت 1-2 جم/اليوم مع التأكد من توقف تدهور وظائف الكلى.</div><div class=\"fmt-p\">في حالة عدم وجود استجابة لعقار السلسبت، يُستبدل السلسبت بالإيميوران مرة أخرى.</div><div class=\"fmt-p\">يمكن في الحالة (ب) — إذا كان استخلاص الكرياتنين من 40-65 مللي لتر في الدقيقة — أن يُستبدل سانديميون بالراباميون 1 مجم مرتين يومياً + كيتوكونازول أقراص ¼ قرص كل 12 ساعة مع الإيميوران بالشروط السابقة.</div></div><div class=\"fmt-drug\"><div class=\"fmt-drug-name\">ايميوران</div><div class=\"fmt-drug-cond\"><div class=\"fmt-drug-cond-lbl\">أ. في حالة الحساسية المفرطة على المدى القصير بالتحاليل المعملية</div><div class=\"fmt-p\">يُستبدل العقار الثاني بالسلسبت 1-2 جم/يوم مقسمة على جرعتين، بعد التأكد من تحسن وظائف الكبد بعد إيقاف الإيميوران.</div></div><div class=\"fmt-drug-cond\"><div class=\"fmt-drug-cond-lbl\">ب. في الحالات الحرجة ذات القابلية العالية للرفض (مثل إعادة الزرع أو حدوث رفض أكثر من مرة)</div><div class=\"fmt-p\">يُستبدل العقار الثاني بالسلسبت.</div></div><div class=\"fmt-drug-cond\"><div class=\"fmt-drug-cond-lbl\">ج. في الحالات التي تمت زراعتها خارج الهيئة ثم حُوِّلت إلى عيادات الهيئة وكانت تُعالَج بالسلسبت</div><div class=\"fmt-p\">يُحوَّل السلسبت إلى إيميوران، ما لم توجد آثار جانبية كالحساسية المفرطة، خاصة إذا كان قد مر على الزرع 3 شهور، ويُسحب السلسبت تدريجياً مع إدخال جرعات صغيرة من الإيميوران مع متابعة لصيقة لوظائف الكلى.</div></div></div><div class=\"fmt-note\">أخلاقياً وعلمياً، يجب عدم إجراء زرع كلى في حالة وجود مرض بدرجة مؤثرة في الكبد مدعم بالفحص السريري والموجات الصوتية وتحاليل الكبد، وفي حالة وجود شك يجب أخذ عينة باثولوجية. وفي حالة وجود احتمالات عالية للرفض يُستحسن عدم الزرع، وفي حالات الضرورة القصوى يُعطى عقار السيميلوكت (الأجسام المضادة) في جرعتين: يوم الزرع واليوم الرابع.</div>","111": "<div class=\"fmt-h\">الجرعات المناسبة لعلاج النزيف حسب نوعه ومكانه — هيموفيليا أ و ب</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th rowspan=\"2\">نوع النزيف</th><th colspan=\"2\">هيموفيليا أ (عامل 8)</th><th colspan=\"2\">هيموفيليا ب (عامل 9)</th></tr><tr><th>المستوى المرغوب</th><th>الجرعة</th><th>المستوى المرغوب</th><th>الجرعة</th></tr></thead><tbody><tr><td>المفاصل</td><td>%40</td><td>20 وحدة/كجم/12 ساعة، وإن استمر المفصل متورماً بعد 24 ساعة يتم دخوله المستشفى يستكمل العلاج لمدة يومين آخرين ويعطى بريدنيزون 2 مجم/كجم يوم لمدة يوم واحد ثم 1 مجم/كجم/يوم لمدة يومين</td><td>%40</td><td>40 وحدة/كجم/24 ساعة، وإن استمر المفصل متورماً بعد 24 ساعة يتم دخوله المستشفى يستكمل العلاج لمدة يومين آخرين ويعطى بريدنيزون 2 مجم/كجم يوم لمدة يوم واحد ثم 1 مجم/كجم/يوم لمدة يومين</td></tr><tr><td>الجهاز العصبي المركزي والدماغ داخل المستشفى</td><td>أولاً %80-%100 ثم %50</td><td>40-50 وحدة/كجم/8 ساعات لمدة يوم واحد، ثم 40-50 وحدة/كجم/12 ساعة لمدة 8 أيام، ثم 25 وحدة/كجم/12 ساعة لمدة 7 أيام</td><td>أولاً %80-%100 ثم %50</td><td>50 وحدة/كجم/6 ساعات لمدة يوم واحد، ثم 50 وحدة/كجم/12 ساعة لمدة 3 أيام، ثم 50 وحدة/كجم/24 ساعة لمدة 12 يوماً</td></tr></tbody></table></div>","107": "<div class=\"fmt-h\">مرض الهيموفيليا (Hemophilia) وتشخيصه</div><div class=\"fmt-p\">مرض الهيموفيليا Hemophilia وتشخيصه</div><div class=\"fmt-p\">الهيموفيليا (أ) و (ب) هو مرض وراثي ويورث.<br>- سبب المرض هو نقص عامل 8 (Factor 8) وعامل 9 (Factor 9) على التوالي.<br>- نسبة المرض لنقص في عامل 8 (Factor 8) واحد لكل 10000 مولود ذكر تقريباً، وللنقص في عامل 9 (Factor 9) تكون تقريباً واحد لكل 30 إلى 50 ألف مولود ذكر.<br>- تشخيص المرض:<br>* خطوة أولى: <br>- تاريخ مرضي للنزف المتكرر.<br>- زمن البروثرومبين PT طبيعي.<br>- زمن ثرومبوبلاستين PTT أكبر من الطبيعي.<br>- زمن النزف طبيعي.<br>* خطوة ثانية:<br>- يتم عمل تحليل لمستوى عامل 8، 9 (Factor 8 &amp; 9) في الدم.<br>ملحوظة: (Factor 8 &amp; 9) ومركزات الكريو وFresh Frozen Plasma المدرجة بالبروتوكول يتم إعطائها للمريض داخل وحدات الهيئة.</div><div class=\"fmt-p\">التقسيم الإكلينيكي للأشخاص المصابين بمرض الهيموفيليا (أ) ، (ب):</div><div class=\"fmt-h2\">التقسيم الإكلينيكي للأشخاص المصابين بمرض الهيموفيليا (أ)، (ب)</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الدرجة</th><th>نسبة العامل</th><th>النزف التلقائي</th><th>تكرار النزف</th><th>إصابة المفاصل</th></tr></thead><tbody><tr><td class=\"vt-num\">هيموفيليا شديدة</td><td>عادة أقل من 1% نسبة العامل (Factor 8) أو (Factor 9)</td><td>النزف التلقائي عرض شديد ومتكرر</td><td>يمكن أن ينزف مرة أو مرتين أسبوعياً</td><td>يتميز بإصابات المفاصل (نزيف بالمفاصل)</td></tr><tr><td class=\"vt-num\">هيموفيليا متوسطة</td><td>من 1% إلى 5% نسبة العامل (Factor 8) أو (Factor 9)</td><td>نزف مع الإصابات البسيطة</td><td>يمكن أن ينزف مرة واحدة شهرياً</td><td>يمكن أن تصاب المفاصل</td></tr><tr><td class=\"vt-num\">هيموفيليا بسيطة</td><td>أكثر من 5% إلى 30% نسبة العامل (Factor 8) أو (Factor 9)</td><td>نزف مع الإصابات الشديدة والعمليات الجراحية</td><td>يمكن ألا يعاني من النزيف أبداً</td><td>نادراً ما تصاب المفاصل</td></tr></tbody></table></div><div class=\"fmt-p\">يتم علاج الحالات بدون نزف خارج المستشفى، أما في حالات النزف فيتم العلاج داخل المستشفى أو خارجها حسب شدة الحالة ومكان النزف.</div><div class=\"fmt-p\">علاج تعويضي لحالات الهيموفيليا الشديدة (Factor 8) نسبة أقل من 1%:<br>يمكن إعطاء علاج تعويضي من دواء Anti Hemophilic Globulin بمعدل زجاجة واحدة تحتوي على 200 وحدة محضرة في هيئة المصل واللقاح بمعدل 3 مرات أسبوعياً.</div>","103": "<div class=\"fmt-h\">بروتوكول العلاج الخاص للتخلص من الحديد الزائد في مرضى أنيميا البحر المتوسط</div><div class=\"fmt-h2\">أولاً: العلاج بعقار ExJade</div><div class=\"fmt-p\">أولاً -: بروتوكول العلاج الخاص للتخلص من الحديد الزائد باستخدام دواء ExJade. يستخدم عقار Exjade لمرضى أنيميا البحر المتوسط لعلاج زيادة الحديد بالجسم للأطفال من 2 إلى 10 سنوات والمرضى المصابين بحساسية أو مضاعفات من أنواع العلاج الأخرى. ويتم احتساب جرعة الإكسجيد طبقاً لمستوى الفريتين في دم المريض وذلك على النحو التالي:</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Ferritin Level (ng/ml)</th><th>Exjade Dose</th></tr></thead><tbody><tr><td>1000-2000</td><td>20mg/kg/day</td></tr><tr><td>2000-3000</td><td>25mg/kg/day</td></tr><tr><td>3000-4000</td><td>30mg/kg/day</td></tr><tr><td>&gt; 4000</td><td>30-40mg/kg/day</td></tr></tbody></table></div><div class=\"fmt-h2\">ثانياً -</div><div class=\"fmt-p\">التعاون في مجال زرع النخاع لأطفال مرضى الدم بالتأمين الصحي في وحدة زرع النخاع بمستشفى الأطفال الجامعي:\nواتفقت اللجنة أيضاً على قيام قسم أمراض الدم وزرع النخاع بمستشفى الأطفال الجامعي (أبو الريش المنيرة) باستقبال وعمل زرع الخلايا الجذعية لمرضى أنيميا البحر المتوسط وفشل النخاع العظمي وغيرها من أمراض الدم بالتأمين الصحي.</div>","37": "<div class=\"fmt-h\">آلية صرف أدوية الاسم التجاري</div><div class=\"fmt-h2\">آلية صرف أدوية الاسم التجاري</div><ul class=\"fmt-ul\"><li>يتم التوريد من الشركات إلى المخازن بناءً على أمر توريد صادر من التموين الطبي مع ذكر أن البضاعة موردة بصفة أمانة في شرط التوريد.</li><li>إضافة الأصناف الموردة من الشركات في دفتر 3 م0ح مع تسجيل بيانات الفاتورة لكل صنف في خانة الملاحظات (وبقاء أصل الفاتورة بالمخزن وصورة من الفاتورة للمراجعة الفنية بالفرع وصورة للحسابات).</li><li>يتم الصرف من المخزن لصيدليات الاسم التجاري على أذون 2 م0ح أصل وصورتين مع الاحتفاظ بأصل الأذون في المخزن.</li></ul><div class=\"fmt-p\">صيدلية الاسم التجاري-:\n- إضافة الكميات الموردة من المخزن إلى الصيدلية في الدفاتر.\n- التأكد من استكمال بيانات تذكرة 56 ب المحررة بمعرفة الصيدلية الرئيسية (بيانات المنتفع – التشخيص – تاريخ الكشف - توقيع وأكلاشيه الطبيب – خاتم الشعار) وتحديد قيمة ما يتحمله المنتفع للصنف المطلوب بمعرفة صيادلة الاسم التجاري.\n- تحصل قيمة الأصناف من المنتفع بمعرفة الإيرادات كل شركة على حدة مع فصل الموازنات.\n- ترفق صورة إيصال الدفع بتذكرة 56 ب.\n- يتم تنزيل الكمية المنصرفة يومياً في استمارة 9 ت0ص أو استمارة 321 أو شيت الكمبيوتر.\n- ثم القيد في دفتر اليومية 322 والمطابقة مع مراقب العهدة يومياً.\n- تجمع الكميات المنصرفة للأصناف في أذون 2 م0ح كل شركة على حدة نهاية كل شهر يوم 25 (اليوم الخامس والعشرون من الشهر) وترفق بالمطالبات طبقاً للكشف المقترح من الإدارة العامة للتموين الطبي والصيدليات.</div><div class=\"fmt-h2\">إجمالي الأصناف المنصرفة لكل شركة (نهاية كل شهر)</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>اسم الشركة</th><th>عدد التذاكر</th><th>الإجمالي بسعر الشراء</th><th>المسدد</th><th>الباقي</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><div class=\"fmt-p\">وترسل للمراجعة الفنية بالفرع في موعد أقصاه يوم 27 (اليوم السابع والعشرون من الشهر).\n- وعند وجود أخطاء بالمطالبة تعاد بعد ثلاثة أيام لصيدلية الاسم التجاري مرفق بها أذون 2 م0ح لفصل الروشتات الوارد بها أخطاء عن باقي المطالبة وتعديل الكمية الفعلية المنصرفة والقيمة المالية والكمية المتبقية في أذون 2 م0ح.\n- وتعاد خلال يومين بعد التعديل إلى المراجعة الفنية بالفرع للمطابقة والتوقيع.\n- وتخصم الكميات من الدفاتر بمعرفة أصحاب العهدة بموجب أذون 2 م0ح المراجعة والموقعة عليها من المراجعة الفنية بحيث يتم الانتهاء من ذلك في موعد أقصاه اليوم الخامس من الشهر التالي.\n- عند تكرار صرف الصيدلية من المخزن لنفس الأصناف يتم تقديم صور من أذون 2 م0ح السابقة.</div>"};

function hl(t, q) {
if(!q.trim()) return t;
let w = norm(q).split(/\s+/).filter(x=>x.length>1);
if(!w.length) return t;
let pat = w.map(x=>x.split('').map(c=>escR(c)).join('.{0,2}')).join('|');
return t.replace(new RegExp(`(?![^<]*>)(${pat})`,'gi'), '<mark>$1</mark>');
}
const ORD_WORDS = ['اولا','ثانيا','ثالثا','رابعا','خامسا','سادسا','سابعا','ثامنا','تاسعا','عاشرا'];
const LIST_RE = /^(?:[•*]\s*|-\d+\s*|\.\d+\s*|\d+[.\-\)]\s*|-\s+|[أ-ي][.\)]\s+|[a-zA-Z][.\)]\s+)/;
const BARE_NUM_RE = /^\d{1,3}$/;
const LONE_BULLET_RE = /^[•*\-]$/;
const END_PUNCT_RE = /[.,،؛]$/;
function isOrdinal(t) {
if(t.length >= 90) return false;
let n = norm(t);
return ORD_WORDS.some(w => n.startsWith(w));
}
function mergeLoneBullets(lines) {
let out = []; let i = 0;
while(i < lines.length) {
let t = lines[i].trim();
if(LONE_BULLET_RE.test(t)) {
let j = i + 1;
while(j < lines.length && lines[j].trim() === '') j++;
if(j < lines.length && lines[j].trim() !== '') { out.push('• ' + lines[j].trim()); i = j + 1; continue; }
}
out.push(lines[i]); i++;
}
return out;
}
function classifyPage(txt) {
let rawLines = txt.split('\n').map(l => l.trim());
let lines = mergeLoneBullets(rawLines);
let out = []; let prevBlank = true, lastKind = null, firstSeen = false, mode = 'NORMAL';
for(let i = 0; i < lines.length; i++) {
let t = lines[i];
if(t === '') { prevBlank = true; continue; }
let boundary = prevBlank || lastKind === 'H1' || lastKind === 'H2' || lastKind === null;
let isFirst = !firstSeen; firstSeen = true;
let isBareNum = BARE_NUM_RE.test(t);
let isList = LIST_RE.test(t);
let isOrd = isOrdinal(t);
let isHeaderCand = boundary && t.length < 70 && !END_PUNCT_RE.test(t) && !isList && !isBareNum;
let kind;
if(isFirst && (isList || isBareNum) && t.length < 60) { kind = 'H1'; mode = 'NORMAL'; }
else if(isBareNum && boundary) { kind = 'CARD_START'; mode = 'CARD'; }
else if(mode === 'CARD') { if(isOrd) { kind = 'H2'; mode = 'NORMAL'; } else kind = 'CARD_FIELD'; }
else if(isOrd) kind = 'H2';
else if(isHeaderCand) kind = isFirst ? 'H1' : 'H2';
else if(isList) kind = 'LI';
else kind = 'P';
out.push({ kind, text: t, ord: isOrd });
lastKind = kind; prevBlank = false;
}
let j = 0;
while(j < out.length) {
if(out[j].kind === 'H2' && !out[j].ord) {
let k = j;
while(k < out.length && out[k].kind === 'H2' && !out[k].ord) k++;
if(k - j >= 3) for(let m = j; m < k; m++) out[m].kind = 'P';
j = k;
} else j++;
}
return out;
}
function decorate(t) {
return esc(t).replace(/([a-zA-Z0-9\-\.\+\_\/]{2,})/g, '<span class="en-text">$1</span>');
}
function formatText(txt, q='') {

const closeList = () => { if(inList) { out += '</ul>'; inList = false; } };
const closeCard = () => { if(inCard) { out += '</div></div>'; inCard = false; } };
blocks.forEach(b => {
let { kind, text } = b;
if(kind === 'LI') {
closeCard();
if(!inList) { out += '<ul class="fmt-ul">'; inList = true; }
let stripped = text.replace(LIST_RE, '');
out += `<li>${hl(decorate(stripped), q)}</li>`;
} else if(kind === 'CARD_START') {
closeList(); closeCard();
out += `<div class="fmt-card"><div class="fmt-card-num">${esc(st.l==='ar'?arN(text):text)}</div><div class="fmt-card-body">`;
inCard = true;
} else if(kind === 'CARD_FIELD') {
closeList();
if(!inCard) { out += `<div class="fmt-card"><div class="fmt-card-num">·</div><div class="fmt-card-body">`; inCard = true; }
out += `<div class="fmt-card-line">${hl(decorate(text), q)}</div>`;
} else {
closeList(); closeCard();
if(kind === 'H1') out += `<div class="fmt-h">${hl(decorate(text), q)}</div>`;
else if(kind === 'H2') out += `<div class="fmt-h2">${hl(decorate(text), q)}</div>`;
else out += `<div class="fmt-p">${hl(decorate(text), q)}</div>`;
}
});
closeList(); closeCard();
return out;
}

CMDS.forEach(c=>{ if(c.k.some(kw=>kw.includes(q)||q.includes(kw))){ let d=document.createElement('div'); d.className='c-res-item cmd-item'; d.innerHTML=`<div style="font-weight:700;color:var(--accent)"><span>${st.l==='en'?c.tEn:c.tAr}</span></div>`; d.onclick=()=>{clCmd();c.act();}; addR(d); } });

f.search(q).slice(0,25).forEach(r=>{ let d=document.createElement('div'); d.className='c-res-item'; let sn=r.item.c.substring(Math.max(0,r.matches[0].indices[0][0]-50), r.matches[0].indices[0][1]+80).trim(); d.innerHTML=`<div class="c-res-pg">${st.l==='en'?`Page ${arN(r.item.p)}`:`صفحة ${arN(r.item.p)}`}</div><div class="c-res-txt">${hl(esc(sn), q)}</div>`; d.onclick=()=>{clCmd();if(window.innerWidth<=768)togSb(false);rPage(r.item.p,r.item.p>st.p?1:-1,q);}; addR(d); });
}
if(count===0)cmdRes.innerHTML=`<div class="no-res">${UIDict[st.l].nores}</div>`;
}, 150);
};
let imm=false;

document.onkeydown = e => {
const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
const isCmdK = (e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'k' || e.code === 'KeyK');
const isSlash = (e.key === '/' || e.code === 'Slash') && !isInput;

if (isCmdK || isSlash) {
e.preventDefault();
if (cmdO) clCmd(); else opCmd();
return;
}

if (e.key === 'Escape') {
if (cmdO) return clCmd();
if (imm) return tImm();
if (isInput) return e.target.blur();
}

if (cmdO) {
const items = Array.from(cmdRes.querySelectorAll('.c-res-item'));
if (!items.length) return;
let idx = items.findIndex(i => i.classList.contains('sel'));
if (e.key === 'ArrowDown' || e.code === 'ArrowDown') {
e.preventDefault();
items[idx]?.classList.remove('sel');
idx = (idx + 1) % items.length;
items[idx].classList.add('sel');
items[idx].scrollIntoView({block: 'nearest'});
}
if (e.key === 'ArrowUp' || e.code === 'ArrowUp') {
e.preventDefault();
items[idx]?.classList.remove('sel');
idx = (idx - 1 + items.length) % items.length;
items[idx].classList.add('sel');
items[idx].scrollIntoView({block: 'nearest'});
}
if (e.key === 'Enter' || e.code === 'Enter') {
if (idx >= 0) {
e.preventDefault();
items[idx].click();
}
}
return;
}

if (isInput) return;

if (e.key === 'ArrowRight' || e.code === 'ArrowRight') {
if (st.l === 'ar') rPage(st.p - 1, -1); else rPage(st.p + 1, 1);
}
if (e.key === 'ArrowLeft' || e.code === 'ArrowLeft') {
if (st.l === 'ar') rPage(st.p + 1, 1); else rPage(st.p - 1, -1);
}
};

let tx=0, ty=0;
eId('rArea').addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;},{passive:true});

apL(); apT(st.t); apF(); bldNav(); rPage(st.p);
if(window.innerWidth>768) togSb(true);
