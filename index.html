on or any predisposing factor to develop perforation.\n10- Patients with no hypersensitivity or medical contraindication to the drug.\n11- Eligible patients will receive 3 cycles of Avastin containing regimens followed by evaluation.\n12- By the end of 3 cycles, patients will be evaluated radiologically & laboratory for response.\n13- Responding patients will continue for another 3 more cycles and reevaluated.\n14- Non responding patients will discontinue the drug.\n15- Patients developing grade 2/3 Toxicity should stop the drug.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Liposomal doxorubicin) Protocol\n\n• Patients with pathologically confirmed mucinous or serous ovarian adenocarcinoma\n• Good Performance status: 0-2.\n• Adequate hematologic values.\n• No serious co-morbidities.\n• No other malignancy\n• Adequate Renal & liver functions\n• Previous Taxane based chemotherapy\n• Baseline chest, abdomen & pelvis radiography.\n• Base line tumor marker: CA, 125.\n• Patients would receive 3 cycles. Then, evaluation.\n• Comparative radiography & tumor marker for evaluation\n• Responding patients continue 3 more cycles.\n• Stop therapy if there is disease progression or treatment related toxicity.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Cetuximab) Protocol\n\n- Patients with confirmed diagnosis of colonic adenocarcinoma.\n- Patients with proved metastatic/ recurrent disease with CTS, MRI, or PET/CT.\n- First line metastatic disease.\n- Good Performance status ECOG: 0-2.\n- Patients with confirmed all RAS wild aggressive genes (K-RAS & N-RAS).\n- Patients with normal blood values.\n- Patients with adequate liver & renal functions.\n- No serious co- morbidly.\n- No medical contraindications to the drugs.\n- No other malignancy.\n- Patients would receive 3 cycles, then reevaluated.\n- Responding patients will receive another 3 more cycles.\n- Non - responders should discontinue the drug.\n- Patients developing grade3/4 drug related toxicity should discontinue the drug.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Trastuzumab) Protocol.\n\nPatients with NON METASTATIC BREAST CANCER when they have:\n1- Pathologically Proven Breast Cancer.\n2- Confirmed Her-2 positivity.\n3- Axillary lymph nodes involvement. (Positive lymph nodes).\n4- High risk tumor with negative lymph node.\n5- Absence of serious co-morbid diseases.\n6- Absence of any contraindications for use of the drug.\n7- Adequte cardiac status with ejection fraction of >55%.\n\n• Patients with METASTATIC BREAST CANCER when they have:\n1- Patients with histologically confirmed breast cancer.\n2- HER-2 score 3+ ve by FISH.\n3- Measurable metastatic disease.\n4- NO PRIOR TARGETED THERAPY FOR BREAST CANCER.\n5- Normal cardiac functions.\n6- Normal CBC.\n7- Adequate liver & renal functions.\n8- Patients would receive 3 cycles, then reevaluated.\n9- Responding patients will continue 3 more cycles.\n10- Non responding patients should discontinue the drug.\n11- Patients developing gr.3/4 toxicities should discontinue the drug.", "• PRECAUTIONS for the drug use:\n\n1. Patients should be monitored regularly for cardiac functions.\n2. Fall of ejection fraction by ~10% before any cycle should be taken in consideration that may necessitate discontinuation of Herceptin.\n3. Patients with left sided breast cancer who received radiation therapy that may affect heart condition should be closely monitored for treatment related cardiac toxicity.\n4. Patients should have regular evaluation during therapy as development of disease progression or metastasis necessitates another treatment option.\n\n• adjuvant therapy with herceptin:\nOne year (16-17) adjuvant treatment, so for patient did not develop cardiac dysfunction or disease progression.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Rituximab) protocol\n\n• patients with pathologically confirmed: Large cell lymphoma\n• CD-20 positive\n• Good Performance status: 0-2.\n• Adequate hematological count\n• Adequate Renal & Liver functions\n• First line therapy\n• Base line evaluation CT scans.\n• No virus B infection\n• Absence of serious co - morbidities.\n• No Other malignancy\n• Evaluation after 3 cycles\n• Responding patients would continue the drug for more 3 cycles\n• Non responders should stop the drug", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Sorafenib) protocol\n\nPatients would be eligible if they have:\n1- Confirmed diagnosis of Hepatocellular carcinoma.\n2- Good performance status: ECOG. 0-1.\n3- No liver cirrhosis leading to elevation of liver enzymes or liver impairment\n4- Child A liver disease.\n5- Prothrombin concentration > 70%\n6- Total bilirubin < 1.5\n7- Serum albumin within normal limits\n8- Liver function within normal range.\n9- Renal function within normal range.\n10- No ascites.\n11- No other malignancies.\n12- No known hypersensitivity or medical contraindication to the drug.\n13- Evaluation of response after 2_3 months.\n14- adequate Blood picture Values:\nHg ~10 mg/ ml\nNo Leucopenia: TLC~ 4000\nNo thrombocytopenia: Platelet count ~100.000\n15- No known hypersensitivity to the drug.\n16- No severe toxicity related to the drug.\n17- No other serious Co- morbidities.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Dasatinib) Protocol\n\n1- Patients with chronic Myeloid Leukemia\n2- Patients progressing after first line therapy\n3- Patient should have a recent BCA-ABL\n4- Adequate Renal & Liver functions\n5- Monitoring of blood values and chest conditions (Pneumonitis a possible side effect of the drug)\n6- Chest radiography in case of cough and dyspnea\n7- Monitoring of BCR-ABL every 3 months\n8- Responding patients, continue treatment with regular Monitoring\n9- Discontinue treatment in case of disease progression or intolerable toxicity", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Sunitinib) Protocol\n\nPatients with confirmed metastatic Renal Cell Carcinoma\n• First line metastatic therapy\n• Good performance status: ECOG:0-2\n• Adequate hematologic values\n• Adequate Renal & Liver functions\n• Normal levels of T3,T4,TSH\n• Normal echocardiogram\n• No serious co- morbidity\n• No other malignancy.\n• Treatment is given with standard schedule of 4 weeks treatment/ 2 weeks off.\n• Evaluation of therapy after 3 months\n• Evaluation of treatment related toxicity: especially cardiac functions, T3, T4, TSH\n• Responding patients would continue 3 months, then reevaluated.\n• Patients having disease progression or treatment related toxicity should stop the drug.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Nilotinib) Protocol\n\n1- Patients with chronic Myeloid Leukemia\n2- Patients progressing after first line therapy\n3- Patient should have a recent BCA-ABL\n4- Adequate Renal & Liver functions\n5- Monitoring of blood sugar (As Diabetes: a known side effect of the drug)\n6- Monitoring of cardiac conditions\n7- Monitoring of BCR-ABL every 3 months\n8- Responding patients, continue treatment with regular Monitoring\n9- Discontinue treatment in case of disease progression or intolerable toxicity", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Temozolomida) Protocol\n\n• Patients with confirmed high grade astrocytoma.\n• Diagnosis confirmed by pathology or MR Spectroscopy if surgery is not possible\n• Good Performance status: 0-2. ECOG.\n• Adequate hematologic values\n• Adequate renal & liver functions\n• No serious co morbidly\n• No other malignancy\n• Recent MRI brain after surgery\n• Patients would receive 3 cycles\n• Re-evaluation after 3 cycles by comparative MRI.\n• Responding patients would continue 3 more cycles\n• Non responding, progressing patients should continue the drug", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Panitumumab) Protocol\n\n- Patients with confirmed diagnosis of colonic adenocarcinoma.\n- Patients with proved metastatic/ recurrent disease with CTS, MRI, or PET/CT.\n- First line metastatic disease.\n- Good Performance status ECOG: 0-2.\n- Patients with confirmed all RAS wild aggressive genes (K-RAS & N-RAS).\n- Patients with normal blood values.\n- Patients with adequate liver & renal functions.\n- No serious co- morbidly.\n- No medical contraindications to the drugs.\n- No other malignancy.\n- Patients would receive 3 cycles, then reevaluated.\n- Responding patients will receive another 3 more cycles.\n- Non - responders should discontinue the drug.\n- Patients developing grade3/4 drug related toxicity should discontinue the drug.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Bortezomib) protocol\n\n1- Patients with confirmed Multiple Myeloma:\n- Bone marrow examination\n- Quantitative IGA, IGG, IGM\n- B2 - Microglobulin\n- IMMUNOFIXATION\n- Skeletal Survey / PET scan\n2- Patients not responding or progressing on Standard chemotherapy regimens.\n3- Patients with impaired renal functions.\n4- Patients should be evaluated for response to therapy after each treatment period by doing the previously mentioned investigations compared to results before therapy.\n5- Responding patients (confirmed by bone marrow, B2 microglobulin, IGA, IGG, IGM) Will continue treatment with reevaluation.\n6- Non responding patients or those with treatment related toxicity should discontinue the drug.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Pazopanib) Protocol\n\nPatients with confirmed metastatic Renal Cell Carcinoma\n• Adequate hematologic values\n• Normal kidney & liver functions\n• Good performance status of ECOG :0-2\n• Treatment is given as first line metastatic\n• Baseline chest, abdomen & pelvic radiography\n• No serious co -morbidities\n• No other malignancy\n• Re-evaluate after 3 months of therapy.\n• Assessment of treatment related toxicity especially elevation of liver enzymes (known side effect of the drug)\n• Treatment should be discontinued in case of disease progression or drug toxicity.", "(Zoledronic acid) Protocol\n\n1- Patients with confirmed Mutiple Myeloma.\n2- Confirmed bone affection by skeletal survey \\ PET/CT.\n3- Patients With adequate Renal function (Urea, Creatinine, and creatinine clearance)\n4- No hypocalcemia before starting therapy\n5- Treatment to be given every 4 weeks for the first year & every three months for the second year\n6- Monitoring of dental health (Osteonecrosis of jaw is a possible side effect)\n7- Monitoring of serum calcium during treatment (Hypocalcemia is a possible side effect)", "(Oxaliplatin) protocol\n\nيتم وصف عقار Oxaliplatin لمرضى الأورام في حالات Colo Rectal Cancer\nعلى أن يتم وصفه بالضوابط الآتية -:\n- خط العلاج الأول يتكون من فلورويوراسيل ولوكوفيرين\n- في حالات ارتجاع الورم موضعياً أو في حالات انتشاره (الكبد، العظام، الرئة) يتم وصف Oxaliplatin على أن تكون الحالة العامة للمريض جيدة (وظائف الكبد، تحاليل الدم) ويتلقى المريض جرعتين يتم بعدها تقييم مدى الاستجابة.\n- في حالة حدوث استجابة وعدم وجود تدهور عام بصحة المريض يستمر العلاج.\n- في حالة عدم الاستجابة أو حدوث تدهور في الحالة العامة للمريض يوقف العلاج بهذا العقار.", "تعليمات وصف عقار الـ .Cyproterone acetate tab\nيوصف دواء أندروكيور 50 مج أقراص لحالات أورام البروستاتا بجرعة قرص مرتين يومياً كخط علاج ثاني في حالة عدم استجابة المريض لأقراص فلوتاميد 250 مجم بجرعة قرص 3 مرات يومياً (بعد الجراحة)\n\nتعليمات وصف عقار الـ Capecitabine 500 mg\nيوصف عقار Xeloda 500 mg لمرضى الأورام في الحالات التالية -:\n1- حالات سرطان الثدي المصابة بثانويات في الأنسجة الرخوة (SOFT TISSUE METASTASIS IN BREAST CANCER)\n2- حالات أورام القولون المصابة بثانويات في الكبد (LIVER METASTASIS IN CANCER COLON)\nعلى أن تكون الجرعة الشهرية علبة واحدة 120 قرص بمعدل 8 أقراص يومياً لمدة 15 يوم.", "البروتوكول الأساسي للكيماوي\n\nبالنسبة لأورام الرئة للحالات غير القابلة للاستئصال الجراحي يراعى الآتي -:\n1- يعطى للمريض البروتوكول الأساسي للكيماوي ويتكون من بلاتينول + فيبسيد لمدة 4 جرعات بالإضافة للعلاج الإشعاعي\n2- يعاد تقييم الحالة -:\n- في حالة وجود استجابة للعلاج (أكثر من 50 %) يعطى باقي الجرعات\n- في حالة عدم وجود استجابة (أقل من 50 %) وحالة المريض العامة جيدة performance 1,2 يعطى المريض جرعتين من أحد البروتوكولات الآتية -:\n1- جيمزار + بلاتينول\n2- تاكسول + بلاتينول\n3- تاكسوتير + بلاتينول\nويعاد تقييم الحالة طبقاً للاستجابة", "Biologic therapy for Rheumatoid Arthritis\n\n1) Biologic therapy is indicated for those patient failed to be controlled (moderate to high disease activity and having one or more of poor prognostic factors) by the above treatment regimen for more than continuous 6 months. It is given in addition to prednisolone 5-10 mg daily, and MTX or leflunomide,\n2) Tuberculin, HBsAg, and HCV-Ab testing are mandatory before prescribing biologic therapy,\n3) Biological drugs available are used in the following order:\na. 1st. line Etanercept (Enbrel syringe 50mg) once weekly for three months,\nb. 2nd. Line Golimumab (Simponi pen 50mg) once monthly for three months,\nOR\nAdalimumab (Humira 40 mg syringe) once every 2 weeks, for three months,\nc. 3rd. line Infliximab (Remicade vial 100mg) 3 vials IV infusion over 2 hours with premedication by anti-histaminic and hydrocortisone before each infusion. The doses schedule is zero, 2, 6 weeks then every 8 weeks, for three months,\nd. 4th. Line Tocilizumab (Actimra vials 400+200 mg) by IV infusion over one hour, once monthly, for three months,\n4) it is totally not allowed to start by the second line EXCEPT if the first line drug is ineffective or contraindicated)\n5) If there is contraindication to or side effects from MTX and leflunomide, give IL-6 inhibitor (Tocilizumab) + the rest of the protocol.\n6) After achieving the target continuously for 3 months (remission or low disease activity), start tapering of the biologic drug by either halving the dose (better) or doubling the interval (which is applicable according to the available biologic doses preparation) & continue other medications,\n7) Re-evaluate after another 3 months,\na) If the disease flared, resume the same biologic drug by the original dose before tapering with follow up every 3 months till achieving the target continuously for 3 months (remission or low disease activity), then start tapering again of the biologic drug by either halving the dose (better) or doubling the interval (which is applicable according to the available biologic doses preparation).\nb) If the disease still in remission, stop the biologic drug and continue the other non-biologic drugs and steroids with follow up every 3 months.", "Biological therapy for ankylosing spondylitis\n\n1) Biological therapy (Anti-TNF or IL-17 blocker) for 12 weeks is indicated for:\na) Patients with persistently high disease activity despite conventional treatments (above measures without significant improvement)\nb) Patients with extra-articular manifestations, for example, psoriasis, uveitis and/or IBD not responding to above and local treatment,\n2) Tuberculin, HBsAg, and HCV-Ab testing are mandatory before prescribing biologic therapy,\n3) In selection of the biological drug should be in the following order:\na. 1st. line: therapy: Secukinumab (Cosentyx 150 mg pen) without loading dose i.e. 3 doses over three months,\nb. 2nd. Line: Etanercept (Enbrel syringe 50mg) once weekly for three months,\nc. 3rd. line: Golimumab (Simponi pen 50mg) once monthly for three months,\nOR\nAdalimumab (Humira 40 mg syringe) once every 2 weeks, for three months,\nd. 4th. Line: Infliximab (Remicade vial 100mg) 3 vials IV infusion over 2 hours with premedication by anti-histaminic and hydrocortisone before each infusion. The doses schedule is zero, 2, 6 weeks then every 8 weeks, for three months,\ne. 5th. Line: Secukinumab (Cosentyx 150 mg pen) with loading dose i.e. 6 doses over three months,\n4) Extra-articular manifestations, as uveitis and IBD, should be considered as TNF receptors (Etanercept) is not effective in controlling these manifestations,\n5) reassess the patient disease activity and improvement using BASDAI or ASDAS, after at least 12 weeks,\na. If no improvement, (BASDAI < 2 or less than 50% relative improvement from previous BASDAI OR ASDAS improvement < 1.1) the biologic drug is considered ineffective and should be switched to the second in list,\nb. If improved (BASDAI ≥ 2 or more than 50% relative improvement from previous BASDAI OR ASDAS improvement ≥ 1.1) continue,", "Biological therapy for psoriatic arthritis\n\n1) Biological therapy is indicated in PsA patients who has:\nA. insufficient response to all the above lines of therapy,\nB. purely axial disease (from the start biologics can be used),\nC. severe enthesitis,\n2) Tuberculin, HBsAg, and HCV-Ab testing are mandatory before prescribing biologic therapy,\n3) In selection of the biological drug should be in the following order:\na. 1st. line: therapy: Secukinumab (Cosentyx 150 mg pen) without loading dose i.e. 3 doses over three months,\nb. 2nd. Line: Golimumab (Simponi pen 50mg) once monthly for three months,\nOR Adalimumab (Humira 40 mg syringe) once every 2 weeks, for three months,\nc. 3rd. Line: Infliximab (Remicade vial 100mg) 3 vials IV infusion over 2 hours with premedication by anti-histaminic and hydrocortisone before each infusion. The doses schedule is zero, 2, 6 weeks then every 8 weeks, for three months,\nd. 4th. Line: Secukinumab (Cosentyx 150 mg pen) with loading dose i.e. 6 doses over three months,\nOR\nSecukinumab (Cosentyx 300 mg pen) without loading dose i.e. 6 doses over three months,\ne. 5th. Line: Secukinumab (Cosentyx 300 mg pen) with loading dose i.e. two pens SC weekly for 4 weeks, then 2 pens once monthly for 2 months, (12 pens over three months).", "Tuberculin, HBsAg, and HCV-Ab testing are mandatory before prescribing biologic therapy,\n\nBiologics allowed for use in JIA are in the following order:\n1st line: Tocilizumab (Actimra)\n2nd line: Adalimumab (Humira)\n3rd line: Etanercept (Enbrel)\n\nBiologics allowed for use in inflammatory bowel disease (ulcerative colitis and crohn’s disease) are in the following order:\nIn ulcerative colitis: Golimumab (Simponi)\n1st line: Adalimumab (Humira)\n2nd line: infliximab (Remicade)\n\nBiologics allowed for use in middle, posterior or panuveitis are in the following order:\nAdalimumab (Humira)", "-2 أدوية الأوعية الدموية", "بروتوكول العلاج بمثبطات تخثر الصفائح الدموية\n\nمتلازمة الشريان التاجي الحادة\nوتشمل احتشاء عضلة القلب المصحوب بـ elevated S-T segment أو غير المصحوب بـ elevated S-T segment (ذبحة صدرية غير مستقرة أو احتشاء عضلة القلب) مع أو بدون تركيب دعامة يتم إعطاء الكلوبيدوجريل مع الأسبرين (75-100 مجم يومياً).\nالجرعة التحميلية -:\nيعطي 300 مجم يعقبها 75 مجم يومياً لمدة لا تقل عن 14 يوم وتصل إلى 12 شهر (في حال عدم وجود نزيف).\n\nالذبحة الصدرية غير المستقرة\nالجرعة التحميلية-:\nيعطي 300 مجم يعقبها 75 مجم يومياً لمدة لا تقل عن 14 يوم وتصل إلى 12 شهر بالإضافة إلى الأسبرين بجرعة 75-100 مجم يومياً ثم يعقب ذلك الأسبرين باستمرار.\n\nمرض الشريان التاجي المستقر\nأسبرين بجرعة 75-100 مجم يومياً.\n\nقسطرة الشرايين التاجية من خلال الجلد مع تركيب دعامة\nجرعة تحميلية -:\n300-600 مجم مبكراً بقدر الإمكان قبل أو في وقت الإجراء ثم 150 مجم يومياً في الأسبوع الأول بعد تركيب الدعامة ثم 75 مجم يومياً لمدة ستة شهور (وقد تصل إلى 12 شهر في حال مخاطر نزف قليلة بالإضافة إلى الأسبرين بجرعة 75-100 مجم يومياً بصرف النظر عن نوع الدعامة ويعقب ذلك الأسبرين باستمرار) ويمكن إيقاف الكلوبيدوجريل بعد ثلاثة شهور في حال وجود درجة خطورة نزف عالية.\n\nما بعد جراحة تغيير الشرايين\nكلوبيدوجريل 75 مجم + أسبرين يومياً لمدة ثلاثة شهور وقد تصل إلى عام يعقبها الأسبرين باستمرار.\n\nالوقاية السنوية لأمراض القلب والأوعية الدموية\nينصح بعقار الكلوبيدوجريل بجرعة 75 مجم يومياً بالإضافة إلى الأسبرين للمرضى غير المعرضين لخطورة نزف عالية ولكن معرضين لخطورة أمراض القلب والأوعية الدموية. ينصح بذلك أيضاً للذين يعانون من قصور شديد في الدورة الدموية للأطراف أو تاريخ مرضي بإجراء عملية ترقيع للأوعية الدموية أو عملية بتر بسبب قصور بالدورة الدموية.", "بروتوكول علاج مرضى الصرع\n\n1. يتم البدء بعقار Micronized phenytoin Sod وتزاد الجرعة تدريجياً للحصول على المفعول العلاجي وذلك للمرضى الذين تم تشخيصهم حديثاً بنوبات الصرع الجزئي البسيط والمركب الذي يتحول إلى صرع كلي.\n2. في حالة عدم الاستجابة يمكن إضافة عقار آخر مثل Carbamazepin وتزاد الجرعة تدريجياً للحصول على المفعول العلاجي.\n3. في حالة عدم الاستجابة يضاف دواء ثالث Sod - Valproate مع سحب الأول تدريجياً.", "البروتوكول العلاجي لمرضى السكر\nمن طلاب المدارس قبل السن المدرسي\n\nعند اكتشاف إصابة الطفل بمرض السكر بعد إجراء التحاليل الطبية داخل وحدات الهيئة، لا يعتد بأي تحليل يجري خارج وحداتها يتم:\nأولاً: يتم عرض الطفل مريض السكر على الاستشاري أو الأخصائي بمراكز علاج السكر بفروع الهيئة.\nثانياً: يقوم الطبيب المعالج بإجراء الكشف الطبي على المريض ووصف الأنسولين المناسب له بالجرعات حسب عمره ووزنه وحالته (0.5 unit/kg body weight). ويمكن زيادة هذه الجرعة عند البلوغ أو الطوارئ.\nويقوم الطبيب المعالج بطلب الفحوصات المطلوبة له بصفة دورية كل ستة شهور وهي فحص قاع العين وتحليل الهيموجلوبين السكري HbA1C وفحوصات وظائف الكلى Kidney Function Tests سنوياً.\n\nطريقة الصرف:\nيتم الصرف من صيدليات الهيئة طبقاً للتذكرة الطبية المحررة من استشاري السكر أو الأخصائي والمحدد بها:\n1. نوع الأنسولين وجرعة العلاج.\n2. شرائط تحليل السكر بالدم بدون جهاز (علبة واحدة بها 25 شريط كل شهرين) على أن يتم تقسيم كل شريط إلى جزئين بمعرفة ممرضة مركز السكر.\n3. صرف الأقلام للطلاب بمعرفة الشركة بالاتفاق مع مدير العيادة والأخصائي لتحديد يوم عمل للشركة كل أسبوع لعمل توعية تثقيفية عن كيفية استخدام القلم وأماكن الحقن وطريقة حفظ الأنسولين وتسليم القلم للمريض.\nويتم أخذ بيانات المربوطين (السن - الجرعة – نوع الأنسولين – التليفون – الطبيب – المعالج – تاريخ تسليم القلم) على أن يتم حفظ البيانات بملف المريض بمركز السكر الخاص.\nملحوظة: يتم التنبيه على المرضى بأنه لن تصرف خراطيش الأنسولين في المرة التالية (شهرياً أو كل شهرين) إلا بعد استرجاع الخراطيش الفارغة.", "بروتوكول علاج مرض السكر\n\nتوصيات هامة:\n1. يتم عمل ملفات لجميع المرضى بالعيادات التي تعالج مرضى السكر ويحتفظ بها بالعيادة وتحتوي هذه الملفات على التحاليل الطبية الخاصة بالمريض وخريطة العلاج.\n2. يتم إجراء التحاليل الطبية بداخل وحدات الهيئة (العيادات الشاملة أو المستشفيات) ولا يعتد بأي تحليل تم خارج وحدات الهيئة.\n3. مراعاة أن 85% من مرضى السكر يتم تحسن حالتهم بعلاجهم بالأقراص وحوالي 15% فقط تحتاج حالتهم العلاج بالأنسولين.\n\nبروتوكول العلاج لمرض السكر:\nأولاً: إذا كان مستوى السكر في الدم بعد الأكل PPBS أكثر من الطبيعي وأقل من 250 mg/dl:\n1. إتباع نظام غذائي صحي طبقاً للرجيم الغذائي المرفق.\n2. إنقاص الوزن بالنسبة للمرضى over weight وذلك لمدة ستة أشهر ويتابع المريض.\nثانياً: في حالة عدم الاستجابة أو في حالة PPBS > 250 mg/dl:\n1. إتباع نظام غذائي صحي طبقاً للرجيم الغذائي المرفق.\n2. إنقاص الوزن بالنسبة للمرضى over weight.\n3. إعطاء المريض أقراص لعلاج السكر على النحو التالي:\nأ. مجموعة Sulphonyl – Urea Tab وتشمل الأنواع التالية المدرجة بالدليل (جليبين – ديابين – جاليبيناز – جليبنكالميد – مينيدياب – جليبكرون – ديابيل) وتعطي للمريض معتدل الوزن.\nب. مجموعة Biguanide وتشمل الأنواع التالية المدرجة بالدليل (ديافاج – سيدوفاج – ميتفورمين – سيدوفاج ريتارد – ريتاردوفاج) وتعطي للمريض الذي يعاني من زيادة في الوزن.\nج. يتم التدرج بالجرعة الأقل فالأكثر حسب استجابة المريض ويمكن الوصول إلى الحد الأقصى للجرعة لكل دواء على النحو التالي:\n\nSulfonyl – Urea Tab:\n1. Glibenclamide : 20mg/day (1x4)\n2. Gliclazide : 320 mg/ day (1x4)\n3. Glipizide : 30 mg / day (2x3)\n\nBiguanides Tab:\n1. Metformin : 3000 mg / day (2x3)\n2. Metformin Retard : (1x3)", "- على أن يتم وصف الأقراص لمدة ثلاثة شهور مستمرة على الأقل لبيان مدى فاعليته.\n- في حالة عدم الاستجابة (لكل مجموعة من الأقراص على حدة بالجرعات القصوى) يتم وصف المجموعتين معاً (Sulfonyl- urea tab + Biguanides Tab) ويتابع المريض لمدة ثلاثة شهور أخرى مستمرة على الأقل لبيان مدى الفاعلية.\n- في حالة عدم الاستجابة يوصف الأنسولين على النحو التالي:\n1. يوصف أنواع الأنسولين: الميكستارد - أو لنت – أو إن بي اتش\nMixtard – Lent – N.P.H من 10-15 وحدة في اليوم أي زجاجة واحدة فقط في الشهر ويفضل أن يؤخذ في المساء فقط. بالإضافة إلى دواء من مجموعة Biguanides tab (Metformin or Cidophage or Metformin Retard) فقط وتوقف مجموعة Sulfonyl Urea tab ويتابع المريض لمدة ثلاثة شهور أخرى مستمرة على الأقل لبيان مدى الفاعلية.\n2. في حالة تحسن حالة المريض وبعد انخفاض نسبة السكر في الدم إلى 250 mg/dl أو أقل بعد الأكل بساعتين يستمر علاج المريض بالأقراص فقط، أي أن وصف الأنسولين لهؤلاء المرضى لمدة محدودة فقط وهي ثلاثة شهور.\n3. مع مراعاة أنه 85% من مرضى السكر يتم تحسن حالتهم على هذا النظام من العلاج أي باستخدام الأقراص فقط.\n4. وحوالي 15% فقط لا تتحسن حالتهم ويتم علاجهم بالأنسولين ويوقف الأقراص بأنواعها، يفضل أن يعطي الأنسولين صباحاً ومساءً وتحدد الجرعة حسب نسبة السكر في الدم:\n0.5 IU/Kg Lean Body Weight بحد أقصى من 3-4 زجاجات إنسولين 100 وحدة كل شهرين.\n\n- في حالة عدم الاستجابة Insulin Resistance:\n1. يبحث سبب وجود Insulin Resistance مثل:\nHidden Infection Especially Urinary Tract Infection\nUncontrolled I.H.D\nOver eating\n2. يعطي المريض أنسولين مائي بجرعات تقسم على 3 – 4 مرات يومياً وبحد أقصى من 3-4 زجاجات أنسولين 100 وحدة كل شهرين.\n- في حالة عدم الاستجابة يحول المريض إلى عيادة الغدد الصماء المتخصصة لمتابعة حالته بمعرفة الاستشاري.", "ضوابط يجب مراعاتها عند تحديد جرعة الأنسولين\n\n1. تقلل الجرعة في الأحوال التالية:\n• مرض السكتة الدماغية.\n• مرض قصور الشرايين الدماغية.\n• مرضى الكلى المزمن.\n• مرض الكبد المزمن.\n2. إذا كان المريض في حالة حرجة أو شبه حرجة مثل جلطة القلب أو السكتة الدماغية أو أي أزمة حادة يعطي أنسولين فقط داخل المستشفي ويعاد وصف الأقراص بعد أيام قليلة من خروجه من المستشفي واستقرار الحالة.", "ضوابط صرف خراطيش الأنسولين للحالات المستحقة\n\n- حالات الاحتياج لتكرار الحقن بجرعات أنسولين 3 مرات أو أكثر يومياً طبقاً لتوصية الاستشاري.\n- حالات ضعف حدة الإبصار بما يعوق الرؤية (طبقاً لرأي طبي 6/60 أو أقل) يتعذر معه ضبط الجرعات.\n- الحالات التي يتجاوز العمر 70 سنة وذوي الإعاقة وطريح الفراش.\n- حالات ارتفاع نسبة الهيموجلوبين السكري (HbA1C) أكثر من (10).\n- المضاعفات المزمنة لمرض السكر:\n* القدم السكري\n* فشل كلوي مزمن\n* تدهور وظائف الكلى (كرياتينين أكثر من 2) End stage nephropathy\n* جلطات القلب\n* جلطات أو نزيف المخ\n* السكتة الدماغية", "ضوابط استخدام مثبطات المناعة بعد زرع الكلي\n\n* سانديميون:\n- في حالة وجود حساسية مفرطة على المدى القصير (أسابيع) مدعمة بالتحاليل المعملية والباثولوجية يستبدل بـ:\n1. راباميون 1-2 مجم في اليوم مع استخدام أقراص كيتوكونازول 200 ملجم 1/4 قرص صباحاً ومساءً.\nأو\n2. بروجراف 1-2 ملجم / اليوم + كيتوكونازول 200 ملجم 1/4 قرص صباحاً ومساءً.\n- ب. في حالة وجود آثار جانبية على المدى الطويل (سنوات) مدعمة بالتحاليل المعملية والباثولوجية وكانت كفاءة الكلى باستخلاص الكرياتنين أقل من 40 مللي لتر في الدقيقة، تقلل الجرعة بالتدريج على مدى شهور إلى 1-2 ملجم / كجم / يوم ومستوى العقار بالدم يبين 250-400 مجم بعد ساعتين من أخذ العينة أو 40-70 ملجم بعد أخذ العينة مباشرة أو يوقف نهائياً بالتدرج البطيء.\n- في حالة حدوث رفض مدعم بالعينات الباثولوجية بعد إيقاف العقار I يعالج المريض بالسوليوميدرول بالوريد مؤقتاً ثم يعاد عقار I بجرعة مخفضة ويستبدل عقار II بسلسبت 1-2 جم / اليوم مع التأكد من توقف تدهور وظائف الكلى.\n- في حالة عدم وجود استجابة لعقار السلسبت يستبدل سلسبت بالإيميوران مرة أخرى.\n- يمكن في الحالة ب إذا كان استخلاص الكرياتنين من 40-65 مللي لتر في الدقيقة أن يستبدل سانديميون بالراباميون 1 مجم مرتين يومياً + كيتوكونازول أقراص 1/4 قرص كل 12 ساعة مع الإيميوران بالشروط السابقة.\n\n* ايميوران:\n- أ. في حالة الحساسية المفرطة على المدى القصير بالتحاليل المعملية يستبدل العقار II بسلسبت 1-2 جم / يوم مقسمة على جرعتين بعد التأكد من تحسن وظائف الكبد بعد إيقاف الإيميوران.\n- ب. في الحالات الحرجة ذات قابلية عالية للرفض مثل إعادة الزرع أو حدوث رفض أكثر من مرة يستبدل عقار II بالسلسبت.\n- ج. في الحالات التي تم زرعها خارج الهيئة ثم حولت إلى عيادات الهيئة وكانت تعالج بالسلسبت:\n- يحول السلسبت إلى إيميوران ما لم توجد آثار جانبية كالحساسية المفرطة خاصة إذا كان قد مر على الزرع 3 شهور ويسحب السلسبت تدريجياً مع إدخال جرعات صغيرة من الإيميوران مع متابعة لصيقة لوظائف الكلى.\n\nملحوظة:\n- أخلاقياً وعلمياً يجب عدم إجراء زرع كلى في حالة وجود مرض بدرجة مؤثرة في الكبد مدعم بالفحص السريري والموجات الصوتية وتحاليل للكبد وفي حالة وجود شك يجب أخذ عينة باثولوجية.\n- في حالة وجود احتمالات عالية للرفض يستحسن عدم الزرع وفي حالات الضرورة القصوى يعطى عقار السيميلوكت (الأجسام المضادة) في جرعتين يوم الزرع واليوم الرابع.", "تعليمات وصف عقار Alpha-Calcidol\n\nيقتصر وصف دواء: .Alphacalcidol caps على حالات الفشل الكلوي والتي تستمر على الغسيل الكلوي فقط أو الفشل الكلوي المتقدم الذي يحدده الاستشاري وحالات Hypoparathyroidism وكعلاج أساسي في حالات هشاشة العظام بالإضافة إلى الكالسيوم على أن يكون بواقع حبة واحدة يومياً ويكرر.", "بروتوكول عقار الإريثروبويتين\nلعلاج الأنيميا المصاحبة لمرضى الفشل الكلوي المزمن\n\nأولاً -: كفاءة الجلسة (KTV):\nتقييم كفاءة الجلسة (KTV) والتحقق من أن المريض يقوم بإجراء الجلسات لمدة 12 ساعة أسبوعياً على الأقل وطبقاً للمعايير.\n\nثانياً -: استبعاد الأسباب الأخرى للأنيميا:\nيتم استبعاد الأسباب الأخرى للأنيميا بإجراء الفحوص والتحاليل اللازمة لتشخيص سبب الأنيميا واستبعاد الأسباب الأخرى التي تمنع استجابة المريض للعلاج بهرمون الإريثروبويتين وهي:\n- صورة دم كاملة CBC.\n- استخلاص اليوريا قبل وبعد الجلسة URR (Urea reduction ratio).\n- قياس دلالات الحديد (Ferritin – Fe – TIBC).\n- دم خفي في البراز أو منظار معدة لتحديد وجود تقرحات بالمعدة.\n\nثالثاً -: تحديد نسبة الهيموجلوبين لبدء العلاج:\nيبدأ العلاج بعقار الإريثروبويتين للمرضى الذين تكون نسبة الهيموجلوبين لديهم أقل من 10 جم وبعد استبعاد أسباب أخرى للأنيميا وعلى أن يتم تقييم ذلك بمعرفة الاستشاري.\n\nرابعاً -: الجرعة العلاجية:\nالجرعة العلاجية من عقار الإريثروبويتن 100 وحدة لكل كيلو جرام في الأسبوع ويستمر العلاج لحين وصول نسبة الهيموجلوبين من 10 – 11 جم.\n\nخامساً -: الجرعة الثابتة:\nالجرعة الثابتة من عقار الإريثروبويتين عند وصول الهيموجلوبين من 10 – 11 جم:\n- في حال انخفاض الهيموجلوبين أقل من 10 جم يتم زيادة الجرعة بنسبة 25 %.\n- في حال ارتفاع نسبة الهيموجلوبين أكثر من 11 جم يتم تخفيض الجرعة بنسبة 25 %.", "Erythropoietin use in HCV therapy\n\nRibavirin (RBV) related Anemia:\n• Anemia is multifactorial, Hemolysis is universal in patient's receiving RBV.\n• Full dose of both PEG – IFN and RBV permits 75% of EVRs to have an ultimate SVR. RBV dose reduction results in a fall to 67% and RBV discontinuation resulted in a fall to 12%.\n• Adherence to RBV dosage during the first 12 weeks of treatment is critical ultimately obtaining an SVR. Any measures that reduce hematological AEs of RBV and keep patients on full therapy are likely to be of benefit.\n\nManagement of RBV-Related Anemia:\n1. RBV Dose Modification and Discontinuation:\n• Reduce the RBV dose by 30% for Hgb ˂ 10g/dl\n• Obtain blood counts every 2 weeks (or weekly if indicated)\n• RBV should be discontinued if the Hemoglobin drops ˂ 8.5 g/dl\n• Individuals with cardiac disease require early reduction of RBV if Hgb drops < 12gm/dl, and discontinuation of RBV if their Hgb drops ˂ 10g/dl.\n• Dose reduction stabilizes Hgb decline, but doesn’t result consistent Hgb Increases.\n2. For patients with history of coronary disease, reduction of DEG -IFN dose by 25-50% in addition to decreasing RBV.", "3. Erythropoietin (EASL guidelines 2011)\n• Use if:\n- Hgb ˂ 10.0g/dl.\n- Hgb decrease ˃ 3g/dl from start of treatment and patient is experiencing severe fatigue.\n• Especially important in the first 3 months of treatment until it is known whether the patient is an early viral responder (EVR). CEVR is strongly associated with SVR.\n• In patients who are not cEVR, the benefit of continued anti - HCV treatment is less clear, and EPO use is not recommended.\n• Eprex ® (4.000) (Epoetin Alfa) or Recormon ® (2.000, 5.000) (Epoetin Beta) or Epoetin (SEDICO 2000 & 4000 I.U.).\n• Initial dose 4.000 unit's SQ 3times / week.\n- Monitor blood pressure as EPO can cause /exacerbate HTN.\n- Monitor CBC every 2 weeks.\n• Lab response takes 2-3 weeks\n- If Hgb increases to ˃ 12g/dl STOP EPO and check CBC weekly.\n- Full dose RBV restarted when Hgb increases ˃ 10g/dl.\n- For patients with coronary disease, full dose RBV restarted when Hgb ˃ 12", "Gilenya ( Fingolimod)\n\n0.5 mg capsule\nSecond-line treatment for relapsing remitting multiple sclerosis (RRMS) according to EU but first line treatment in the USA\n\nIndications:\n1. RRMS\n• In patients who have failed to respond to a full and adequate course (1 year) of beta interferon\n• In patients who have had at least 1 relapse in the previous year while on therapy and have at least 9 T2 hyper intense lesions on MRI or at least 1 G+ lesion .\n• Also in patients with increased relapse rate or ongoing severe relapses , as compared to the previous year\n\n2. Aggressive MS\nRRMS with one or more of the following features;\na) EDSS score of 4 within 5 years of onset\nb) Two or more relapses with incomplete resolution in the past year\nc) More than 2 MRI studies showing new or changing T2 lesions or G+ lesions despite treatment\nd) No response to therapy with one or more of DMTs for up to 1 year\n\n3. Contraindications to interferon-beta (depression-allergy)\n4. Progressive relapsing MS (EDSS does not exceed 4)", "INTRAVENOUS IMMUNOGLOBULIN (IVIG)\nCONDITIONS FOR WHICH INTRAVENOUS IMMUNOGLOBULIN USE IS APPROPRIATE AND IS CONSIDERED THE HIGHEST PRIORITY BECAUSE OF A RISK TO LIFE WITHOUT TREATMENT\n(Clinical guidelines for IMMUNOGLOBULIN USE\n2nd EDITION UPDATE SCOTLAND, March 2012)\n\nI. PRIMARY AND SECONDARY ANTIBODY DEFICIENCY STATES:\n1. Primary immunodeficiencies (associated with significant antibody defects): Initiate at 0.4–0.6 g/kg/month; dose requirements may increase and should be based on clinical outcome.\n2. Thymoma with immunodeficiency: Dose as above.\n3. HSCT in primary immunodeficiencies: Dose as above.\n4. Specific antibody deficiency: Dose as above.\n\nII. HAEMATOLOGY:\n1. Alloimmune thrombocytopaenia (foeto- maternal/neonatal):\nMaternal: 1 g/kg weekly throughout pregnancy. Neonatal: 1 g/kg; occasionally >1 dose required if thrombocytopaenia persists.\n2. Haemolytic disease of the newborn: 0.5 g/kg over 4 hours.\n3. Immune thrombocytopaenic purpura – acute:\nIf corticosteroids are contraindicated or more rapid response required; If no response to corticosteroids and other treatments contraindicated; Prior to surgery to achieve a safe platelet count; In children (<16 years) for emergency or prior to procedure likely to induce bleeding: Use 1 g/kg (0.8–1 for children) as a single infusion, to be repeated at later date if platelet count has not responded.\n4. Immune thrombocytopaenic purpura – persistent:\nFor symptomatic cases unresponsive to all other treatments, IVIG is appropriate only for emergency management, e.g. potentially life-threatening haemorrhage and/or bleeding into a critical area:\nUse 1 g/kg (0.8–1 for children) as a single infusion, to be repeated at later date if platelet count has not responded.", "III. NEUROLOGY:\n1. Chronic Inflammatory Demyelinating Polyradiculoneuropathy:\n2 doses of IVIG (2 g/kg given over several days) 6 weeks apart; restarted at relapse and repeated using the ‘time to relapse’ as the interval between courses (i.e. if a patient relapses after 6 weeks, 2 g/kg is given over several days every 6 weeks).\n2. Guillain-Barré syndrome (includes Bickerstaff’s brain stem encephalitis): 2 g/kg usually given over 5 days (shorter time frame not recommended because of potential fluid overload and autonomic problems); second dose may be considered at 14 days for non- responsive or late deteriorating patients.\n3. Paraprotein-associated demyelinating neuropathy (IgM, IgG or IgA):\n2 doses of IVIg (2 g/kg given over several days) 6 weeks apart; restarted at relapse and repeated using the ‘time to relapse’ as the interval between courses.\n\nIV. OTHER:\n1. Kawasaki disease:\n2 g/kg single dose, given over 10–12 hours, in conjunction with high-dose aspirin; a second dose may be given if no response, or if relapse within 48h.\n2. Toxic epidermal necrolysis, Stevens Johnson syndrome:\nInvolved body surface area >10%; AND When other treatments are contraindicated; OR The condition is life-threatening:\n2 g/kg, preferably as a single dose, or divided over 3 consecutive days.", "أستخدام الألبيومين البشري في مرضى تليف الكبد\n\nاستخدام الألبيومين البشري في تليف الكبد ودواعي استعماله تقل تدريجياً بناء على توصيات كل جمعيات ومنظمات الكبد العالمية.\nلا يوجد دور أو داع لاستخدام الألبيومين كعلاج للتليف أو لإصلاح أو رفع مستوى الألبيومين في الجسم مهما كان مستوى الألبيومين وبغض النظر عن قلته.\n\nحالياً يقتصر استخدام حقن الألبومين على الحالات التالية فقط:\n* المرضى الذين يجري لهم بذل استسقاء بحجم كبير (Large volume paracentesis) (أكثر من 5 لتر في الجلسة):\nبجرعة 5 جرام ألبومين لكل لتر من الاستسقاء يتم بذله، يعطي على مرة واحدة مع البذل، ولا يكرر إلا بتكرار البذل بحجم كبير وبذلك يعطي زجاجة 50 سم %20 بها 10 جرام ألبومين لكل 2 لتر من الاستسقاء يتم بذله إذا زاد حجم البذل عن 5 لتر (مثلاً إذا تم بذل 8 لتر يعطي المريض 4 زجاجات ألبومين) قرب نهاية البذل على مدى نصف ساعة لكل زجاجة (وبدون حقن مدرة للبول مثل اللازكس) تفصيلاً حسب الجدول.\n\n[جدول يوضح التركيز، حجم الزجاجة، محتوى الألبومين، وتكفي عدد لترات من البذل]:\n- التركيز %20 | حجم الزجاجة 50ml | محتوى الألبومين 10gm | تكفي لـ 2 لتر من البذل.\n- التركيز %20 | حجم الزجاجة 100ml | محتوى الألبومين 20gm | تكفي لـ 4 لتر من البذل.\n- التركيز %25 | حجم الزجاجة 50ml | محتوى الألبومين 12.5gm | تكفي لـ 2.5 لتر من البذل.\n- التركيز %25 | حجم الزجاجة 100ml | محتوى الألبومين 25gm | تكفي لـ 5 لتر من البذل.\n\n1. مرضى الالتهاب البريتوني التلقائي (SBP - Spontaneous Bacterial Peritonitis):\nإذا كانت الصفراء الإجمالية 4 ملجم أو أكثر أو كان الكرياتينين أعلى من الطبيعي لمنع الإصابة بفشل كلوي – كبدي ولا يوجد داع استعمال في المرضى الذين تقل فيهم الصفراء عن 4 ملجم والكرياتينين طبيعي.\nالجرعة 1.5 جرام لكل كيلو جرام من وزن المريض في أول يوم ثم يكرر بجرعة 1 ملجم لكل كيلو جرام من وزن المريض في ثالث يوم.\n2. في علاج الفشل الكلوي – الكبدي (Hepato- Renal Syndrome):\nيستخدم فقط في مراكز العلاج المتقدم التي يتوفر فيها إمكانيات زرع كبد. يستخدم فقط بالإضافة للأدوية المفعلة للدورة الدموية (جليوبريسين أو خليط أو كريوتايد- ميدودرين) ولا يستخدم الألبيومين بمفرده لعدم جدواه.\nالجرعة 20-40 جرام ألبومين يومياً بالإضافة إلى 0.5 ملجم – 2 ملجم جليوبرسين بالوريد كل 4 ساعات.\n\nلا يجب استخدام الألبومين في مرضى تليف الكبد من الكبار الذين لا يجري لهم جراحات إلا في الحالات المحددة سابقاً.", "Albumin Protocol\nAlbumin use in adults with liver cirrhosis\n\nI-There is no indication for albumin to correct hypo-albuminemia whatever the level of serum albumin.\n\nII-Indications:\n1-In Patients with Refractory Ascites undergoing large volume paracentesis (more than five liter paracentesis):\nDose 5 gm albumin per liter of Ascites removed once. (Bottle 50 ml 20% containing 10 gm albumin for every 2 liters Ascites removed) To be given after the end of the tap. Over 30 minutes and without lasix injection.\n\n1. Spontaneous Bacterial Peritonitis:\nIn Patients with elevated bilirubin (above 4 mg/dl and/or Creatinine above normal (not needed in patients with bilirubin < 4 mg / dl and normal Creatinine)\nDose: 1.5 gm/kg on first day and then 1 gm/ kg daily.\n\n2. Hepatorenal Syndrome:\nShould be used with vasoactive drugs should not be given without glyopressin or octreotide / midodrine.\nDose: 20 – 40 gm daily with glyopressin 0.5 -2 mg IV every 4 hrs\n\nAlbumin should not be used for adults with cirrhosis not undergoing surgery outside the above indications", "بروتوكول وصف الأدوية المسيلة للدم أثناء الحمل\nفي وجود تغيير صمامات القلب\n\n1. عند تأكد الحمل يوقف الماريفان ويستبدل بالهيبارين بجرعة تتراوح بين 10 إلى 15 ألف وحدة تحقن تحت الجلد كل 12 ساعة على أن يكون نتيجة تحليل PTT من 2 إلى 3 أضعاف المعدل الطبيعي ويستمر هذا النظام طوال فترة الثلاثة شهور الأولى من الحمل.\n2. في الثلاثة شهور الوسطى وحتى منتصف الثلاثة شهور الأخيرة تعود السيدة لأخذ الماريفان وتوقف الهيبارين مع ضبط الجرعة بحيث تكون الـ INR من 2 إلى 3 في حالة الصمام الأورطي أو الذبذبة الأذينية ومن 2.5 إلى 3.5 في حالة الصمام الميترالي.\n3. في منتصف الثلاثة شهور الأخيرة تعود السيدة لأخذ الهيبارين بنفس الجرعة السابقة ذكرها وتوقف الماريفان حتى الدخول في الولادة الطبيعية أو تحديد موعد للولادة القيصرية فيوقف الهيبارين قبلها بستة ساعات (6 ساعات).\n4. يستأنف الهيبارين بعد الولادة وبعد الاطمئنان على عدم وجود أي خطر للنزف ويعود معه الماريفان بنفس الجرعة السابق ذكرها حتى نصل بنتيجة تحليل الـ INR للمعدل المطلوب وعنده يتوقف الهيبارين وتستمر السيدة على الماريفان بعد ذلك وتتابع بالعيادة الخارجية.\n\nملحوظة هامة: لا توجد موانع للعلاج بالماريفان أثناء الرضاعة حيث أنه لا يفرز في اللبن.", "بروتوكول العلاج بالهيبارين منخفض الوزن الجزيئي\n\nدواعي الاستخدام -:\n1- الوقاية من الجلطات الوريدية العميقة والتي قد تؤدي إلى الانسداد الرئوي:\n* مرضى العمليات الجراحية في البطن.\n* مرضى جراحة استبدال مفصل الورك.\n* أمراض الحالات الحادة المقترنة بتقييد شديد للحركة.\n2- علاج الجلطات الوريدية العميقة الحادة. يعطى مع وارفارين.\n3- الوقاية من المضاعفات الإقفارية Ischemic للذبحة الصدرية غير المستقرة.\n4- علاج متلازمة الشريان التاجي الحادة المصحوبة بارتفاع فترة الأس تي. يعطى مع الأسبرين.\nمتوسط مدة العلاج: عشرة أيام.\n\nالجرعات:\n\n[جدول يوضح الجرعات لكل من Enoxaparin و Nadroparin]:\n- Prophylactic dose:\n* Enoxaparin: 40 mg SC Once daily\n* Nadroparin: 0.3ml (2.850 anti-Xa IU) Once daily\n- Therapeutic dose:\n* Enoxaparin: 1 mg / kg / 12 hr\n* Nadroparin: 86 anti-Xa IU PER kg body weight / 12 hr\n\n5- الوقاية من الجلطات أثناء الغسيل الكلوي:\nنادروبارين 65 وحدة / كجم من وزن الجسم تحقن في الشريان عند بدء كل جلسة.\nيستخدم نصف الجرعة في المرضى المعرضين لخطورة النزف.", "بروتوكول وصف LHRH Analogues\nLeutinising hormone releasing hormone Analogue\n\n• يصرف هذا الهرمون في حالات البلوغ المبكر المركزي (Central Preocious Puberty).\n• يصرف هذا الهرمون للحالات المذكورة بعد عمل الفحوصات الآتية:\n1. LHRH TEST:\nإذا كان Ratio = Peak of LH / FSH > 0.6\n2. رنين مغناطيسي على المخ:\nإذا كان الرنين المغناطيسي يظهر وجود أي أورام بالمخ مسببة للبلوغ المبكر المركزي.\n3. مقياس طول:\nإذا كان مقياس الطول أكثر من المعدل الطبيعي لطول المريض.\n4. عمل أشعة على الرسغ الأيسر لقياس السن العظمي:\nإذا كان السن العظمي أكثر من سن المريض الأصلي.\n\nDecapeptyl 3.75 mg Syringe\n1. لا يتم وصف هذا العقار إلا بعد إجراء الفحص الإكلينيكي والأبحاث المعملية اللازمة لذلك مثل:\n- LH LHRH\n- F S H\n- Estrogens\n- Testosteron\n2. يستمر إعطاء دواء Decapeptyl حتى عمر الحادية عشرة بالنسبة للذكور والإناث.", "Growth Hormone Treatment\n\nIndications:\n1. Short stature due to growth hormone deficiency.\n2. Turner Syndrome\n3. Hormonal replacement after treatment of brain tumor\n4. ISS with height less than -4SD with GV less than -1SD after 6 -12 months of observation\n\nDiagnostic Criteria for GH deficiency (GHD):\n1. Short stature (height < -3SD) that is inappropriate for the target centile range\n2. Subnormal growth-rate; as a rough guide less than 5cm per year in a prepubertal child over 2 years of age, to be calculated over a period of NOT less than 6 months\n3. Normal karyotype in girls\n4. Bone age delay < 2SD\n5. Normal thyroid functions. If abnormal, thyroid functions must be normalized with treatment before performing GH provocation\n6. Subnormal GH response to 2 provocation tests (insulin and clonidine). Peak GH < 7 ng/ml. Cortisol is to be measured in the 60 minute sample of an insulin tolerance test\n7. For the following categories one test is sufficient:\na. Defined CNS pathology\nb. History of irradiation\nc. Multiple pituitary hormone deficiency (MPHD)\n8. MRI sella turcica to be done on individual basis\n\nExclusion Criteria:\n1. Dysmorphic syndrome associated with short stature\n2. Skeletal dysplasia\n3. Systemic diseases causing growth failure\n4. Children under corticosteroid treatment\n5. Familial short stature\nMales with a bone age of 15.5 years or more and females with a bone age of 13.5 years or more", "6. Children with a known risk of malignancy, e.g. chromosomal abnormality such as Down and Bloom syndromes\n7. Evidence of brain atrophy\n8. Growth failure due to diabetes\n9. I.Q less than 75%\n\nDosage:\n• Dose for Growth hormone deficiencies :0.03 mg/kg/day or 0.09 IU/kg/day\n• Dose for ISS: 0.04 mg/kg or 0.12 IU/kg/day.\nGH should be given 7 days per week by subcutaneous injection. Results may worsen if frequency is reduced.\n\nResponse Criteria and Termination of Therapy:\n1. Minimum height velocity of 5cm/year\n2. In cases where the above criterion is not met, an increased dose of GH may be approved to a maximum of 0.04 mg/ kg/day or 0.12 IU/kg/day. If response is inadequate after a six-month period at the maximum dose, treatment should cease.\n3. No improvement of the standard deviation score after 1 year of treatment in prepubertal children or according to bone age.\n4. Growth hormone treatment should be discontinued once growth velocity declined to ≤ 2 cm/year (the bone age has reached 15.5 years in males and 13.5 years in females. This skeletal maturity represents 97.5% of estimated final height)\n5. In general, treatment with human growth hormone will cease once the patient has reached the 10th adult height centile (females 155 cm; males 165 cm)\n6. Turner Syndrome:\nGirls with Turner Syndrome will be considered for therapy, if their height is at or below the 75th centile on the Turner specific chart.", "1. Karyotype\n2. Bone age\n\nTreatment:\n• GH: 0.05 mg/kg/day (0.15 IU/kg/day). GH should be given at least 6 days per week by subcutaneous injection. Results may worsen if frequency is reduced.\n• Estrogen replacement: Started at a chronological age of 13 years. The starting dose of depot estradiol (Folone) IM is 0.2 mg; the dose is then increased at successive 6-month intervals by 0.2 mg initially and by 0.5 mg after a dose of 1.0 mg is reached, to a maximum of 3.0 mg monthly. Progestin is not prescribed until after 4 yr of estradiol therapy unless irregular menstrual bleeding occurs.\n\nResponse Criteria and Termination of Therapy:\nIn girls with Turner Syndrome, the growth velocity should exceed that normally expected in untreated Turner girls with reference to the Turner specific chart (at least 3 cm/year)\nTherapy may be continued until a satisfactory height has been attained or until the growth rate falls to (bone age is more than 14 years and the patient’s height has increased by) ≤ 2 cm/year.\n\nN.B.\nFor children with a height SD <-4 and normal GH provocation test, if a growth velocity calculated over a 6 month period is subnormal with decline of the standard deviation < 0.5, a trial of GH treatment for 6 months is started. If the child demonstrates a good response i.e. improvement of GV and height SDS, then therapy is continued. If no improvement is documented after 6 months, therapy is terminated.", "-3 أدوية الكبد", "HBV Protocol\n\nInclusion criteria for treatment\n• Age ≥ 18 years\n• HBsAg (+ve) for more than 6 months.\n• HBV DNA ≥ 2000 IU/ML.\n• ALT elevation above upper limit of normal on 2 successive occasions within 3 to 6 months.\n\nRole of Liver biopsy\nLiver biopsy is used to guide treatment decisions for patients who show:\n• HBV DNA ≥ 2000 IU/ML with persistently normal ALT.\n• HBV DNA < 2000 IU/ML with persistently elevated ALT.\n• HBV DNA < 2000 IU/ML with normal ALT and there is clinical evidence of liver disease or a family history of HCC\nTreatment is recommended for those with A2 and / or F2 or more (Metavir score)\n\nImmunotolerant cases\n• Patients under 40 years of age who are:\n– HBeAg positive.\n– With very high viral load.\n– Persistently normal ALT.\n• these patients are not candidate for treatment.\n• Follow up is recommended:\n– ALT every 3 months.\n– Quantitative HBV DNA by PCR every 6 months.\n• Consider liver biopsy if ALT becomes elevated on 2 successive occasions or in patients with a positive family history of HCC.\n\nMedications:\nFirst line therapy for all naïve patients is:\nEntecavir 0.5 mg once daily or Tenofovir 300mg once daily\n\nFor Patients already on treatment\n• CHB patients on Lamivudine and HBV DNA is undetectable by PCR → continue treatment with monitoring of ALT every 3 months and HBV DNA every 6 months.\n• Patients on combined Lamivudine & Adefovir → continue treatment or Shift to Tenofovir 300 mg once daily.\n• Lamivudine resistance → Shift: to Tenofovir 300 mg once daily.", "Pegylated Interferon\n• Poor response in Egyptian patients who are usually HBeAg negative and Genotype D.\n• HBeAg positive patients with high ALT level could be offered a chance of treatment with pegylated interferon alpha for 48 weeks.\n• Assessment is done at week 24 of therapy\n- In case of seroconversion (patient becomes HBeAg –ve and HBeAb +ve → continue treatment for 48 wks\n- If no seroconversion → stop treatment and shift to oral antiviral therapy according to previous guidelines\n\nSpecial Groups\nLiver Cirrhosis\nAll cirrhotic patients should receive oral antiviral therapy if HBV DNA is detectable by PCR irrespective of the viral load\nCompensated Cirrhosis:\n• Entecavir 0.5 mg or Tenofovir 300mg once daily.\nDecompensated Cirrhosis:\n• Entecavir 1 mg once daily.\n• The dose of antiviral needs to be adjusted in patients with low creatinine clearance (< 50ml/min).\n\nRenal Insufficiency\nEntecavir preferred, with dose adjustments according to creatinine clearance.\n\nPregnancy\nFor mothers:\n• all pregnant females should be screened for HBsAg.\n• Newly diagnosed pregnant women in the last trimester showing an HBV DNA level ≥ 105 IU/ML candidate for Lamivudine 100 mg or Tenofovir 300 mg once daily starting last trimester and for 3 months after delivery to decrease chance of new-born infection. Re-evaluate the condition after delivery and consider treatment according to the previous guidelines.\nFemales who become pregnant while on treatment:\n• On Lamivudine monotherapy: Continue on treatment\n• On Other lines of treatment: shift to class B drug (Tenofovir 300 mg once daily)", "Newborns\n• Newborns for chronic HBV mothers should receive HBIG and the first dose of HBV vaccine at birth (6-12 hours after delivery).\n\nHBV/HCV Co infection\n• Patients fulfilling the inclusion criteria for HBV treatment and have co-infection with active HCV (HCV RNA +ve by quantitative PCR), treat with:\nPeg IFN + Ribavirin\nThere is a potential risk of HBV reactivation during treatment or after clearance of HCV so measuring HBV DNA by PCR is recommended every 3 - 6 months while on therapy and after discontinuation of therapy and oral antiviral therapy for HBV may be started if needed.\n\nHBV/HDV Coinfection\n• Active HDV infection is confirmed by HDV RNA assays.\n• Peg –INF is the only effective drug against HDV.\n• Efficacy of Peg –INF is assessed during treatment after 3 - 6 months by measuring HDV RNA levels.\n• Optimal duration of therapy is not well defined but therapy for at least 72 wks.\n• Oral antiviral therapy should be used only when there is active HBV replication according to guidelines.\n• Refer the patient to a specialized HBV center.\n\nDialysis and Renal Transplant patients\n• All patients with renal dysfunction should be screened for HBV.\n• Seronegative patients should be vaccinated.\n• In patients with CHB Entecavir is preferred for treatment.\n• The dose should be adjusted according to creatinine clearance.\n\nImmunosuppressed Patients\n• All candidates for chemotherapy and immunosuppressive therapy should be screened for HBsAg and anti HBc prior to initiation of treatment.\n• Vaccination is mandatory for seronegative cases. Higher vaccine doses may be needed.\n• HBsAg positive patients (irrespective of the viral load) should receive oral antiviral therapy at the onset of chemotherapy and for 12 months after cessation of treatment.", "Immunosuppressed Patients\n• Patients who are:\n• HBsAg –ve, AntiHBc +ve, HBV PCR +ve should be managed in the same way as HBsAg +ve cases.\n• HBsAg –ve, AntiHBc +ve, HBV PCR –ve should be followed-up every 2 - 3 months. Start oral antiviral if HBV PCR becomes positive.\n\nWhich oral antiviral?\n• Viral load < 2000 IU/ml and short duration of immunosuppression use Lamivudine.\n• Viral load ≥2000 IU/ml and long duration or repeated courses of immunosuppression: use Entecavir or Tenofovir.\n\nWhen to stop antiviral Therapy?\n\n[جدول يوضح متى يتم إيقاف العلاج لمختلف الفئات]:\n- Patient HBeAg(+):\n* PegIFN-α therapy: 48 weeks\n* NA therapy: Stop treatment 6 -12 months after seroconversion\n- Patient HBeAg(-):\n* PegIFN-α therapy: IFN not recommended\n* NA therapy: Indefinitely, or until HBsAg seroconversion\n\nOn-treatment monitoring\n• every month: – Visits to receive medication and monitor for compliance and side effects.\n• Every 3 months – Check ALT. – For patients on Tenofovir and Adefovir check serum creatinine.\n• Every 6 months:\n– Check HBV DNA, liver profile, complete blood count, α-fetoprotein, abdominal ultrasound.\n\nMonitoring Patients who are NOT Candidates for Therapy\n• HBeAg Positive: Test ALT, HBeAg, HBV DNA, and HBsAg every 3 - 6 months.\n• HBeAg Negative: Test ALT, HBV DNA, HBsAg every 3 - 6 months.", "Acute HBV\n• Spontaneous recovery in more than 95% of cases and seroconversion to anti HBs without antiviral therapy. Supportive management and close monitoring for early identification of fulminant hepatitis.\n• Fulminant hepatitis :\nEntecavir 0.5 mg and to be continued for at least 6 months after seroconversion to anti HBs or for at least 12 months after seroconversion to anti HBe without HBs Ag loss.\n\nVaccination\n- Vaccination is highly recommended for:\n• Health care workers\n• Close contacts of viremic patients\n• Chronic renal failure patients before they start renal dialysis.\n• Chronic hepatitis C patients.\n• Immunosuppressed patients.\n• Multi transfused individuals", "HCV Protocol\n\nInclusion Criteria:-\n1- HCV RNA positivity.\n2- Age: ≥ 18 years\n- Patients ≥ 65 years old should undergo cardiological assessment prior to therapy by ECG, echocardiography and cardiological consultation.\n\nExclusion criteria: any of the following,\n1- Child's C cirrhotic patients.\n2- Platelet count < 50000/ mm3\n3- HCC, except 6 months after intervention aiming at cure with no evidence of activity by dynamic imaging (CT or MRI).\n4- Extra –hepatic malignancy except after two years of disease – free interval.\n- In cases of lymphomas and chronic lymphocytic leukemia, treatment can be initiated immediately after remission based on the treating oncologist report.\n5- Pregnancy or inability to use effective contraception.\n6- Inadequately controlled diabetes mellitus (HbA1c > 9 %).\n\nPatients will be categorized to:-\n1- Easy to treat group:\n- treatment naive\n- total serum bilirubin ≤ 1.2 mg / dl\n- Serum albumin ≥ 3.5 g/dl\n- INR ≤ 1.2\n- Platelet count ≥ 150.000 / mm3\n\n2- Difficult to treat group:\n- Peg-IFN treatment experienced\n- Total serum bilirubin ≥ 1.2 mg / dl\n- Serum albumin ≤ 3.5 g/dl\n- INR ≥ 1.2\n- Platelet count < 150.000 / mm3", "* Assessment of fibrosis: with FIB- 4 is a must.\n* Treatment Monitoring: HCV viral load estimation at any time point Between 12 and 24 weeks post – treatment to confirm successful eradication of the virus\n\nEasy to treat group: eligible to be treated by the following regimens for 12 weeks:\n• Paritaprevir-r/ombitasvir + Ribavirin\n• Sofosbuvir + daclatasvir\n\nDifficult to treat group: eligible to be treated by the following regimen for 12 weeks:\n• Sofosbuvir + daclatasvir+ ribavirin\n\n* the starting dose of ribavirin is 600 mg / day. A trial should be done to reach a dose of 1000 mg / day based on the patient tolerability.\n\nTreatment of special populations\n- Non - responders to a previous DAAs regimen.\n- Advanced liver disease (CHILD score ≤ 9)\n- Post- organ transplantation\n- chronic kidney disease (CKD)\n- HCV coinfection with HBV and HIV\n\n1- Retreatment of patients with previous DAAs Failure\n* Retreatment of patients with previous SOF / DAC Regimen Failure\nA- Non – cirrhotic Patients and Patients with Compensated cirrhosis:\nOption 1: -SOF / Qurevo / RBV for 12 weeks\n- RBV ineligible: extend therapy for 24 weeks\nOption 2 : -SOF/SIM/DAC/RBV for 12 weeks .", "- RBV ineligible extend therapy for 24 weeks\nB- Child's B Cirrhotic Patients: (Refer to specialized centers)\n- SOF / DAC/ RBV for 24 weeks\nC- Deferral of therapy:\n- Child's C cirrhotic patients\n- Previous failure to 24 weeks SOF/DAC ± RBV regimen.\n- Previous deterioration on same regimen.\n* Retreatment of patients with previous SOF / SIM Regimen Failure.\n- SOF / DAC/ RBV for 12 weeks\n- RBV ineligible: extend therapy for 24 weeks\n\nNB: Ribavirin dose:\n- 1000 mg for patients < 75 kg.\n- 1200 mg for patients > 75 kg.\n\n2- Treatment of Patients with advanced liver disease (child's ≤ 9):\n* Treatment is allowed only in one of several assigned specialized centers\n* the following regimen is used for 12 weeks:\n- Sofosbuvir + Daclatasvir+Ribavirin\nthe starting dose of ribavirin is 600 mg / day. Atrial should be done to reach a dose of 1000 mg / day based on the patient tolerability.\n\n3- treatment of patients with chronic kidney disease (CKD):-\nIn patients having a serum creatinine exceeding the upper normal level, eGFR is calculated, and, accordingly.\n* Patients with CKD eGFR > 30 ml / min) are treated by the usual treatment regimens.\n* Patients with CKD eGFR ≤ 30 ml / min are treated by:\nparitaprevir-r / Ombitasvir + ribavirin, provided the following are fulfilled:", "- Patients have compensated liver (Child A cirrhosis or no cirrhosis).\n- Hb level is at least 10 g/ dl\n- The patient has no associated uncontrolled co- morbidity (cardiac, neuro-psychic...)\n- A nephrologist consultation is done. A report determining the treatment eligibility and necessity, and the exact ribavirin recommended dose (and time of administration in relation to dialysis)\nIn case of dialysis, the patient should be aware of the high risk of re-infection by signing a consent form.\n\n4- Treatment of patients with post organ transplantation:\n- Treatment will be with Sofosbuvir + Daclatasvir ± Ribavirin for 24 weeks\n\n5- Treatment of patients with Combined HCV and HBV.\n- Patients should be treated with the same regimens, following the same rules as HCV monoinfected patients\n- if HBV replicates at significant levels before, during or after HCV clearance, concurrent HBV nucleoside / nucleotide analogue therapy is indicated.\n\n6- Treatment of patients with Combined HCV and HIV:\n- Co- management by the hepatologist and the treating infectious disease physician is needed\n- Sofosbuvir should not be received in combination with tipranavir.", "-4 أدوية أمراض الدم", "بروتوكول علاج مرض الثلاسيميا\nضوابط علاج مرض الثلاسيميا للكبار\n\nقبل العلاج يتم عمل تحليل:\n1- أنزيمات الكبد\n2- S. Ferrittin\n\n• إذا كانت إنزيمات الكبد (SGPT) في الحدود الطبيعية (Normal SGPT) و (S. Ferrittin > 1000) يتم إعطاء المريض علاج أقراص ديفربرون فقط (L1) كيلفر أقراص (علبة 50 قرص) بجرعة من 50-75 مجم / كجم من وزن الجسم، أي حوالي ثلاثة علب شهرياً بجرعة 2 قرص 3 مرات يومياً.\nمع مراعاة عمل صورة دم كاملة (CBC + Diff) حسب الحالة وكذلك أنزيمات كبد (SGPT) كل 3 شهور، TLC . ANC.\nعند حدوث أعراض جانبية من عقار كيلفر مثل ارتفاع انزيمات الكبد لأكثر من الضعف والنصف وانخفاض كرات الدم البيضاء عن 3000 TLC:\nTLC < 3000\nANC < 1500\nيستلزم ذلك وقف عقار الكيلفر وإعطاء المريض ديسفرال 5 أيام في الأسبوع + 2 يوم راحة.", "بروتوكول العلاج الخاص للتخلص من الحديد الزائد\nفي مرضى أنيميا البحر المتوسط\n\nأولاً -: بروتوكول العلاج الخاص للتخلص من الحديد الزائد باستخدام دواء ExJade.\nيستخدم عقار Exjade لمرضى أنيميا البحر المتوسط لعلاج زيادة الحديد بالجسم للأطفال من 2 إلى 10 سنوات والمرضى المصابين بحساسية أو مضاعفات من أنواع العلاج الأخرى.\nويتم احتساب جرعة الإكسجيد طبقاً لمستوى الفريتين في دم المريض وذلك على النحو التالي:\n\n[جدول يوضح جرعات Exjade حسب مستوى Ferritin]:\n- Ferritin level: 1000-2000 | Exjade Dose: 20mg/kg/day\n- Ferritin level: 2000-3000 | Exjade Dose: 25mg/kg/day\n- Ferritin level: 3000-4000 | Exjade Dose: 30mg/kg/day\n- Ferritin level: > 4000 | Exjade Dose: 30-40mg/kg/day\n\nثانياً -: التعاون في مجال زرع النخاع لأطفال مرضى الدم بالتأمين الصحي في وحدة زرع النخاع بمستشفى الأطفال الجامعي:\nواتفقت اللجنة أيضاً على قيام قسم أمراض الدم وزرع النخاع بمستشفى الأطفال الجامعي (أبو الريش المنيرة) باستقبال وعمل زرع الخلايا الجذعية لمرضى أنيميا البحر المتوسط وفشل النخاع العظمي وغيرها من أمراض الدم بالتأمين الصحي.", "إعادة تقييم ضوابط علاج الثلاسيميا بالنسبة للطلبة\n\nقبل العلاج يتم عمل تحليل:\n1- أنزيمات الكبد\n2- S. Ferrittin\n\nلعلاج الثلاسيميا في حالة المرضى التي يكون فيها:\nإنزيمات الكبد (SGPT) في الحدود الطبيعية (Normal SGPT) و (S. Ferrittin > 1000)، يتم إعطاء المريض علاج أقراص ديفربرون فقط (L1) كيلفر أقراص (علبة 50 قرص) بالجرعات التالية:\nالجرعة 75 مجم / كجم / اليوم لمدة 7 أيام في الأسبوع وتكون كالآتي:\n- وزن الجسم في حدود 25 كجم : متوسط 1.5 علبة / شهر.\n- وزن الجسم في حدود 35 كجم : متوسط 2 علبة / شهر.\n- وزن الجسم في حدود 45 كجم : متوسط 2.5 علبة / شهر.\nمع مراعاة عمل صورة دم كاملة (CBC + Diff) كل أسبوعين أو كل شهر حسب الحالة وكذلك أنزيمات كبد (SGPT) كل 3 شهور، TLC . ANC و S. Ferrittin كل 6 شهور.\nوفي حالة انخفاض Total Leucocytic count أو Absolute Neutrophil count عن 1500 (ANC < 1500) وارتفاع أنزيمات الكبد (SGPT) لأكثر من الضعف ونصف الطبيعي يوقف العلاج بالأقراص.", "* إذا كانت إنزيمات الكبد مرتفعة ولكن أقل من ثلاثة أضعاف الطبيعي:\nيتم إعطاء المريض العلاج لمدة 4 أيام أقراص ديفربرون (كيلفر أقراص) + 3 يوم حقن ديسفيرال / أسبوع وتكون الجرعة كالآتي:\n- وزن الجسم في حدود 25 كجم : علبة ديفربرون (كيلفر) + 1 علبة ديسفيرال (العلبة 10 فيال).\n- وزن الجسم في حدود 35 كجم : 1.25 علبة ديفربرون (كيلفر) + 1.5 علبة ديسفيرال.\n- وزن الجسم في حدود 45 كجم : 1.5 علبة ديفربرون (كيلفر) + 2 علبة ديسفيرال.\nمع مراعاة عمل صورة دم وأنزيمات كبد كل شهر.\n\n* إذا كانت إنزيمات الكبد مرتفعة لأكثر من ثلاث أضعاف الطبيعي:\nيتم إعطاء المريض العلاج بحقن الديسفيرال فقط لمدة 5 أيام / أسبوع وراحة يومين وتكون الجرعة كالآتي:\n- وزن الجسم في حدود 25 كجم:\n* 2 علبة في حالة S. Ferrittin < 2500\n* 3 علبة في حالة S. Ferrittin > 2500\n- وزن الجسم في حدود 35 كجم:\n* 2.5 علبة في حالة S. Ferrittin < 2500\n* 3.5 علبة في حالة S. Ferrittin > 2500\n- وزن الجسم في حدود 45 كجم:\n* 3 علبة في حالة S. Ferrittin < 2500\n* 4 علبة في حالة S. Ferrittin > 2500\n\nملحوظة -: ضرورة استرداد جميع الفوارغ قبل صرف العلاج للشهر التالي.", "معايير استخدام Deferiprone – Ferriprox\n\nيستخدم عقار Deferiprone – Ferriprox لمرضى أنيميا البحر المتوسط لعلاج زيادة الحديد بالجسم وذلك على النحو التالي:\n• نسبة مخزون الحديد (فريتين) 1000 – 2500 مجم / لتر:\nجرعة فريبروكس : 75 مجم / كجم / اليوم (مقسمة على ثلاث جرعات بالفم).\n• نسبة مخزون الحديد (فريتين) 2500 – 4000 مجم / لتر:\nجرعة فيبروكس : 100 مجم / كجم / اليوم (مقسمة على ثلاث جرعات بالفم).\n\n[جدول يوضح مستويات Ferritin وجرعة Ferriprox]:\n- S. Ferritin Level: 1000 – 2500 mg / dl | Ferriprox Dose: 75 mg/ kg / day (TDS)\n- S. Ferritin Level: 2500 – 4000 mg/ dl | Ferriprox Dose: 100 mg / kg / day (TDS)\n\n• مع عمل وظائف الكبد وصورة دم كاملة للمريض شهرياً.\n• تحليل مخزون الحديد كل 3 - 6 شهور.", "مرض الهيموفيليا Hemophilia وتشخيصه\n\nالهيموفيليا (أ) و (ب) هو مرض وراثي ويورث.\n- سبب المرض هو نقص عامل 8 (Factor 8) وعامل 9 (Factor 9) على التوالي.\n- نسبة المرض لنقص في عامل 8 (Factor 8) واحد لكل 10000 مولود ذكر تقريباً، وللنقص في عامل 9 (Factor 9) تكون تقريباً واحد لكل 30 إلى 50 ألف مولود ذكر.\n- تشخيص المرض:\n* خطوة أولى: \n- تاريخ مرضي للنزف المتكرر.\n- زمن البروثرومبين PT طبيعي.\n- زمن ثرومبوبلاستين PTT أكبر من الطبيعي.\n- زمن النزف طبيعي.\n* خطوة ثانية:\n- يتم عمل تحليل لمستوى عامل 8، 9 (Factor 8 & 9) في الدم.\nملحوظة: (Factor 8 & 9) ومركزات الكريو وFresh Frozen Plasma المدرجة بالبروتوكول يتم إعطائها للمريض داخل وحدات الهيئة.\n\nالتقسيم الإكلينيكي للأشخاص المصابين بمرض الهيموفيليا (أ) ، (ب):\n\n[جدول يوضح التقسيم الإكلينيكي]:\n- هيموفيليا شديدة:\n* عادة أقل من 1% نسبة العامل (Factor 8) أو (Factor 9).\n* النزف التلقائي عرض شديد ومتكرر.\n* يمكن أن ينزف مرة أو مرتين أسبوعياً.\n* يتميز بإصابات المفاصل (نزيف بالمفاصل).\n- هيموفيليا متوسطة:\n* من 1% إلى 5% نسبة العامل (Factor 8) أو (Factor 9).\n* نزف مع الإصابات البسيطة.\n* يمكن أن ينزف مرة واحدة شهرياً.\n* يمكن أن تصاب المفاصل.\n- هيموفيليا بسيطة:\n* أكثر من 5% إلى 30% نسبة العامل (Factor 8) أو (Factor 9).\n* نزف مع الإصابات الشديدة والعمليات الجراحية.\n* يمكن ألا يعاني من النزيف أبداً.\n* نادراً ما تصاب المفاصل.\n\nيتم علاج الحالات بدون نزف خارج المستشفى، أما في حالات النزف فيتم العلاج داخل المستشفى أو خارجها حسب شدة الحالة ومكان النزف.\n\nعلاج تعويضي لحالات الهيموفيليا الشديدة (Factor 8) نسبة أقل من 1%:\nيمكن إعطاء علاج تعويضي من دواء Anti Hemophilic Globulin بمعدل زجاجة واحدة تحتوي على 200 وحدة محضرة في هيئة المصل واللقاح بمعدل 3 مرات أسبوعياً.", "علاج النزيف في مرض الهيموفيليا (أ) Hemophilia A\n\nداخلي وخارجي:\n1. عامل التجلط رقم 8 مركز (Factor 8 Concentrate):\n- كل وحدة من عامل التجلط رقم 8 (Factor 8) لكل كجم من وزن الجسم تنقل للمريض ترفع نسبة عامل التجلط بالدم حوالي 2%.\n- لحساب الجرعة: يتم ضرب وزن الجسم بالكجم في مستوى العامل (Factor 8) المرغوب الحصول عليه في 1/2 وهذا يعطينا عدد وحدات العامل (Factor 8) المطلوب نقلها للمريض.\n2. مركزات الكريو Cryoprecipitate:\nبحد أقصى 8 وحدات يومياً حيث أن الكيس المصنع من كيس واحد من دم متبرع يحتوي على حوالي 60-100 وحدة من عامل التجلط رقم 8 (Factor 8) وعامل فون ويلبراند و 200-300 مجم من الفيبرينوجين في حجم 10-20 مللي.\n3. البلازما الطازجة المجمدة Fresh Frozen Plasma.\n4. Anti Fibrinolytic Agents (Tranexamic Acid) أو Aminocaproic Acid:\nأولاً: في حالات النزف البسيط:\n- الجرعة 25 مجم / كجم كل 8 ساعات أقراص Tranexamic Acid لمدة 10 أيام أو Aminocaproic Acid أقراص بجرعة 1000 مجم / 8 ساعات لمدة 7 أيام للبالغين.\nثانياً: في حالات النزف الشديد:\n1. يستعمل Aminocaproic Acid أمبول وريد بجرعة 2 أمبول 500 مجم / 8 ساعات لمدة أسبوع للبالغين.\n- الجرعة من 10 إلى 20 وحدة / كجم من عقار عامل 8 (Factor 8) المناسب الأقل نقاءً والذي يحتوي على VWF أكثر.\n- يمكن تكرار هذه الجرعة في حالات النزيف الشديد أو العمليات من 8-12 يوم.\n2. Anti Fibrinolytic Agents (Tranexamic Acid):\nيستعمل كعلاج لحالات النزف البسيطة من اللثة والأنف والرحم، أما في الحالات المتوسطة والشديدة يستعمل مع DDAVP أو عامل 8 المناسب بنفس جرعة الهيموفيليا البسيطة.\n1. أقراص الاستروجين + البروجسترون يستعمل في حالات المراهقة لعلاج حالات النزف مع الدورة الشهرية أو النزف مع مضاعفات التبويض مع المرضى مع عدم إيقاف العقاقير إلا بعد استكمال الجرعة الكاملة للعلاج بديسموبريسين أو فاكتور 8.", "علاج مرض الهيموفيليا (ب) Hemophilia B\n\n1. عامل التجلط رقم 9 مركز (Factor 9) Concentrate:\n- كل وحدة من عامل التجلط رقم 9 (Factor 9) لكل كجم من وزن الجسم تنقل للمريض ترفع نسبة عامل التجلط 9 (Factor 9) بالدم حوالي 1%.\n- لحساب الجرعة: يتم ضرب وزن الجسم بالكجم في مستوى العامل (Factor 9) المرغوب الحصول عليه وهذا يعطينا عدد وحدات العامل (Factor 9) المطلوب نقلها للمريض.\n2. البلازما الطازجة المجمدة Fresh Frozen Plasma:\n- تستعمل في حالات Emergency في حالة عدم توافر عامل 9 (Factor 9).\n\nمضاعفات مرض الهيموفيليا Hemophilia:\n- تكوين عوامل مضادة أو مقاومة للمفعول Factor Inhibitors.\n- ويمكن علاج ذلك بالآتي:\n- Corticosteroids\n- Immunosuppressive Therapy", "مرض Von Willebrand VWD\n\nمرض Von Willebrand هو مرض وراثي ويورث ويصيب كل من الذكور والإناث وغالباً ما يوجد تاريخ مرضي بهذا المرض في العائلة.\nسبب المرض: نقص عامل VW (VW Factor).\n\nتشخيص الحالة:\n1. زيادة في P.T.T.\n2. انخفاض في عامل 8 (Factor 8) في الدم.\n3. P.T طبيعي.\n4. الزيادة في زمن النزف (Bleeding Time).\n\nعلاج مرض Von Willebrand VWD:\n2. ديسموبريسين Desmopressin DDAVP:\n- يعتبر العلاج الأمثل لعلاج حالات النوع الأول والثاني (أ) في النزف البسيط حيث يوجد نقص في مستوى عامل VW (VW Factor).\n- جرعة DDAVP: 0.3 ميكروجرام / كجم في الوزن للحقن الوريدي أو تحت الجلد.\n- لا يتم إعطائه لعلاج حالات النوع الثاني (ب) أو حالات VWD الكاذبة.\n- لا يتم إعطائه في حالات قصور الشريان التاجي.\n3. في حالات النزف (المتوسط أو الشديد): يستعمل عقار عامل التجلط رقم 8 مركز (Factor 8) Concentrate الذي يحتوي على نسبة عالية من عامل VW (VW Factor) أو مركزات الكريو Cryoprecipitate بحد أقصى 8 وحدات يومياً من الكريو.", "[جدول يوضح نوع النزيف والجرعات المناسبة لهيموفيليا أ و ب]:\n\n- نوع النزيف: المفاصل.\n* هيموفيليا أ (عامل 8):\n- المستوى المرغوب: %40\n- الجرعة: 20 وحدة/كجم/12 ساعة، وإن استمر المفصل متورماً بعد 24 ساعة يتم دخوله المستشفى يستكمل العلاج لمدة يومين آخرين ويعطى بريدنيزون 2 مجم/كجم يوم لمدة يوم واحد ثم 1 مجم/كجم/يوم لمدة يومين.\n* هيموفيليا ب (عامل 9):\n- المستوى المرغوب: %40\n- الجرعة: 40 وحدة/كجم/24 ساعة، وإن استمر المفصل متورماً بعد 24 ساعة يتم دخوله المستشفى يستكمل العلاج لمدة يومين آخرين ويعطى بريدنيزون 2 مجم/كجم يوم لمدة يوم واحد ثم 1 مجم/كجم/يوم لمدة يومين.\n\n- نوع النزيف: الجهاز العصبي المركزي والدماغ داخل المستشفى.\n* هيموفيليا أ (عامل 8):\n- المستوى المرغوب: أولاً %80-%100 ثم %50\n- الجرعة: 40-50 وحدة/كجم/8 ساعات لمدة يوم واحد، ثم 40-50 وحدة/كجم/12 ساعة لمدة 8 أيام، ثم 25 وحدة/كجم/12 ساعة لمدة 7 أيام.\n* هيموفيليا ب (عامل 9):\n- المستوى المرغوب: أولاً %80-%100 ثم %50\n- الجرعة: 50 وحدة/كجم/6 ساعات لمدة يوم واحد، ثم 50 وحدة/كجم/12 ساعة لمدة 3 أيام، ثم 50 وحدة/كجم/24 ساعة لمدة 12 يوماً.", "ضوابط العلاج بعقار (7 Novo) لمرضى النزيف\n\nمرضى نقص عامل 7 للتجلط:\n- الذين يعانون من نزيف بصفة متكررة ومستمرة وغير مستجيبين للعلاج بالبلازما.\n- في بعض حالات النزيف الذي يعرض حياتهم للخطر إذا لم يتم إعطائهم العلاج (عامل 7) فور دخول المريض للمستشفى كحالات (نزيف المخ – نزيف البطن - نزيف الرئة، نزيف المسالك البولية).\n\nمرضى هيموفيليا (أ) – نقص عامل (8) للتجلط:\n- الذين يعانون من عدم الاستجابة للعلاج بعقار عامل (8) أو الكريو نتيجة وجود أجسام مضادة لعامل (8) لديهم بالدم (خلال الثلاثة أشهر إلى ستة أشهر الأخيرة).\n- الذين يعانون من نزيف شديد في المفاصل، العضلات، الكلى، الرئة – ولا يستجيبون للعلاج المعتاد أو المدة المعتادة للعلاج ويحتاجون لسرعة العلاج بعقار عامل (7) حتى يتم السيطرة على النزيف طبقاً للبروتوكولات العالمية.\n\n- مرضى خلل الصفائح الدموية مع نزيف شديد والذين لا يستجيبون لنقل الصفائح الدموية.\n- مرضى الهيموفيليا المكتسبة:\n- الذين يعانون من أمراض مناعية أو نتيجة التهابات ميكروبية شديدة.", "بروتوكول وصف دواء مينيرين بخاخة أو أقراص\nلحالات سلس البول المركزي\n\n- يصرف هذا الدواء لمرضى سلس البول المركزي فقط. ويتم تشخيصه عن طريق تجميع بول 24 ساعة وعمل الكثافة النوعية للبول.\n- يتم عمل Water Deprivation Test لتشخيص المرض أولاً ثم للتفرقة بين سلس البول المركزي والكلوي (Nephrogenic).\n- ليس من المهم عمل (Antidiuretic Hormone) كاختبار لعدم دقته.\n\nالعلاج:\n- يتم صرف عدد (2) علبة أقراص مينيرين أو عدد (2) علبة مينيرين بخاخة للبالغين أو الأطفال.\n- في حالة احتياج المريض إلى أكثر من 2 علبة (سواء من الأقراص أو البخاخة).\n- يتم دخول المريض المستشفى حتى يتسنى تحديد الجرعة المفروض إعطائها للمريض بواسطة الاستشاري.\nعلى أن يكون الحد الأقصى 3 علب فقط سواء من الأقراص أو البخاخات.", "بروتوكول وصف المضادات الحيوية بوحدات الهيئة العامة للتأمين الصحي\n\n1) عند عرض المرضى على الطبيب (ممارس، أخصائي، استشاري) يجب على الطبيب أن لا يتعدى اختيار المضادات الحيوية عن أحد الأصناف الآتية:\nأصناف المجموعة الأولى وهي:\n- Phenoxymethyl penicillin\n- Ampicillin\n- Amoxicillin (Bacampicillin)\n- Doxycycline\n- Co-trimoxazole\n- Benzyl penicillin\n- Long acting penicillin\nولا يجوز الجمع بين صنفين في آن واحد.\n\n2) لا ينتقل العلاج للجدول الثاني إلا بعد مرور 4 أيام من العلاج بالمجموعة الأولى على الأقل.\n3) يتم الانتقال إلى أحد أصناف المجموعة الثانية بواسطة الأخصائي أو الاستشاري طبقاً للتعليمات الآتية:\nأ) أن يكون المريض قد استخدم أحد أصناف المجموعة الأولى لمدة 4 أيام ولم تحدث أي استجابة للدواء.\nب) ظهور إحدى العلامات المرضية التي تظهر أحد أنواع الأمراض التي لا تستجيب للمجموعة الأولى.\n\nأصناف المجموعة الثانية:\n- Erythromycin\n- Flucloxacillin (Cloxacillin)\n- Cefadroxil - Cefalexin\n- Metronidazole\n- Topical Anti biotics\n- Amoxycillin + Clavulanic Acid\n- Spiramycin\n- Clindamycin\n- Ciprofloxacillin", "أما بالنسبة للأمراض التي يحتاج علاجها إلى أدوية محددة بعينها يتم وصف هذه الأدوية مباشرة مثال-:\nأ) مرض الدرن يوصف له Rifampicin.\nب) مرض الجيارديا لامبليا يوصف له Metronidazole.\n\nالمجموعة الثالثة للمستشفيات فقط-:\n- Quinolones (Norfloxacin, ofloxacin, Pefloxacin, Ciprofloxacin)\n- Clindamycin (inj)\n- Cephalosporin (inj)\n- Aminoglycosides (inj)\n- Sulbactam/Ampicillin\n\nالمجموعة الرابعة-:\nولا تعطى إلا للحالات النادرة جداً المخصصة لها (ممارس، أخصائي، استشاري) مثال-:\n- Fucidic acid – Vancomycin – Chloramphenicol – Rifampicin\n\nملحوظة:\n1- على أن تكون الأولوية عند الوصف والصرف للصنف الأقل سعراً.\n2- يقتصر وصف المضادات الحيوية بمعرفة الممارس لعلاج 4 أيام وللأخصائي والاستشاري لعلاج أسبوع واحد، ويمكن إعادة وصفها بمعرفة الأخصائي أو الاستشاري عند الحاجة (فيما عدا الدرن).", "Rheumatic heart disease : Guidelines for secondary prevention by Benzathine penicillin G (BPG)\n\nRheumatic fever (RF) is a non- suppurative sequel of Group A beta hemolytic streptococcal (GAS) infection of the upper respiratory tract due to a delayed immune response. It affects mainly children and young adults in their most productive years.\n\nStudies done with the WHO (World Health Organization) have clearly shown that a proper primary health care and secondary prevention program are both cost effective and inexpensive and hence reduce the burden of disease.\n\nDespite the documented decrease in the incidence of acute rheumatic fever and prevalence of rheumatic heart disease (RHD), it still is an important cause of cardiovascular disease worldwide. Heart valve surgery adds to the lifelong burden of disease.\n\nARF/RHD prevention:\nPrimordial level:\n- improve environment of the population at risk; housing, reduce overcrowding\n- active case detection and treatment of streptococcal sore throat\n- Primary prevention: treatment of acute streptococcal pharyngitis with antibiotics to reduce the incidence of RF.\n- Secondary prevention – is the key focus of most control strategies, due to its proven efficacy, cost – effectiveness, and the challenges of primordial and primary prevention.\n\nBenzathine penicillin G (BPG) is indicated for people with a history of acute rheumatic fever (ARF) and rheumatic heart disease (RHD) as secondary prophylaxis against GAS infections that can precipitate a recurrence of RF. It significantly reduces ARF recurrence rates and the severity of rheumatic valvular lesions. The WHO considers BPG an essential medicine.", "Dosage:\nAdults and children > 30 kg: 1,200,000 international units (900mg), By intramuscular injection every 4 weeks\nThe recommended dose of BPG for children up to 27-30 kg is 450 mg (600,000 IU) IM every 4 weeks.\n\nOptimum frequency of administration:\n4- weekly injections are effective if good adherence can be assured. The drug can be given more frequently – every 3 weeks – if there is a desire to further increase the efficacy in preventing recurrent ARF.\n\nStandard care:\nDuration of secondary prophylaxis depends on history of carditis and if valvular involvement persists\nMinimum duration is 10 years since last ARF episode or until age 21 years, whichever is longer, with prolongation till age 35-40 years in individuals with significant valvular disease.\n\nN.B: Missing even a single dose of BPG raises the risk of recurrent RF.\n\nDuration for secondary prophylaxis for rheumatic fever:\n\n[جدول يوضح الفئة وفترة العلاج الوقائي]:\n- Rheumatic fever without carditis: 5 years or until age 21 years (whichever is longer)\n- Rheumatic fever with carditis but no residual heart disease (no valvular disease): 10 years or until age 21 years (whichever is longer)\n- Rheumatic fever with carditis and residual heart disease (persistent valvular disease): 10 years or until age 40 years (whichever is longer); life time prophylaxis may be needed.\n\nN.B: Stop using BPG for treatment of other infections (e.g. streptococcal pharyngitis) where other effective antibiotics are available.", "5 - أدوية الرمد", "بروتوكول العمل للعلاج بالحقن داخل العين\nبعقار Anti-VEGF المعروف باسم (Lucentis)\n\nإدخال خدمة حديثة في مجال طب العيون وهي العلاج بالحقن داخل العين بعقار Anti-VEGF المعروف باسم (Lucentis) للمرضى الذين يعانون من Wet age related macular degeneration والذي يتسبب في ضعف قوة الإبصار.\n\nأولاً -:\n- إن إجراء الحقن بالعقار المذكور هو أحد الحلول الحديثة المتاحة حالياً للمرضى الذين يعانون من هذا التشخيص وهو يساعد على المحافظة على النظر وتحسين نسبي في قوة الإبصار عند هؤلاء المرضى حتى يتمكنوا من ممارسة حياتهم اليومية.\nيتم تشخيص المرض عن طريق OCT & Fluorescein angiography.\n\nثانياً -:\n- تم تحديد معايير الاختيار للمريض الذي سوف يعالج عن طريق حقن عقار (Lucentis) داخل العين وهي كالآتي:\n1- The procedure will be done to the patient above 40 years\n2- The patient with a visual acuity not less than 6/60\n3- In patients presenting with bilateral disease the better eye is chosen for injection.\n4- If no improvement after the second dose the procedure is stopped. The improvement is judged by post injection OCT & Fluorescein tests plus improvement in the reading capabilities\n5- Three doses for maximum are given\nعلى أن تقرر اللجنة ما يلزم بعد ذلك من علاج بالليزر.\n6- Pre- & Post surgery OCT & Fluorescein tests is a must to follow up the case & to be able to receive the feedback & to measure the percentage of actual success\n* (1) & (2) is not followed in single eyed patient.\n\nتوصيات اللجنة: -\n- أن يتم الحقن في إحدى مستشفيات الهيئة.\n- أن يوقع المريض على الإقرار قبل إجراء الحقن.\n- الإجراء من الممكن أن يقوم به أخصائي الرمد المدرب على الحقن داخل العين والتوصيف جراحة متوسطة.\n** ترى اللجنة العليا لأمراض العيون بالهيئة إضافة DME (ارتشاح الشبكية السكري) للبروتوكول الحالي.", "وذلك بالضوابط التالية -:\n1- ضعف الإبصار الناتج عن تورم مركز الإبصار (الماقولة) بالشبكية نتيجة الاعتلال السكري بالشبكية DME.\n2- الالتزام بعمل الأشعة المقطعية OCT وتصوير قاع العين بصبغة الفلورسين FFA.\n3- أن يكون سمك المنطقة المركزية بمركز الإبصار تجاوز الـ 400 ميكرومتر عند بدء العلاج.\nEdema involving center of macula with visual impairment & central retinal thickness of 400 micrometers or more at start of treatment.\n4- عدم وجود تليفات أو التصاقات بمركز الإبصار.\n5- على أن يكون عدد الجرعات التي تحقن بالعين 3 جرعات وفي حالة التحسن يمكن أن تضاف جرعتان إضافيتان.\n6- العلاج ليس له بديل وأساسي وضروري للمريض.", "6– أدوية هشاشة العظام", "بروتوكول لعلاج مرضى هشاشة العظام\n\n* علاج مرضى هشاشة العظام طبقاً لنسبة قياس كثافة العظام DEXA وهو على النحو التالي:\n* علاج دوائي بالفم أسبوعي أو شهري وهي كالآتي:\nResidronate tab أو Alendronate\nوذلك لمرضى Osteoporosis ما بين T.Score -2.5 , 1.5 SD.\n* علاج بالإبر كل (6) شهور إبرة تحت الجلد بمادة Prolia (Denosumab) وذلك لـ Osteoporosis ما بين 2.5 - 3.5.\n* علاج بالإبر اليومية تحت الجلد لمدة ستة شهور لحالات الهشاشة المتقدمة Forteo inj (أكثر من 3.5 - Severe Osteoporosis).\nعلى أن يتم إعادة تقييم حالة المرضى بعد ستة أشهر لمرضى الـ Forteo بعمل قياس كثافة عظام جديدة.\n* ويتم إعادة تقييم حالة مرضى الـ Prolia (Denosumab) بعد (12) شهراً من بداية العلاج.\n* يتم صرف علاج الـ Prolia لبعض المرضى التي يوجب علاجها لو كان قياس كثافة العظام ما بين 2.0 - 2.5 لو كان يوجد تاريخ لكسور ناتجة عن هشاشة العظام.\n* كذلك يتم صرف الـ Forteo لمرضى الهشاشة مع وجود كسور ناتجة عن الهشاشة لقياس 3.0 - وذلك للأهمية القصوى.", "طريقة الصرف والتداول والحفظ للأدوية المخدرة داخل مستشفيات الهيئة\n\nنظام صرف المخدرات من المخازن أو المستودعات:\n- يراعى عند صرف المواد المخدرة من الشركة المصرية لتجارة الأدوية أو المستودعات التابعة لوزارة الصحة أن تذكر (كلمة مخدرات) على طلب الصرف الصادر من المستشفى وأن يكون مختوماً ومعتمداً من مدير المستشفى.\n- تكتب أسماء المواد المخدرة بوضوح مع ذكر وصفها وقوة تركيزها باللغة العربية كما تكتب كمياتها وقوة تركيزها بالأرقام والحروف.\n- لا يجوز الكشط أو الشطب في المستند.\n- تكتب الكمية المنصرفة من المخازن بالأرقام والحروف باللغة العربية.\n- يكون الصيدلي المسئول عن عهدة المخدرات بالمستشفى معيناً ويحدد طبقاً لقرار مدير المستشفى وهو مندوب المستشفى في استلامها من المخازن ولا يجوز لمندوب آخر الاستلام.\n- يجب قيد جميع الأصناف المخدرة الواردة إلى الصيدلية في نفس يوم ورودها وكذا المنصرف منها إلى المستشفى أولاً بأول في يوم صرفها.\n\nإضافة المخدرات بعهدة المستشفى:\nيتم عمل دفتر مخدرات (نموذج 1 مخازن حكومية 112 ع.ح ونموذج 3 مخازن حكومية 118 ع.ح) منفصل عن عهد الصيدلية بالمستشفى ويراعى فيه ما يأتي:\n1- تراجع دفاتر المخدرات الخاصة بالوحدة بمكتب الشطب بحضور صيدلي الوحدة للتأكد من أن جميع الصفحات مرقمة ومسلسلة ولم تسقط أي صفحات بدون ترقيم ويكتب إقرار بذلك داخل غلاف الدفتر ويوقع عليه من كاتب الشطب وصيدلي المستشفى.\n2- يوقع كاتب الشطب بجوار الختم في أعلى الصفحة الأولى والأخيرة بالدفتر.\n3- يخصص لكل صنف صفحة منفصلة بالدفتر 118 يدون بها مواصفات الصنف كاملة (رقم التشغيلة – تاريخ الصلاحية) والاسم وقوة التركيز بالحروف والأرقام كما تترك بين الأصناف صفحات تسمح بتحريك الصنف الواحد في صفحات جديدة متتابعة ويعمل فهرس للدفتر يلصق بداخل الغلاف.\n4- ممنوع الكشط والشطب وأي خطأ في الإضافة أو الخصم يصحح بالحبر الأحمر في سطر منفصل يشار فيه إلى مكان الخطأ.\n5- يعتبر نزع صفحات هذه الدفاتر مخالفة كبرى تخضع لقانون المخدرات المدني.", "6- ويراعى عند إضافة الأصناف في دفتر 112 تسجيل رقم التشغيلة بها وكذلك تاريخ الصلاحية.\n7- لا يسمح بتداول المواد المخدرة إلا صيدلي المستشفى أو الطبيب (النائب الإداري).\n\nصرف المخدرات إلى أقسام المستشفى:\n1. يتم إصدار قرار من مدير المستشفى لأحد النواب الإداريين المعينين لاستلام عهدة المخدرات من الصيدلية.\n2. يتم تسليم الطبيب (النائب الإداري) عهدة المخدرات على إيصال استلام (من أصل في الصيدلية وصورة مع الناب الإداري) موضح به الآتي:\na. اسم الدواء المصروف ومواصفاته.\nb. تاريخ الصلاحية للأ
