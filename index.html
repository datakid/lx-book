const stripFooterNum = (txt, n) => {
let lines = txt.split('\n'); let end = lines.length - 1;
while(end >= 0 && lines[end].trim() === '') end--;
if(end >= 0 && lines[end].trim() === String(n)) { lines.length = end; while(lines.length && lines[lines.length-1].trim() === '') lines.pop(); }
return lines.join('\n');
};
const CPAGES = PAGES.map((t,i) => stripFooterNum(t, i+1));
const PAGE_OVERRIDES = {"83": "<div class=\"fmt-h\">أستخدام الألبيومين البشري في مرضي تليف الكبد</div><div class=\"fmt-p\">استخدام الألبيومين البشري في تليف الكبد ودواعي استعماله تقل تدريجياً بناءً علي توصيات كل جمعيات ومنظمات الكبد العالمية. لا يوجد دور أو داعٍ لاستخدام الألبيومين كعلاج للتليف أو لإصلاح أو رفع مستوي الألبيومين في الجسم مهما كان مستوي الألبيومين وبغض النظر عن قلته.</div><div class=\"fmt-h2\">حالياً يقتصر استخدام حقن الألبيومين علي الحالات التالية فقط</div><div class=\"fmt-p\">المرضي الذين يجري لهم بذل استسقاء بحجم كبير (Large volume paracentesis اكثر من 5 لتر في الجلسة): بجرعة 5 جرام ألبيومين لكل لتر من الاستسقاء يتم بذله، يعطي علي مرة واحدة مع البذل، ولا يكرر إلا بتكرار البذل بحجم كبير.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>التركيز</th><th>حجم الزجاجة</th><th>محتوي الألبيومين</th><th>تكفي عدد لترات من البذل</th></tr></thead><tbody><tr><td>20%</td><td>50ml</td><td>10 gm</td><td>2</td></tr><tr><td>20%</td><td>100ml</td><td>20 gm</td><td>4</td></tr><tr><td>25%</td><td>50ml</td><td>12.5 gm</td><td>2.5</td></tr><tr><td>25%</td><td>100ml</td><td>25 gm</td><td>5</td></tr></tbody></table></div><ol class=\"fmt-ul\"><li>مرضي الالتهاب البريتوني التلقائي (Spontaneous Bacterial Peritonitis - SBP): إذا كانت البيليروبين الإجمالية 4 ملجم أو أكثر أو كان الكرياتينين أعلي من الطبيعي لمنع الإصابة بفشل كلوي-كبدي، ولا يوجد داعٍ لاستعماله في المرضي الذين تقل فيهم البيليروبين عن 4 ملجم والكرياتينين طبيعي. الجرعة: 1.5 جرام لكل كيلوجرام من وزن المريض في أول يوم، ثم تكرر بجرعة 1 ملجم لكل كيلوجرام من وزن المريض في اليوم الثالث.</li><li>في علاج الفشل الكلوي-الكبدي (Hepato-Renal Syndrome): يستخدم فقط في مراكز العلاج المتقدم التي يتوفر فيها إمكانيات زرع كبد، ويستخدم فقط بالإضافة للأدوية المفعّلة للدورة الدموية (جليوبريسين أو خليط أوكتريوتايد-ميدودرين)، ولا يستخدم الألبيومين بمفرده لعدم جدواه. الجرعة: 20-40 جرام ألبيومين يومياً بالإضافة إلي 0.5-2 ملجم جليوبريسين بالوريد كل 4 ساعات.</li></ol><div class=\"fmt-note\">لا يجب استخدام الألبيومين في مرضي تليف الكبد من الكبار الذين لا يجري لهم جراحات إلا في الحالات المحددة أعلاه.</div>", "86": "<div class=\"fmt-h\">بروتوكول العلاج بالهيبارين منخفض الوزن الجزيئي</div><div class=\"fmt-h2\">دواعي الاستخدام</div><ul class=\"fmt-ul\"><li>الوقاية من الجلطات الوريدية العميقة والتي قد تؤدي إلى الانسداد الرئوي: مرضي العمليات الجراحية في البطن، مرضي جراحة استبدال مفصل الورك، الحالات الحادة المقترنة بتقييد شديد للحركة.</li><li>علاج الجلطات الوريدية العميقة الحادة، يعطي مع وارفارين.</li><li>الوقاية من المضاعفات الإقفارية (Ischemic) للذبحة الصدرية غير المستقرة.</li><li>علاج متلازمة الشريان التاجي الحادة المصحوبة بارتفاع فترة الـ ST، يعطي مع الأسبرين. متوسط مدة العلاج: عشرة أيام.</li></ul><div class=\"fmt-h\">الجرعات</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الدواء</th><th>Prophylactic dose</th><th>Therapeutic dose</th></tr></thead><tbody><tr><td>Nadroparin</td><td>(0.3ml) 2,850 anti-Xa IU Once daily</td><td>86 anti-Xa IU per kg body weight / 12 hr</td></tr><tr><td>Enoxaparin</td><td>40 mg SC Once daily</td><td>1 mg / kg / 12 hr</td></tr></tbody></table></div><div class=\"fmt-p\">الوقاية من الجلطات أثناء الغسيل الكلوي: نادروبارين 65 وحدة/كجم من وزن الجسم تحقن في الشريان عند بدء كل جلسة. يستخدم نصف الجرعة في المرضي المعرضين لخطورة النزف.</div>", "95": "<div class=\"fmt-h\">Immunosuppressed Patients</div><ul class=\"fmt-ul\"><li>HBsAg –ve, AntiHBc +ve, HBV PCR +ve should be managed in the same way as HBsAg +ve cases.</li><li>HBsAg –ve, AntiHBc +ve, HBV PCR –ve should be followed-up every 2-3 months. Start oral antiviral if HBV PCR becomes positive.</li></ul><div class=\"fmt-h2\">Which oral antiviral?</div><ul class=\"fmt-ul\"><li>Viral load &lt; 2000 IU/ml and short duration of immunosuppression: use Lamivudine.</li><li>Viral load &ge;2000 IU/ml and long duration or repeated courses of immunosuppression: use Entecavir or Tenofovir.</li></ul><div class=\"fmt-h\">When to stop antiviral therapy?</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Patient</th><th>PegIFN-α therapy</th><th>NA therapy</th></tr></thead><tbody><tr><td>HBeAg (+)</td><td>48 weeks</td><td>Stop treatment 6-12 months after seroconversion</td></tr><tr><td>HBeAg (−)</td><td>IFN not recommended</td><td>Indefinitely, or until HBsAg seroconversion</td></tr></tbody></table></div><div class=\"fmt-h2\">On-treatment monitoring</div><ul class=\"fmt-ul\"><li>Every month: visits to receive medication and monitor for compliance and side effects.</li><li>Every 3 months: check ALT. For patients on Tenofovir and Adefovir, check serum creatinine.</li><li>Every 6 months: check HBV DNA, liver profile, complete blood count, alpha-fetoprotein, abdominal ultrasound.</li></ul><div class=\"fmt-h2\">Monitoring patients who are NOT candidates for therapy</div><ul class=\"fmt-ul\"><li>HBeAg Positive: test ALT, HBeAg, HBV DNA, and HBsAg every 3-6 months.</li><li>HBeAg Negative: test ALT, HBV DNA, HBsAg every 3-6 months.</li></ul>", "106": "<div class=\"fmt-h\">معايير استخدام Deferiprone – Ferriprox</div><div class=\"fmt-p\">يستخدم عقار Deferiprone – Ferriprox لمرضي أنيميا البحر المتوسط لعلاج زيادة الحديد بالجسم وذلك علي النحو التالي:</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Ferriprox Dose</th><th>S. Ferritin Level</th></tr></thead><tbody><tr><td>75 mg / kg / day (TDS)</td><td>1000 – 2500 mg / dl</td></tr><tr><td>100 mg / kg / day (TDS)</td><td>2500 – 4000 mg / dl</td></tr></tbody></table></div><ul class=\"fmt-ul\"><li>مع عمل وظائف الكبد وصورة دم كاملة للمريض شهرياً.</li><li>تحليل مخزون الحديد كل 3-6 شهور.</li></ul>", "117": "<div class=\"fmt-h\">Dosage</div><div class=\"fmt-p\">Adults and children &gt; 30 kg: 1,200,000 international units (900mg), by intramuscular injection every 4 weeks. The recommended dose of BPG for children up to 27-30 kg is 450 mg (600,000 IU) IM every 4 weeks.</div><div class=\"fmt-h2\">Optimum frequency of administration</div><div class=\"fmt-p\">4-weekly injections are effective if good adherence can be assured. The drug can be given more frequently, every 5 weeks, if there is a desire to further increase the efficacy in preventing recurrent ARF.</div><div class=\"fmt-h2\">Standard care</div><div class=\"fmt-p\">Duration of secondary prophylaxis depends on history of carditis and if valvular involvement persists. Minimum duration is 10 years since last ARF episode or until age 21 years, whichever is longer, with prolongation till age 35-40 years in individuals with significant valvular disease.</div><div class=\"fmt-note\">Missing even a single dose of BPG raises the risk of recurrent RF.</div><div class=\"fmt-h\">Duration for secondary prophylaxis for rheumatic fever</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>Type</th><th>Duration after last attack</th></tr></thead><tbody><tr><td>Rheumatic fever without carditis</td><td>5 years or until age 21 years (whichever is longer)</td></tr><tr><td>Rheumatic fever with carditis but no residual heart disease (no valvular disease)</td><td>10 years or until age 21 years (whichever is longer)</td></tr><tr><td>Rheumatic fever with carditis and residual heart disease (persistent valvular disease)</td><td>10 years or until age 40 years (whichever is longer); life time prophylaxis may be needed.</td></tr></tbody></table></div><div class=\"fmt-note\">Stop using BPG for treatment of other infections (e.g. streptococcal pharyngitis) where other effective antibiotics are available.</div>", "1": "<div class=\"fmt-h\">الهيئة العامة للتأمين الصحي</div><div class=\"fmt-h2\">الإدارة المركزية للتموين الطبي والصيدليات</div><div class=\"fmt-h2\">مقدمة</div><div class=\"fmt-p\">تتشرف الإدارة المركزية للتموين الطبي والصيدليات بالهيئة العامة للتأمين الصحي بإعداد قائمة الأدوية الأساسية وإجراءات وبروتوكولات تداولها بالهيئة لعام 2019، حيث صدرت الطبعة الأولى عام 1966 وتوالى صدور الطبعات التالية خلال السنوات الماضية. وتعتبر تلك القائمة مع الدليل مرجعاً يضم جميع البروتوكولات والقرارات والقواعد والتعليمات المنظمة الصادرة من الهيئة، وهو دليل الطبيب والصيدلي المعين والمتعاقد مع التأمين الصحي للتعامل مع الأدوية المصرح بوصفها تنفيذاً لقوانين التأمين الصحي.</div><div class=\"fmt-note\">\" آملين من الله أن يكون نافعاً ومعيناً لهم لأداء خدمة طبية متميزة لصالح منتفعي التأمين الصحي \"</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><tbody><tr><td class=\"vt-num\" style=\"width:120px\">إعداد</td><td>د/ منيرة حسين</td></tr><tr><td class=\"vt-num\">مراجعة</td><td>د/ ليلى السيد على</td></tr><tr><td class=\"vt-num\">يعتمد</td><td>السيدة الدكتورة د/ ناهد عبد الرحيم — رئيس مجلس الإدارة</td></tr></tbody></table></div><div class=\"fmt-h2\">أعضاء الفريق</div><ul class=\"fmt-ul\"><li>د/ حنان العليمي</li><li>د/ سهير عبد الحميد</li><li>د/ أحمد سعودي</li><li>د/ مروة عباس</li><li>د/ مروة حلمي</li><li>د/ رحاب محمد</li><li>ك/ سناء يوسف</li></ul><div class=\"fmt-note\">تاريخ الإصدار: 1 / 1 / 2019</div>", "9": "<div class=\"fmt-p\">يوقع الطبيب باستلام الدفاتر (غير مختومة) من أمين المخزن على السجل المخصص لذلك كما هو موضح بالنموذج التالي:</div><div class=\"fmt-note\">نموذج رقم \"399 ت.ص\"</div><div class=\"fmt-h2\">سجل تسليم التذاكر الطبية — الهيئة العامة للتأمين الصحي / فرع / المنطقة</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>تاريخ التسليم</th><th>أسم الطبيب</th><th>من رقم مسلسل — إلى رقم</th><th>تاريخ الاستلام في المنطقة</th><th>توقيع المستلم</th><th>توقيع الطبيب</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><div class=\"fmt-h2\">تعليمات</div><ul class=\"fmt-ul\"><li>على الطبيب أو مندوبه مراجعة سلامة الدفاتر وصحة البيانات المسجلة بالسجل، خاصة رقم المجموعة والرقم المسلسل المطبوع، وأن نوع الدفاتر والقانون هو الخاص به قبل التوقيع باستلامها.</li><li>على الطبيب أو مندوبه التوجه للموظف المختص بختم الدفاتر (المراجع)، والذي يكون مقره بنفس المبنى المتواجد به المخزن، ليقوم الأخير بختم الدفاتر بختم شعار الجمهورية المخصص لهذا الغرض، مع مراعاة الوضوح التام لبيانات الختم واستخدام ختامات سليمة وحبر مناسب.</li><li>على المراجع إعادة تسجيل بيانات الدفاتر في كارت يخصص لكل طبيب (أو صفحات مستقلة بسجل حرف ز)، وتكون بيانات الكارت: اسم الطبيب ورقم الإخطار الوارد من المنطقة بالتصريح له باستلام دفاتر، ثم جدول يدون به نوع الدفتر والقانون ورقم المجموعة ورقم أول تذكرة وتاريخ الختم وتوقيع الطبيب أو المندوب بما يفيد ختم الدفاتر، وتاريخ ارتجاع الكعب من واقع صورة الاستمارة 111 ع.ح. التي ترد إليه من أمين المخزن بإضافة الكعوب المرتجعة.</li><li>على الطبيب أو مندوبه التحقق من ختم كل التذاكر والتوقيع بما يفيد ذلك على السجل المشار إليه.</li><li>عند انتهاء استخدام الدفاتر ترتجع لنفس أمين المخزن، وعليه التحقق أنها منصرفة من نفس المخزن وأنها لا تحتوي على صور تذاكر مفقودة أو أصول لم تستخدم غير ملغاة. وعلى الطبيب التحقق من تسديد بيانات الارتجاع المشار إليها أعلاه بنفس سجل الاستلام، ويوقع بما يفيد الارتجاع للكعب.</li><li>لا يقوم أمين المخزن بصرف أكثر من دفتر من كل فئة في الدفعة الواحدة (فيما عدا المناطق النائية)، ويقوم الطبيب بالتوقيع في السجل المخصص لذلك.</li></ul>", "31": "<div class=\"fmt-p\">وتقسم الفاتورة إلى الخانات الرأسية التالية:</div><ul class=\"fmt-ul\"><li>مسلسل (رقم المسلسل للتذكرة الموضوع بمعرفة الصيدلية)</li><li>اسم المنتفع أو الطالب أو المولود</li><li>الرقم التأميني للمنتفع أو الطالب أو المولود</li><li>رقم التذكرة المسلسل المطبوع عليها</li><li>تاريخ تحرير التذكرة</li><li>إجمالي قيمة الأدوية</li><li>المبلغ المسدد</li><li>الباقي</li><li>اسم وتخصص الطبيب</li></ul><div class=\"fmt-p\">وفي نهاية الفاتورة يتم جمع الخانات الحسابية رأسياً وتوقيع صاحب الصيدلية وختم الصيدلية، مع مراعاة عدم ترحيل إجمالي الفاتورة وإنما تستقل كل فاتورة بمجموعها لتسهيل إجراء التصويب عند المراجعة.</div><div class=\"fmt-p\">يتم حصر إجمالي المطالبة لتذاكر الممارس/الأخصائي/الاستشاري على نموذج تفريغ للفواتير كالتالي (من أصل وصورتين):</div><div class=\"fmt-h2\">فاتورة إجمالية لتذاكر (الممارس / الأخصائي / الاستشاري) — قانون ( ) — عن الفترة من .......... إلى ..........</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>رقم الفاتورة</th><th colspan=\"2\">الإجمالي</th><th colspan=\"2\">المسدد من المنتفع</th><th colspan=\"2\">الباقي</th></tr><tr><th></th><th>جنيه</th><th>قرش</th><th>جنيه</th><th>قرش</th><th>جنيه</th><th>قرش</th></tr></thead><tbody><tr><td class=\"vt-num\">1</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">2</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">3</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">4</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td class=\"vt-num\">5</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr class=\"fmt-vtable-section\"><td colspan=\"7\">المجموع</td></tr></tbody></table></div><div class=\"fmt-p\" style=\"display:flex;justify-content:space-between\"><span>توقيع صاحب الصيدلية</span><span>ختم الصيدلية</span></div><div class=\"fmt-note\">في حالة وجود فاتورة واحدة فقط، لا داعي لعمل النموذج، مع مراعاة أي تعليمات تفصيلية صادرة عن الفروع بخصوص تحرير المطالبات. مع فصل تذاكر المزمن المجاني للطالب عن تذاكر الأخصائي غير المزمن.</div>", "32": "<div class=\"fmt-p\">ثم عمل كشف مطالبة نهائي من أصل وصورتين على النموذج كالتالي:</div><div class=\"fmt-h2\">اسم الصيدلية / عنوانها / الرقم الكودي / اسم صاحبها — المطلوب من الهيئة العامة للتأمين الصحي فرع .......... عن الفترة من .......... إلى .......... قانون ( )</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>النوع</th><th>عدد التذاكر</th><th>عدد الفواتير</th><th>عدد الدوسيهات</th><th colspan=\"2\">الإجمالي</th><th colspan=\"2\">المسدد</th><th colspan=\"2\">الباقي</th></tr><tr><th></th><th></th><th></th><th></th><th>ج</th><th>ق</th><th>ج</th><th>ق</th><th>ج</th><th>ق</th></tr></thead><tbody><tr><td>ممارس</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>أخصائي</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>إستشاري</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr class=\"fmt-vtable-section\"><td colspan=\"10\">الإجمالي</td></tr></tbody></table></div><div class=\"fmt-note\">فقط مبلغ وقدره: ......................................... لا غير</div><div class=\"fmt-p\">توضع الفواتير والكشوف والمطالبة النهائية في ملف مستقل وتسلم المطالبة للفرع المختص، ويكرر ما سبق لكل قانون، حيث يسلم لكل قانون على حدة:</div><ul class=\"fmt-ul\"><li>ملف أو أكثر به تذاكر الممارس.</li><li>ملف أو أكثر به تذاكر الأخصائي وتكرار علاج الأخصائي.</li><li>ملف أو أكثر به تذاكر الاستشاري وتكرار علاج الاستشاري.</li><li>ملف واحد أو أكثر به كشوف التفريغ والفواتير والمطالبة النهائية.</li></ul><div class=\"fmt-p\">يتم التسليم في المواعيد المحددة لكل صيدلية وحتى خمسة أيام على الأكثر:</div><ul class=\"fmt-ul\"><li>يوم 1 من كل شهر للدفعة (أ)</li><li>يوم 10 من كل شهر للدفعة (ب)</li><li>يوم 20 من كل شهر للدفعة (ج)</li><li>أو أي مواعيد أخرى يحددها الفرع المختص</li></ul><div class=\"fmt-p\">ويتم التسليم للموظف المختص بالهيئة، مقابل التوقيع على صورة المطالبة النهائية بالاستلام تحت المراجعة، وتحتفظ الصيدلية بهذه الصورة، بالإضافة لصورة من الفواتير والكشوف السابقة حتى ورود الشيك.</div><div class=\"fmt-note\">وعلى الصيدلية المتعاقدة المطالبة شهرياً عند تسليم المطالبات ببيانات المخالفات عن المطالبات السابقة لمعرفة الأخطاء وتفاديها حتى لا تتكرر.</div>", "38": "<div class=\"fmt-h\">آلية التعامل مع اللجنة العليا للدواء</div><ul class=\"fmt-ul\"><li>الالتزام بالبروتوكولات السابق إرسالها وعدم كتابة أدوية غير مسجلة وغير مسعّرة بوزارة الصحة.</li><li>لا بد من إرسال طلبات الأدوية إلى اللجنة العليا مباشرةً وليس عن طريق المريض، على أن تكون مستوفاة لجميع الفحوصات ومدونة بالحاسب الآلي وليست بخط اليد، ومرفق بها صورة من بطاقة الرقم القومي وصورة البطاقة العلاجية.</li><li>لن يُلتفت إلى أي تقرير صادر من اللجنة الثلاثية بالفرع غير مستوفٍ لتاريخ العرض على اللجنة وتوقيع وأختام أعضاء اللجنة والمقرر.</li><li>عند إرسال طلبات الأدوية يجب أن يكون اسم المريض رباعياً ومطابقاً للاسم المذكور على صورة بطاقة الرقم القومي للمريض (ولن يُلتفت إلى الطلبات غير المستوفاة لهذا الشرط).</li><li>التقارير المرسلة يجب أن تشتمل على العلاج المطلوب بالجرعة المحددة والتاريخ المرضي وخطوط العلاج السابقة ومدى الاستجابة لها.</li><li>يقوم التموين الطبي بالفرع بفتح سجل لتسجيل الموافقات الخاصة باللجنة العليا للدواء، مع الاحتفاظ بصورة منها وتسليم الأصل لمدير الصيدلية بالعيادة وصورة للمريض بعد ختمهما بختم التموين الطبي بالفرع.</li><li>عند تحويل المريض إلى خط علاجي آخر مختلف عن قرار اللجنة العليا، يتم إصدار تقرير جديد من اللجنة الثلاثية بإيقاف قرار اللجنة، ويتم إخطار اللجنة العليا بذلك والأسباب.</li><li>في حالات الموافقة على التكرار عن طريق الفرع، يكون التكرار بمعرفة نفس لجنة الأورام بالفرع التي عرض عليها المريض عند رفع الطلب إلى اللجنة العليا، وليس الاستشاري أو لجنة أخرى.</li><li>في حالات التكرار يجب إرسال فحوصات حديثة للتقييم مرفق بها مقارنة للحالة قبل وبعد العلاج، مع ضرورة إرفاق بيان بعدد الموافقات السابقة وتواريخها وعدد الجرعات المستخدمة فعلياً عند التكرار من اللجنة العليا.</li><li>يقوم الطبيب المسئول بتحرير تذكرة طبية للمريض ويرفق بها صورة من قرار اللجنة.</li><li>يقوم مدير الصيدلية بعمل ملف لحفظ قرارات اللجنة ووضع أرقام مسلسلة لها من الأقدم إلى الأحدث بداية كل سنة مالية (مع الاحتفاظ بالقرارات المستمر تنفيذها في السنة الجديدة).</li></ul><div class=\"fmt-p\">يتم فتح دفتر (حرف ز) بالأدوية الخاصة بقرارات اللجنة على النموذج التالي — اسم الصنف: ..........</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>اسم المريض</th><th>تاريخ القرار ورقمه</th><th>عدد الجرعات أو الشهور</th><th>الجرعة الأولى</th><th>الجرعة الثانية</th><th>الجرعة الثالثة</th><th>...إلخ</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div>", "15": "<div class=\"fmt-h\">وصف الدواء</div><div class=\"fmt-p\">يقتصر وصف الأدوية المدرجة بدليل أدوية الهيئة نوعاً وعدداً وكماً تبعاً للقواعد المنظمة لصرف الأدوية كالآتي:</div><ol class=\"fmt-ul\"><li>أصناف توصف بمعرفة الطبيب الممارس والأخصائي والاستشاري، ويرمز بجانبها بالرمز Gp.</li><li>أصناف توصف بمعرفة الطبيب الأخصائي والاستشاري ويرمز بجانبها بالرمز Sp.</li><li>أصناف توصف بمعرفة الطبيب الاستشاري فقط ويرمز بجانبها بالرمز Con.</li></ol><div class=\"fmt-h2\">سلطة الوصف — الممارس (الرمز Gp.)</div><div class=\"fmt-p\">يلتزم بوصف الأدوية المحددة للممارس فقط.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الفئة</th><th>الحد الأقصى</th></tr></thead><tbody><tr><td class=\"vt-num\">نوعاً</td><td>بحد أقصى في الزيارة الواحدة بما يكفي علاج أربعة أيام طبقاً للجرعة اليومية التي يحددها الطبيب. في حالة الربو الشعبي وضغط الدم يحق له كتابة ما يكفي علاج أسبوع. وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام.</td></tr><tr><td class=\"vt-num\">عدداً</td><td>بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة.</td></tr></tbody></table></div><div class=\"fmt-h2\">سلطة الوصف — الأخصائي (الرمز Sp.)</div><div class=\"fmt-p\">يلتزم بوصف الأدوية المحددة للأخصائي بالإضافة للأدوية المحددة للممارس.</div><div class=\"fmt-vtable-wrap\"><table class=\"fmt-vtable\"><thead><tr><th>الفئة</th><th>الحد الأقصى</th></tr></thead><tbody><tr><td class=\"vt-num\">نوعاً / كماً</td><td>بحد أقصى في الزيارة الواحدة بما يكفي علاج أسبوع طبقاً للجرعة اليومية التي يحددها الطبيب، حتى ولو أدى ذلك لوصف أكثر من عبوة. وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام. أما في حالة الأمراض المزمنة المستقرة علاجياً فيمكن للأخصائي وصف علاج في الزيارة الواحدة لمدة حدها الأقصى شهرين طبقاً لمدى استقرار الحالة.</td></tr><tr><td class=\"vt-num\">عدداً</td><td>بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة للكبار والمواليد والطلبة. أما إذا كان التشخيص لأكثر من مرض مزمن فيمكن لأخصائي واحد أو أكثر وصف لغاية ستة أصناف في الزيارة الواحدة (مع مراعاة أن للكبار جدول للأمراض المزمنة وللطلبة جدول آخر).</td></tr></tbody></table></div><div class=\"fmt-h2\">سلطة الوصف — الاستشاري (الرمز Con.)</div><div class=\"fmt-p\">وله الحق في وصف جميع الأدوية المدرجة بالدليل ولا يجوز له الخروج عنها إلا في الحالات الحرجة التي ترفق بها التحاليل الطبية وبموافقة اللجنة العليا للدواء (على ألا يكون من مجموعة الفيتامينات أو الأدوية التي تحتوي على حبوب اللقاح أو غذاء ملكات النحل)، وأن يكون مسجلاً بوزارة الصحة ومدوناً بالعبوة ذلك وأن يكون مسعّراً جبرياً. كماً وعدداً مثل الأخصائي.</div><div class=\"fmt-h2\">أطباء الأسنان</div><div class=\"fmt-p\">يصرح لهم بوصف أدوية الممارس فقط، فيما عدا الحاصلين على دبلوم أو ماجستير تخصص علي الأقل ويعاملون بهذه الصفة بالهيئة، فيجوز لهم وصف أدوية الأخصائي، ويحددهم مدير الشئون الطبية المختص بكل فرع.</div>", "17": "<div class=\"fmt-h\">الأمراض المزمنة</div><div class=\"fmt-p\">بالنسبة للمنتفعين بقانون 79 والتي يشار إليها إجمالاً بالكبار، وهو ما جاء بالمادة الثالثة من قرار رئيس مجلس الإدارة رقم 1966 لسنة 2001. والأمراض المزمنة بقرار وزير الصحة رقم 321 لسنة 1992 وتعديلاته بالنسبة للطلبة، والتي استقرت علاجياً.</div><div class=\"fmt-h2\">أولاً: قوائم الأمراض المزمنة المحددة بالنسبة للمنتفعين بقانون رقم 79 — اسم المرض</div><ol class=\"fmt-ul\"><li>الأمراض الخبيثة بجميع أجزاء الجسم</li><li>الدرن بأنواعه</li><li>أمراض الدم المزمنة<ul class=\"fmt-ul\"><li>مرض تزايد كرات الدم الحمراء</li><li>اللوكيميا</li><li>الأنيميا المزمنة</li><li>الأنيميا الخبيثة</li><li>نقص صفائح الدم</li><li>الهيموفيليا</li></ul></li><li>أمراض الجهاز الدوري والقلب ومضاعفاتها<ul class=\"fmt-ul\"><li>ارتفاع ضغط الدم المزمن</li><li>أمراض القلب المزمنة ومضاعفاتها وأمراض القلب الخلقية ومضاعفاتها</li><li>أمراض الشرايين التاجية ومضاعفاتها</li><li>التهاب وانسداد الأوعية الدموية ومضاعفاتها</li><li>مرض رينودز</li><li>مرض بيرجر</li></ul></li><li>أمراض الجهاز الهضمي<ul class=\"fmt-ul\"><li>تمدد أوردة المريء ومضاعفاتها</li><li>قرحة المعدة والاثني عشر</li><li>الالتهاب البريتوني المزمن</li><li>تضخم الطحال المصحوب بمضاعفات خطيرة</li><li>أمراض الكبد المصحوبة باختلال وظائف الكبد</li><li>اليرقان بأنواعه</li><li>التهاب البنكرياس المزمن</li><li>التهاب القولون المتقرح</li></ul></li><li>أمراض الجهاز البولي والتناسلي<ul class=\"fmt-ul\"><li>الالتهاب الكلوي المزمن</li><li>هبوط كفاءة الكليتين</li><li>النزيف الرحمي المزمن</li></ul></li><li>أمراض الجهاز الحركي والجهاز الضام المزمنة<ul class=\"fmt-ul\"><li>مرض روماتويد والأمراض المماثلة</li><li>مرض الحمى الروماتزمية</li><li>مرض تآكل الفقرات</li><li>تيبس مفاصل العمود الفقري</li><li>أمراض ضمور العضلات</li><li>الانزلاق الغضروفي المزمن</li><li>التهاب العظام المزمن</li></ul></li></ol><div class=\"fmt-h2\">Name of Diseases</div><ol class=\"fmt-ul\"><li>All Types Of Malignant Diseases</li><li>Pulmonary &amp; Extra Pulmonary T.B.</li><li>Chronic Blood Diseases<ul class=\"fmt-ul\"><li>Polycythaemia</li><li>Leukemia</li><li>Chronic Anemia</li><li>Pernicious Anemia</li><li>Thrombocytopenia</li><li>Hemophilia</li></ul></li><li>Cardiac &amp; Vascular Diseases<ul class=\"fmt-ul\"><li>Hypertension</li><li>Cardiac Diseases</li><li>Coronary Artery Diseases</li><li>Peripheral Vascular Diseases</li><li>Raynaud's Disease</li><li>Buerger's Disease</li></ul></li><li>Gastro-Intestinal Diseases<ul class=\"fmt-ul\"><li>Esophageal Varices and Its Complications</li><li>Peptic &amp; Duodenal Ulcer</li><li>Chronic Peritonitis</li><li>Splenomegaly</li><li>Chronic Liver Diseases</li><li>Jaundice</li><li>Chronic Relapsing Pancreatitis</li><li>Ulcerative Colitis</li></ul></li><li>Chronic Urogenital Diseases<ul class=\"fmt-ul\"><li>Chronic Nephritis</li><li>Renal Failure</li><li>Chronic Uterine Bleeding</li></ul></li><li>Skeletal Diseases<ul class=\"fmt-ul\"><li>Rheumatoid &amp; Like Diseases</li><li>Rheumatic Fever</li><li>Spondylitis</li><li>Ankylosing Spondylosis</li><li>Myopathies</li><li>Chronic Disc Prolapse</li><li>Chronic Osteomyelitis</li></ul></li></ol>", "18": "<div class=\"fmt-h2\">Name of Diseases (تابع)</div><ol class=\"fmt-ul\" start=\"8\"><li>Chronic Neurological Diseases<ul class=\"fmt-ul\"><li>Epilepsy</li><li>Organic Paralysis</li><li>Chronic Neurological Organic Diseases</li><li>Chronic Psychiatric &amp; Mental Diseases</li></ul></li><li>Chronic Respiratory Diseases<ul class=\"fmt-ul\"><li>Bronchiectasis</li><li>Cystic Lung Diseases</li><li>Pleural Effusions</li><li>Emphysema</li></ul></li><li>Endocrine, Lymph &amp; Metabolic Diseases<ul class=\"fmt-ul\"><li>Chronic Sexual Organic Diseases</li><li>Thyrotoxicosis</li><li>Myxedema</li><li>Diabetes Mellitus &amp; Its Complications</li><li>Chronic Pituitary Diseases</li><li>Chronic Parathyroid Diseases</li><li>Lupus Erythematosus</li><li>Gout</li><li>Hodgkin's Disease</li><li>Elephantiasis</li><li>Lymphadenopathy</li><li>Chronic Supra-Renal Diseases</li></ul></li><li>Chronic Skin Disease<ul class=\"fmt-ul\"><li>Chronic Eczema</li><li>Chronic Neuro-Dermatitis</li><li>Psoriasis</li><li>Lichen Planus</li><li>Pemphigus</li><li>Vitiligo</li><li>T.B. Skin</li><li>Systemic Sclerosis, Mycosis Fungoides</li><li>Behcet's Disease</li></ul></li><li>Chronic Eye Diseases<ul class=\"fmt-ul\"><li>Chronic Myopic Degenerative Diseases</li><li>Retinal Detachment</li><li>Chronic Iridocyclitis</li><li>Chronic Glaucoma</li><li>Chronic Optic Neuritis Diseases</li><li>Diabetic Retinopathy</li></ul></li><li>Leprosy</li></ol><div class=\"fmt-h2\">أسم المرض (تابع)</div><ol class=\"fmt-ul\" start=\"8\"><li>أمراض الجهاز العصبي المزمنة<ul class=\"fmt-ul\"><li>الصرع بأنواعه</li><li>الشلل العضوي</li><li>أمراض الجهاز العصبي العضوية المزمنة</li><li>الأمراض النفسية والعقلية المزمنة</li></ul></li><li>أمراض الجهاز التنفسي المزمنة<ul class=\"fmt-ul\"><li>تمدد الشعب الهوائية</li><li>تكيسات الرئة</li><li>الانسكابات البلورية بأنواعها</li><li>الأمفيزيما</li></ul></li><li>أمراض الغدد الصماء والتمثيل الغذائي والجهاز الليمفاوي<ul class=\"fmt-ul\"><li>أمراض الغدد الجنسية فيما عدا العقم (فيرجع للبروتوكول المنظم لعلاجه)</li><li>التسمم الدرقي</li><li>هبوط نشاط الغدة الدرقية</li><li>مرض السكر ومضاعفاته</li><li>أمراض الغدة النخامية</li><li>أمراض الغدد جارات الدرقية</li><li>مرض القناع الأحمر المنتشر</li><li>مرض النقرس</li><li>مرض هودجكين</li><li>داء الفيل</li><li>تضخم الغدد الليمفاوية لأسباب مزمنة</li><li>أمراض غدد فوق الكلى</li></ul></li><li>الأمراض الجلدية المزمنة<ul class=\"fmt-ul\"><li>الإكزيما المزمنة</li><li>الإكزيما العصبية</li><li>الصدفية</li><li>مرض الحزاز البسيط (البنفسج)</li><li>مرض داء الفقاع</li><li>البهاق</li><li>الدرن الجلدي</li><li>سكليروديرما</li><li>مرض بهجت</li></ul></li><li>أمراض العيون المزمنة<ul class=\"fmt-ul\"><li>أمراض تحلل الشبكية المزمنة</li><li>انفصال الشبكية</li><li>الالتهاب القزحي المزمن</li><li>الجلوكوما المزمنة</li><li>أمراض العصب البصري المزمنة</li><li>التهاب الشبكية في مرض السكر</li></ul></li><li>الجذام</li></ol>", "19": "<div class=\"fmt-h2\">ثانياً: قائمة الأمراض المزمنة الخاصة بالطالب المنوه عنها بقرار وزير الصحة رقم 321 لسنة 1992 — اسم المرض</div><ol class=\"fmt-ul\"><li>الأورام الخبيثة بجميع أنواعها ومضاعفاتها بأي من أجزاء الجسم إذا ثبت تشخيصها بصفة قاطعة</li><li>الأمراض الدرنية بأنواعها</li><li>الأمراض العقلية العضوية المزمنة بعد ثبوتها بصفة قاطعة</li><li>أمراض الدم المزمنة<ul class=\"fmt-ul\"><li>الأنيميا الوراثية: أنيميا البحر المتوسط، الأنيميا المنجلية، الأنيميا التكورية، أنيميا الفول</li><li>اللوكيميا</li><li>الأنيميا الخبيثة</li><li>الأنيميا الضمورية</li><li>نقص كرات الدم البيضاء الدوري</li><li>أمراض النزيف الوراثية: الهيموفيليا (أ، ب، ج)، العيوب الوظيفية بالصفائح الدموية</li><li>سرطان الدم: اللوكيميا الحادة، اللوكيميا المزمنة</li><li>سرطان الغدد الليمفاوية: الهودجكن، الغير هودجكن</li></ul></li><li>أمراض القلب والأوعية الدموية ومضاعفاتها<ul class=\"fmt-ul\"><li>ارتفاع ضغط الدم المزمن</li><li>أمراض القلب المزمنة وتشمل: أمراض صمامات القلب الروماتزمية، العيوب الخلقية بالقلب، اختلال ضربات القلب المزمن</li><li>أمراض عضلة القلب التحللية (الأولية والثانوية)</li><li>هبوط البطين الأيمن للقلب الناتج من الأمراض المزمنة بالرئتين أو تشوهات القفص الصدري</li></ul></li><li>أمراض الجهاز الهضمي وتشمل<ul class=\"fmt-ul\"><li>مضاعفات تمدد أوردة المريء</li><li>الالتهاب البريتوني المزمن لأسباب مختلفة</li><li>الاستسقاء بأنواعه</li><li>تضخم الطحال المصحوب بمضاعفات خطيرة</li><li>أمراض الكبد المزمنة المصحوبة باختلال وظائف الكبد</li><li>التهاب القولون المتقرح</li><li>التضخم الخلقي للقولون</li><li>ضيق المريء الخلقي والمكتسب</li></ul></li></ol><div class=\"fmt-h2\">Name of Diseases</div><ol class=\"fmt-ul\"><li>All types of Malignant diseases &amp; its complications</li><li>All types of tuberculosis</li><li>Chronic Organic mental diseases</li><li>Chronic haematological Diseases<ul class=\"fmt-ul\"><li>Hereditary anaemia: Thalassemia, Sickle cell anaemia, Spherocytic anaemia, Glucose-6-phosphate dehydrogenase deficiency (G6PDD) (Favism)</li><li>Leukaemia</li><li>Pernicious anaemia</li><li>Aplastic pancytopenia</li><li>Cyclic neutropenia</li><li>Coagulation disorders: Hemophilia A,B,C, Thrombocytopenia</li><li>Malignant blood diseases: Acute leukemia, Chronic leukemia</li><li>Malignant lymphomas: Hodgkin lymphomas, Non-Hodgkin lymphomas</li></ul></li><li>Cardiovascular diseases &amp; its complications<ul class=\"fmt-ul\"><li>Chronic hypertension</li><li>Chronic heart diseases: Rheumatic valvular diseases, Congenital heart diseases, Chronic arrhythmia</li><li>Cardiomyopathy</li><li>Congestive heart failure due to chronic lung diseases or abnormalities in the thoracic cage</li></ul></li><li>Gastro-Intestinal Diseases<ul class=\"fmt-ul\"><li>Complications of esophygeal varices</li><li>Chronic Peritonitis of different causes</li><li>All types of ascites</li><li>Splenomegaly &amp; its complications</li><li>Chronic Hepatic diseases with disturbance of liver functions</li><li>Ulcerative colitis</li><li>Congenital megacolon</li><li>Congenital &amp; acquired esophageal stenosis</li></ul></li></ol>", "20": "<div class=\"fmt-h2\">اسم المرض (تابع)</div><ol class=\"fmt-ul\" start=\"7\"><li>أمراض الجهاز البولي وتشمل<ul class=\"fmt-ul\"><li>التهاب الكلى وحوض الكلى</li><li>هبوط كفاءة الكليتين المزمن لأقل من 50% عن الطبيعي</li><li>المثانة العصبية</li></ul></li><li>أمراض الجهاز الحركي والجهاز الضام المزمنة وتشمل<ul class=\"fmt-ul\"><li>مجموعة الأمراض الروماتزمية المزمنة</li><li>تيبس مفاصل العمود الفقري المصحوبة بتغييرات عصبية شديدة</li><li>نخر العظام</li><li>تشوهات الجهاز الحركي والعمود الفقري</li><li>أمراض العضلات الوراثية والخلقية</li></ul></li><li>أمراض الجهاز العصبي المزمنة وتشمل<ul class=\"fmt-ul\"><li>أورام المخ</li><li>الصرع بأنواعه</li><li>الشلل العضوي بالأطراف</li></ul></li><li>أمراض الجهاز التنفسي المزمنة<ul class=\"fmt-ul\"><li>تمدد الشعب الهوائية المصحوبة بمضاعفات</li><li>تكيسات الرئة</li><li>الخراج الرئوي إلى أن يشفى</li><li>الأمفيزيما</li><li>الانسكاب البلوري بجميع أنواعه إلى أن يشفى</li><li>الربو الشعبي (مضافة بقرار وزير الصحة رقم 89 لسنة 96)</li></ul></li><li>أمراض الغدد الصماء والتمثيل الغذائي<ul class=\"fmt-ul\"><li>أمراض الغدد الصماء المزمنة</li><li>أمراض البول السكري ومضاعفاته</li><li>داء الفيل</li><li>أمراض التمثيل الغذائي</li><li>البهاق (مضافة بقرار وزير الصحة رقم 89 لسنة 96)</li></ul></li><li>الأمراض الجلدية المزمنة<ul class=\"fmt-ul\"><li>الإكزيما المزمنة المنتشرة لأسباب مختلفة</li><li>مرض الحزاز البسيط (البنفسج)</li><li>الصدفية</li><li>مرض البمفيجوس (داء الفقاعات)</li></ul></li><li>أمراض العيون المزمنة<ul class=\"fmt-ul\"><li>كاتاركت إلى أن يشفى</li><li>أمراض تحلل الشبكية المزمنة (قصر النظر)</li><li>انفصال الشبكية إلى أن يشفى</li><li>الالتهاب القزحي أو الهدبي أو المشيمي المزمن</li><li>الجلوكوما المزمنة</li><li>أمراض العصب البصري المزمن</li><li>التهاب أو تورم العصب البصري</li><li>القرح المزمنة بالقرنية إلى أن تشفى</li><li>التهاب الشبكية والارتشاحات والأنزفة الداخلية</li><li>الضمور الشبكي التلوني</li></ul></li><li>الجذام</li><li>الإصابات الشديدة ومضاعفات العمليات الجراحية التي تتطلب علاجاً طويلاً خارج المستشفى (أكثر من شهر) إلى أن يشفى</li><li>الحميات الشديدة المصحوبة بمضاعفات إلى أن يشفى</li></ol><div class=\"fmt-h2\">Name of Diseases (Continued)</div><ol class=\"fmt-ul\" start=\"7\"><li>Urological Diseases<ul class=\"fmt-ul\"><li>Chronic glomerulonephritis &amp; pyelonephritis</li><li>Reduction of kidney function to less than 50% of normal</li><li>Neurogenic bladder</li></ul></li><li>Chronic diseases of locomotor system and connective tissue<ul class=\"fmt-ul\"><li>Chronic rheumatic diseases (collagen-vascular diseases)</li><li>Stiffness of the spine with neurological changes</li><li>Bone necrosis, chronic osteomyelitis</li><li>Abnormalities of the spine &amp; locomotor system</li><li>Hereditary &amp; congenital myopathies</li></ul></li><li>Chronic Neurological Diseases<ul class=\"fmt-ul\"><li>Brain tumors</li><li>All types of epilepsy</li><li>Organic neuropathy</li></ul></li><li>Chronic chest Diseases<ul class=\"fmt-ul\"><li>Complicated bronchiectasis</li><li>Lung cysts</li><li>Lung abscess till cure</li><li>Emphysema</li><li>All types of pleural effusions till cure</li><li>Bronchial asthma</li></ul></li><li>Endocrine &amp; metabolic Diseases<ul class=\"fmt-ul\"><li>Chronic endocrine diseases</li><li>Diabetes mellitus &amp; its complications</li><li>Elephantiasis</li><li>Metabolic diseases</li><li>Leukoderma</li></ul></li><li>Chronic Skin Diseases<ul class=\"fmt-ul\"><li>Different types of generalized eczema</li><li>Lichen planus</li><li>Psoriasis</li><li>Pemphigus</li></ul></li><li>Chronic Ophthalmic Diseases<ul class=\"fmt-ul\"><li>Cataract till cure</li><li>Chronic progressive Myopia</li><li>Retinal detachment till cure</li><li>Iritis, Iridocyclitis, ophthalmitis</li><li>Chronic Glaucoma</li><li>Chronic Optic nerve disease</li><li>Optic neuritis &amp; edema</li><li>Chronic corneal ulcers till cure</li><li>Retinitis &amp; retinal hemorrhage</li><li>Retinitis pigmentosa</li></ul></li><li>Leprosy</li><li>Severe complicated trauma or surgical operations that need long treatment (more than one month) till cure</li><li>Prolonged severe fevers associated with complications till cure</li></ol>", "35": "<div class=\"fmt-note\">هذا الجدول (الجزاءات المطبقة على الصيدليات المتعاقدة) ورد في المصدر ممزوجاً عبر أعمدة متعددة (المخالفة، وجزاءات المرة الأولى والثانية والثالثة) بترتيب لا let k = j;
while(k < out.length && out[k].kind === 'H2' && !out[k].ord) k++;
if(k - j >= 3) for(let m = j; m < k; m++) out[m].kind = 'P';
j = k;
} else j++;
}
return out;
}
function decorate(t) {
return esc(t).replace(/([a-zA-Z0-9\-\.\+\_\/]{2,})/g, '<span class="en-text">$1</span>');
}
function formatText(txt, q='') {
let blocks = classifyPage(txt);
let out = '', inList = false, inCard = false;
const closeList = () => { if(inList) { out += '</ul>'; inList = false; } };
const closeCard = () => { if(inCard) { out += '</div></div>'; inCard = false; } };
blocks.forEach(b => {
let { kind, text } = b;
if(kind === 'LI') {
closeCard();
if(!inList) { out += '<ul class="fmt-ul">'; inList = true; }
let stripped = text.replace(LIST_RE, '');
out += `<li>${hl(decorate(stripped), q)}</li>`;
} else if(kind === 'CARD_START') {
closeList(); closeCard();
out += `<div class="fmt-card"><div class="fmt-card-num">${esc(st.l==='ar'?arN(text):text)}</div><div class="fmt-card-body">`;
inCard = true;
} else if(kind === 'CARD_FIELD') {
closeList();
if(!inCard) { out += `<div class="fmt-card"><div class="fmt-card-num">·</div><div class="fmt-card-body">`; inCard = true; }
out += `<div class="fmt-card-line">${hl(decorate(text), q)}</div>`;
} else {
closeList(); closeCard();
if(kind === 'H1') out += `<div class="fmt-h">${hl(decorate(text), q)}</div>`;
else if(kind === 'H2') out += `<div class="fmt-h2">${hl(decorate(text), q)}</div>`;
else out += `<div class="fmt-p">${hl(decorate(text), q)}</div>`;
}
});
closeList(); closeCard();
return out;
}
function getCh(p) { let c=null; for(let i=0;i<CHAPTERS.length;i++){ if(CHAPTERS[i].page<=p) c=CHAPTERS[i]; else break; } return c; }
function rPage(p, dir=0, q='') {
if(!PAGES.length) { eId('pgCt').innerHTML=`<div class="no-res">${UIDict[st.l].nores}</div>`; return; }
p = Math.max(1, Math.min(p, tot)); st.p = p; sv(); setHash(p);
let r = st.l === 'ar';
let outC = dir > 0 ? (r?'sl-out-r':'sl-out-l') : (dir < 0 ? (r?'sl-out-l':'sl-out-r') : 'animating');
let inC = dir > 0 ? (r?'sl-in-l':'sl-in-r') : (dir < 0 ? (r?'sl-in-r':'sl-in-l') : 'animating');
const wrp = eId('pgWrap'); wrp.className = `page ${outC}`;
setTimeout(() => {
const c = CPAGES[p-1], ch = getCh(p);
eId('pgBd').textContent = `${st.l==='en'?'Page':'صفحة'} ${arN(p)}`;
eId('pgCh').textContent = ch ? ch.title : '';
let wc = c.trim().split(/\s+/).length; let rt = Math.ceil(wc/200);
eId('pgMeta').innerHTML = `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>${arN(rt)} ${UIDict[st.l].read}</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>${arN(wc)} ${UIDict[st.l].wrd}</span>`;
eId('mIndInp').value = arN(p); eId('mTot').textContent = `/ ${arN(tot)}`;
eId('pgCt').innerHTML = (!q && PAGE_OVERRIDES[p]) ? PAGE_OVERRIDES[p] : formatText(c, q);
eId('pTop').style.width = `${((p-1)/(tot-1||1))*100}%`;
eId('mPrev').disabled = eId('fPrev').disabled = p<=1;
eId('mNext').disabled = eId('fNext').disabled = p>=tot;
eId('rArea').scrollTo(0,0);
qAll('.c-item').forEach(e=>e.classList.remove('active'));
if(ch) { const el = document.querySelector(`[data-c="${CHAPTERS.indexOf(ch)}"]`); if(el) { el.classList.add('active'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
eId('bPgBm').classList.toggle('active', st.bm.includes(st.p));
wrp.className = `page ${inC}`; requestAnimationFrame(() => wrp.className = 'page');
}, 150);
}
function bldNav() {
const nl = eId('nList'); nl.innerHTML = ''; if(!CHAPTERS.length) return;
CHAPTERS.forEach((c,i)=>{
const b = document.createElement('button'); b.className='c-item'; b.setAttribute('data-c',i);
b.innerHTML = `<span>${esc(c.title)}</span><span class="c-num">${arN(c.page)}</span>`;
b.onclick = () => { if(window.innerWidth<=768) togSb(false); rPage(c.page, c.page>st.p?1:-1); };
nl.appendChild(b);
});
}
eId('fPrev').onclick=eId('mPrev').onclick = () => rPage(st.p-1, -1);
eId('fNext').onclick=eId('mNext').onclick = () => rPage(st.p+1, 1);
const mIndInp = eId('mIndInp');
mIndInp.onfocus = () => { mIndInp.value = st.p; mIndInp.select(); };
const handleJump = () => { let v=parseInt(mIndInp.value.replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))); if(!isNaN(v)) rPage(v, v>st.p?1:(v<st.p?-1:0)); else mIndInp.value=arN(st.p); };
mIndInp.onblur = handleJump;
mIndInp.onkeydown = e => { if(e.key==='Enter') { handleJump(); mIndInp.blur(); } if(e.key==='Escape') mIndInp.blur(); };

eId('bMenu').onclick = e => { e.stopPropagation(); togSb(); };
let setO = false;
eId('bSet').onclick = e => { setO=!setO; eId('pSet').classList.toggle('show',setO); e.currentTarget.classList.toggle('active',setO); e.stopPropagation(); };
document.onclick = e => { if(setO && !e.target.closest('#pSet') && !e.target.closest('#bSet')) { setO=false; eId('pSet').classList.remove('show'); eId('bSet').classList.remove('active'); } if(window.innerWidth<=768 && sbO && !e.target.closest('#sb') && !e.target.closest('#bMenu')) togSb(false); };
function apT(t){ document.documentElement.setAttribute('data-theme',t); qAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===t)); st.t=t; sv(); }
qAll('[data-t]').forEach(b=>b.onclick=()=>apT(b.dataset.t));
function apF(){ const r = document.documentElement.style; r.setProperty('--f-mult', st.fm); r.setProperty('--lh-mult', st.lm); r.setProperty('--ff-main', st.ff==='serif'?"'Amiri',serif":"'Cairo',sans-serif"); r.setProperty('--align', st.al); qAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===st.ff)); qAll('[data-a]').forEach(b=>b.classList.toggle('active',b.dataset.a===st.al)); }
eId('fInc').onclick=()=>{if(st.fm<1.8){st.fm+=0.1;sv();apF();}}; eId('fDec').onclick=()=>{if(st.fm>0.8){st.fm-=0.1;sv();apF();}}; eId('lInc').onclick=()=>{if(st.lm<3){st.lm+=0.2;sv();apF();}}; eId('lDec').onclick=()=>{if(st.lm>1.4){st.lm-=0.2;sv();apF();}};
qAll('[data-f]').forEach(b=>b.onclick=()=>{st.ff=b.dataset.f;sv();apF();}); qAll('[data-a]').forEach(b=>b.onclick=()=>{st.al=b.dataset.a;sv();apF();});
function togLang(){ st.l=st.l==='ar'?'en':'ar'; sv(); apL(); bldNav(); rPage(st.p); }
eId('bLang').onclick = togLang;
function apL(){ document.documentElement.lang = st.l; document.documentElement.dir = st.l === 'ar' ? 'rtl' : 'ltr'; qAll('[data-i18n]').forEach(e => { e.textContent = UIDict[st.l][e.dataset.i18n] || e.textContent; }); eId('cmdInp').placeholder = UIDict[st.l].cmdpl; }
async function cpyP(){ if(!CPAGES[st.p-1]) return; try{ await navigator.clipboard.writeText(CPAGES[st.p-1]); showTst(UIDict[st.l].cop); }catch(e){} }
eId('bPgCpy').onclick = cpyP;
eId('bPgBm').onclick = () => { if(!PAGES.length) return; let i=st.bm.indexOf(st.p); if(i>-1)st.bm.splice(i,1); else st.bm.push(st.p); sv(); eId('bPgBm').classList.toggle('active',st.bm.includes(st.p)); };
eId('bPgShr').onclick = async () => { try { await navigator.clipboard.writeText(location.origin+location.pathname+`#p=${st.p}`); showTst(UIDict[st.l].cpl); }catch(e){} };
let spk=null;
eId('bSpk').onclick = () => { if(!CPAGES[st.p-1]) return; if(speechSynthesis.speaking){speechSynthesis.cancel();eId('bSpk').classList.remove('active');return;} spk=new SpeechSynthesisUtterance(CPAGES[st.p-1]); spk.lang=st.l==='ar'?'ar-SA':'en-US'; spk.onend=()=>eId('bSpk').classList.remove('active'); speechSynthesis.speak(spk); eId('bSpk').classList.add('active'); };
const sTip=eId('selTip');
document.addEventListener('selectionchange', () => { const s=window.getSelection(); if(s.isCollapsed||!s.toString().trim()){sTip.classList.remove('show');return;} const r=s.getRangeAt(0).getBoundingClientRect(); sTip.style.top=`${r.top-40}px`; sTip.style.left=`${r.left+r.width/2}px`; sTip.classList.add('show'); });
sTip.onclick = async () => { try{await navigator.clipboard.writeText(window.getSelection().toString());showTst(UIDict[st.l].cop);}catch(e){} window.getSelection().removeAllRanges(); sTip.classList.remove('show'); };
const cmdBg=eId('cmdBg'), cmdInp=eId('cmdInp'), cmdClr=eId('cmdClr'), cmdRes=eId('cmdRes');
let cmdO = false;
function renDef() { cmdRes.innerHTML=''; if(st.bm.length){ let l=document.createElement('div'); l.className='p-lbl'; l.style.padding='8px 16px'; l.textContent=st.l==='en'?'Bookmarks':'العلامات المرجعية'; cmdRes.appendChild(l); st.bm.forEach(p=>{ let i=document.createElement('div'); i.className='c-res-item cmd-item'; i.innerHTML=`<span>${st.l==='en'?'Page':'صفحة'} ${arN(p)}</span>`; i.onclick=()=>{clCmd();rPage(p,p>st.p?1:-1);}; cmdRes.appendChild(i); }); } }
function opCmd(){ cmdO=true; cmdBg.classList.add('show'); cmdInp.value=''; cmdClr.classList.remove('show'); renDef(); setTimeout(()=>cmdInp.focus(),100); }
function clCmd(){ cmdO=false; cmdBg.classList.remove('show'); cmdInp.blur(); window.focus(); }
eId('bCmd').onclick = opCmd;
cmdBg.onmousedown = e => { if(e.target===cmdBg) clCmd(); };
cmdClr.onclick = () => { cmdInp.value=''; cmdClr.classList.remove('show'); renDef(); cmdInp.focus(); };
let tCmd=null;
cmdInp.oninput = e => {
const q=e.target.value.toLowerCase().trim(); cmdClr.classList.toggle('show', q.length>0);
clearTimeout(tCmd);
tCmd = setTimeout(() => {
if(!q){renDef();return;} cmdRes.innerHTML=''; let count=0;
const addR=el=>{if(count===0)el.classList.add('sel');cmdRes.appendChild(el);count++;};
const pm=q.match(/^(?:page|صفحة|p|ص)?\s*(\d+)$/i);
if(pm) { let pn=parseInt(pm[1]); if(pn>=1 && pn<=tot) { let d=document.createElement('div'); d.className='c-res-item cmd-item'; d.innerHTML=`<div style="font-weight:700;color:var(--accent)"><span>${st.l==='en'?`Go to page ${pn}`:`الذهاب إلى صفحة ${pn}`}</span></div>`; d.onclick=()=>{clCmd();rPage(pn,pn>st.p?1:-1);}; addR(d); } }
CMDS.forEach(c=>{ if(c.k.some(kw=>kw.includes(q)||q.includes(kw))){ let d=document.createElement('div'); d.className='c-res-item cmd-item'; d.innerHTML=`<div style="font-weight:700;color:var(--accent)"><span>${st.l==='en'?c.tEn:c.tAr}</span></div>`; d.onclick=()=>{clCmd();c.act();}; addR(d); } });
if(PAGES.length) {
f.search(q).slice(0,25).forEach(r=>{ let d=document.createElement('div'); d.className='c-res-item'; let sn=r.item.c.substring(Math.max(0,r.matches[0].indices[0][0]-50), r.matches[0].indices[0][1]+80).trim(); d.innerHTML=`<div class="c-res-pg">${st.l==='en'?`Page ${arN(r.item.p)}`:`صفحة ${arN(r.item.p)}`}</div><div class="c-res-txt">${hl(esc(sn), q)}</div>`; d.onclick=()=>{clCmd();if(window.innerWidth<=768)togSb(false);rPage(r.item.p,r.item.p>st.p?1:-1,q);}; addR(d); });
}
if(count===0)cmdRes.innerHTML=`<div class="no-res">${UIDict[st.l].nores}</div>`;
}, 150);
};
let imm=false;
const tImm = () => { imm=!imm; document.body.classList.toggle('imm',imm); if(imm){if(window.innerWidth<=768&&sbO)togSb(false);if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}else{if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});} };
eId('bXImm').onclick=tImm;
eId('bImm').onclick=tImm;
window.addEventListener('hashchange', () => { let m=location.hash.match(/#p=(\d+)/); if(m){ let p=parseInt(m[1]); if(p!==st.p)rPage(p,p>st.p?1:-1); } });

document.onkeydown = e => {
const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
const isCmdK = (e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'k' || e.code === 'KeyK');
const isSlash = (e.key === '/' || e.code === 'Slash') && !isInput;

if (isCmdK || isSlash) {
e.preventDefault();
if (cmdO) clCmd(); else opCmd();
return;
}

if (e.key === 'Escape') {
if (cmdO) return clCmd();
if (imm) return tImm();
if (isInput) return e.target.blur();
}

if (cmdO) {
const items = Array.from(cmdRes.querySelectorAll('.c-res-item'));
if (!items.length) return;
let idx = items.findIndex(i => i.classList.contains('sel'));
if (e.key === 'ArrowDown' || e.code === 'ArrowDown') {
e.preventDefault();
items[idx]?.classList.remove('sel');
idx = (idx + 1) % items.length;
items[idx].classList.add('sel');
items[idx].scrollIntoView({block: 'nearest'});
}
if (e.key === 'ArrowUp' || e.code === 'ArrowUp') {
e.preventDefault();
items[idx]?.classList.remove('sel');
idx = (idx - 1 + items.length) % items.length;
items[idx].classList.add('sel');
items[idx].scrollIntoView({block: 'nearest'});
}
if (e.key === 'Enter' || e.code === 'Enter') {
if (idx >= 0) {
e.preventDefault();
items[idx].click();
}
}
return;
}

if (isInput) return;

if (e.key === 'ArrowRight' || e.code === 'ArrowRight') {
if (st.l === 'ar') rPage(st.p - 1, -1); else rPage(st.p + 1, 1);
}
if (e.key === 'ArrowLeft' || e.code === 'ArrowLeft') {
if (st.l === 'ar') rPage(st.p + 1, 1); else rPage(st.p - 1, -1);
}
};

let tx=0, ty=0;
eId('rArea').addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;},{passive:true});
eId('rArea').addEventListener('touchend',e=>{ const x=e.changedTouches[0].screenX,y=e.changedTouches[0].screenY; if(Math.abs(x-tx)>70&&Math.abs(y-ty)<50){ if(st.l==='ar'){if(x>tx)rPage(st.p+1,1);else rPage(st.p-1,-1);}else{if(x<tx)rPage(st.p+1,1);else rPage(st.p-1,-1);} } },{passive:true});
apL(); apT(st.t); apF(); bldNav(); rPage(st.p);
if(window.innerWidth>768) togSb(true);
</script>
