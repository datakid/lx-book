.pop { position: absolute; top: calc(100% + 12px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 24px; box-shadow: var(--shadow); display: none; flex-direction: column; gap: 20px; min-width: 300px; z-index: 1000; animation: drop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

body.imm .imm-btn { opacity: 0.7; pointer-events: auto; transform: translateY(0); }

.sel-tip { position: fixed; z-index: 99999; background: var(--text); color: var(--base); padding: 6px 12px; border-radius: var(--r-sm); font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: var(--shadow); transform: translate(-50%, 10px) scale(0.9); opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.sel-tip.show { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
.sel-tip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 6px; border-style: solid; border-color: var(--text) transparent transparent transparent; }
.sel-tip svg { width: 14px; height: 14px; }
@media (max-width: 768px) {
.layout { flex-direction: column; }
.sidebar { position: fixed; inset-inline-start: 0; top: 0; bottom: 0; width: 85vw; max-width: 340px; box-shadow: 0 0 40px rgba(0,0,0,0.5); margin-inline-start: 0; }
[dir="rtl"] .sidebar { transform: translateX(100%); }
[dir="ltr"] .sidebar { transform: translateX(-100%); }
[dir="rtl"] .sidebar.collapsed { transform: translateX(100%); margin-inline-start: 0; }
[dir="ltr"] .sidebar.collapsed { transform: translateX(-100%); margin-inline-start: 0; }
.sidebar:not(.collapsed) { transform: translateX(0) !important; }
.topbar { padding: 0 16px; height: 64px; }
.title-text { font-size: 1.05rem; }
.cmd-btn span { display: none; }
.read-area { padding: 80px 16px 100px; }
.page { padding: 32px 20px 32px; }
.pg-head-top { gap: 16px; flex-direction: column; align-items: flex-start; }
.pop { position: fixed; top: 72px; left: 16px; right: 16px; min-width: 0; width: auto; }
.disclaimer { bottom: 80px; inset-inline-end: 16px; font-size: 0.7rem; padding: 6px 12px; }
.cmd-pal { max-height: 85vh; }
}

<script>
const PAGES = ["الهيئة العامة للتأمين الصحي\nالإدارة المركزية للتموين الطبي والصيدليات\n\nمقدمة\n\nتتشرف الإدارة المركزية للتموين الطبي والصيدليات بالهيئة العامة للتأمين الصحي بإعداد قائمة الأدوية الأساسية وإجراءات وبروتوكولات تداولها بالهيئة لعام 2019 حيث صدرت الطبعة الأولى عام 1966 وتوالى صدور الطبعات التالية خلال السنوات الماضية. وتعتبر تلك القائمة مع الدليل مرجعاً يضم جميع البروتوكولات والقرارات والقواعد والتعليمات المنظمة الصادرة من الهيئة وهو دليل الطبيب والصيدلي المعين والمتعاقد مع التأمين الصحي للتعامل مع الأدوية المصرح بوصفها تنفيذاً لقوانين التأمين الصحي.\n\n\"آملين من الله أن يكون نافعاً ومعيناً لهم لأداء خدمة طبية متميزة لصالح منتفعي التأمين الصحي\"\n\nإعداد:\nد/ منيرة حسين\nد/ ناهد عبد الرحيم\nد/ حنان العليمي\nد/ أحمد سعودي\nد/ مروة عباس\nد/ مروة حلمي\nد/ رحاب محمد\nك/ سناء يوسف\n\nمراجعة:\nد/ ليلى السيد علي\n\nيعتمد:\nالسيدة الدكتورة\nرئيس مجلس الإدارة\nد/ سهير عبد الحميد\n\nتاريخ الإصدار:\n1 / 1 / 2019", "أنظمة الانتفاع بالخدمات التأمينية\n\nنظام العلاج التأميني الاجتماعي (طبقاً لقانون التأمين الاجتماعي رقم 79 لسنة 1975 وتعديلاته)\nلا يجوز تحميل المؤمن عليهم أي نصيب في نفقات التأمين إلا فيما يرد به نص خاص.\nويشمل هذا النظام:\n* تأمين إصابات العمل (الباب الرابع)\n* تأمين المرض (الباب الخامس): وتسري أحكامه على:\n- العاملون المدنيون بالجهاز الإداري للدولة والهيئات العامة والمؤسسات العامة والوحدات العامة والوحدات الاقتصادية التابعة لأي من هذه الجهات وغيرها من الوحدات الاقتصادية بالقطاع العام (مادة 2 من القانون).\n- العاملين لدى أصحاب الأعمال (القطاع الخاص) (مادة 73 من القانون).\n- أصحاب المعاشات (مادة 74 من القانون).\n- الأرامل (طبقاً لقرار رئيس مجلس الوزراء رقم 1 لسنة 1981).\n- أسر المؤمن عليهم وأصحاب المعاشات من مواطني محافظة الإسكندرية (طبقاً لقرار رئيس مجلس الوزراء رقم 10 لسنة 1981).\n- نظام التأمين الصحي على طلاب المدارس (القانون 99 لسنة 1992 المعدل بقانون رقم 3 لسنة 2017).\n- يسدد الطالب ثلث ثمن الدواء بدون حد أقصى عدا الأمراض المزمنة المحددة فيصرف لها الدواء مجاناً.\n- نظام التأمين الصحي على الأطفال دون السن المدرسي (قرار وزير الصحة والسكان رقم 380 لسنة 1997، مرسوم بقانون رقم 86 لسنة 2012 المعدل بقانون رقم 3 لسنة 2017).\n- مساهمة ولي أمر الطفل في ثمن الدواء الذي يصرف خارج المستشفى على غرار ما اتبع في نظام التأمين الصحي على الطلاب.\n- نظام التأمين الصحي للمرأة المعيلة (قانون رقم 23 لسنة 2012).", "القوانين واللوائح (القرارات) المنظمة للتعامل مع أدوية الهيئة العامة للتأمين الصحي\nقانون رقم 10 لسنة 1967\n\nرئيس الجمهورية\nباسم الأمة\nقرر مجلس الأمة القانون الآتي نصه وقد أصدرناه:\n\nمادة (1)\nمع عدم الإخلال بأية عقوبة أشد ينص عليها في قانون آخر، يعاقب بالحبس مدة لا تقل عن ثلاثة أشهر وبغرامة لا تقل عن مائة جنيه ولا تزيد عن خمسمائة جنيه أو بإحدى هاتين العقوبتين كل عامل في الهيئة العامة للتأمين الصحي أو أحد المتعاقدين معها من الأطباء والصيادلة أو غيرهم سهل للمنتفع أو لغيره ممن تتولى الهيئة طبقاً لنظامها تقديم الرعاية الطبية إليه الحصول على أدوية بغير حق أو لا تتطلب الأحوال الطبية صرفها إليه ثم تصرف فيها إلى غيره هو ومن تصرف إليه.\n- كما يعاقب بذات العقوبة كل من حصل على أدوية الهيئة بطريقة غير مشروعة، وكل من تعامل في هذه الأدوية مع علمه بذلك. ويعتبر في حكم الدواء ما يصرف للمنتفع في سبيل علاجه ورعايته طبياً من أطراف صناعية أو أجهزة تعويضية أو أي شيء آخر.\n- وفي جميع الأحوال يحكم بمصادرة الدواء، كما يحكم على مرتكب الجريمة بأن يؤدي إلى الهيئة العامة للتأمين الصحي ضعف ثمنه وقت ضبطه.\n\nمادة (2)\n- ينشر هذا القانون في الجريدة الرسمية ويعمل به من تاريخ نشره.\n- يبصم هذا القانون بخاتم الدولة وينفذ كقانون من قوانينها.", "أمثلة للمخالفات التي تندرج تحت طائلة القانون 10 لسنة 67 (أو قوانين أشد مثل قانون العقوبات)\n\nالأطباء:\n1- استغلال بيانات بعض المنتفعين (الاسم والكود) لتحرير تذاكر دون علم أصحابها.\n2- بيع دفاتر التذاكر الطبية أو جزء منها.\n3- تدوين تشخيص وهمي بهدف وصف أدوية لا تتطلب حالة المنتفع المرضية وصفها، لرفع القيمة المادية للتذكرة.\n4- تحرير التذكرة لعلاج شخص آخر خلاف المنتفع الاسم المدرج اسمه بها سواء أكان من المنتفعين بالتأمين الصحي أم من غير المنتفعين، وسواء كان ذلك مجاملة أو بمقابل مادي.\n5- الاستيلاء على التذكرة الطبية مقابل إعطاء المنتفع إجازة بدون وجه حق.\n\nالصيادلة:\n1- شراء التذاكر من أصحابها أو من وسيط بالثمن أو مقابل إضافة القيمة أو جزء منها لصالح المنتفع في حساب يخصه بالصيدلية أو تسليمه بون بالقيمة أو جزء منها.\n2- استبدال الأدوية الموصوفة بمستحضرات التجميل أو أدوية لعلاج شخص آخر.\n3- شراء أدوية تأمين صحي مختومة بأختام الهيئة أو صيدليات متعاقدة أخرى أو تواجد هذه الأدوية بالصيدلية، أياً كان مكان تواجدها ولو بحجة الاحتفاظ بها للصرف مجاناً.\n\nالمنتفع:\n1- بيع التذاكر للصيدلية مباشرة أو عن طريق وسيط بالثمن أو مقابل إضافة القيمة أو جزء منها لصالح المنتفع في حساب يخصه بالصيدلية أو استلامه بون بالقيمة أو جزء منها.\n2- استبدال الأدوية الموصوفة بمستحضرات التجميل أو أدوية لعلاج شخص آخر.\n3- بيع الأدوية أو الأجهزة التعويضية المنصرفة لعلاجه.\n\nالعاملين بالهيئة:\n1- التوسط لدى الطبيب لتحرير تذاكر طبية بأسماء يتضح أنها وهمية أو صحيحة بدون علم أصحابها.\n2- الاشتراك الجنائي مع الطبيب بتقديم بيانات المنتفعين له لتحرير تذاكر بأسمائهم دون علمهم وتزوير بيانات التسجيل بالعيادة.\n3- الاتفاق الجنائي مع الصيدليات المتعاقدة لبيع التذاكر لها.\n4- استغلال ما قد يتركه الطبيب سهواً من تذاكر دون استخدام.", "أوامر إدارية\n\nأمر إداري رقم 1:\nيتم وصف الأدوية التي تصرف من الصيدليات التابعة للهيئة بالاسم العلمي وليس التجاري ويتم الالتزام بصرف الدواء طبقاً لتعليمات دليل الأدوية للتأمين الصحي.\n\nأمر إداري رقم 2:\nتلاحظ قيام بعض السادة الاستشاريين بعدم الالتزام بوصف الأدوية الواردة بدليل الأدوية للتأمين الصحي مما أدى إلى الإسراف في وصف وصرف الأدوية من خارج الدليل مما يشكل عبئاً على موازنة الهيئة وتعريض المرضى لآثار جانبية خطيرة نتيجة هذا الإسراف.\nلذا يتم اتخاذ اللازم فوراً نحو وقف هذا الإسراف وتنفيذ تعليمات الدليل التي لا تجيز للاستشاري وصف أدوية خارج الدليل والبروتوكولات المعتمدة لتنظيم وصف الأدوية بالهيئة إلا الحالات الحرجة فقط (Life Saving Drugs) وهذه الحالات يستلزم علاجها داخل المستشفيات لحاجتها للمتابعة المستمرة.\n\nأمر إداري رقم 3:\nتيسيراً على السادة المؤمن عليهم مرضى الفشل الكلوي الذين يقومون بإجراء غسيل كلوي متكرر يصير مناظرتهم مرة كل ثلاثة شهور بمعرفة الأساتذة الاستشاريين حيث يتم تقييم الحالة ووصف العلاج اللازم لها، أما تكرار هذا العلاج فيتم بمعرفة أقرب أخصائي لمحل إقامة المؤمن عليه شهرياً.\n\nأمر إداري رقم 4:\nعند وصف الأدوية يتم الالتزام بوصف الدواء الوارد بالمناقصة المركزية للأدوية بالاسم العلمي.\n\nأمر إداري رقم 5:\nعند وصف أدوية لأمراض مزمنة يقتصر الوصف على الأدوية المعالجة للمرض المزمن فقط.", "تعليمات هامة للسادة الأطباء والصيادلة مستخدمي التذاكر الطبية\n\nالتذكرة الطبية:\nتعامل التذكرة الطبية معاملة الشيك (تتميز برقم مسلسل مطبوع ورقم مجموعة) ولذلك يجب تحري الدقة في تحريرها حتى تكون صالحة للصرف وطبقاً للقواعد التفصيلية بدليل الأدوية وتعديلاته والتي تسهل للمنتفع الحصول على الدواء، ولذلك فإن الهيئة أعدت نماذج مختلفة طبقاً لقانون الانتفاع وكذلك سلطة الوصف. وفي حالة عدم مراعاة الدقة في تحريرها يترتب عليه عدم صرف التذكرة وعودة المنتفع للطبيب محرر التذكرة لتعديلها.\n\nأنواع التذاكر الطبية المستخدمة:\n- توجد تذاكر داخلية مخصصة فقط للصرف من صيدليات الهيئة المملوكة لمنتفعي كل قانون، ومدون عليها رقم القانون أو النظام، كما توجد تذاكر للصرف الخارجي.", "أولاً: الإجراءات التي تتبع عند استلام وإرجاع دفاتر التذاكر الطبية:\n\nعند بدء الطبيب العمل بالهيئة يتقدم إلى مدير المنطقة المختصة بصورة بطاقة الرقم القومي + عدد 2 أكلاشيه حجم صغير بالاسم والتخصص فقط، وإذا رغب في توكيل أحد معاونيه كمندوب لاستلام الدفاتر فيحضر معه المندوب ببطاقة الرقم القومي.\n\n* تقوم المنطقة بتحرير نموذج خاص (تصريح لطبيب باستلام دفاتر تذاكر طبية) يدرج به كل البيانات الخاصة بالطبيب:\n(الاسم – نموذج توقيعه – بصمة الأكلاشيه – بيانات بطاقة الرقم القومي – عنوان وتليفون السكن – جهة العمل الأصلية – التخصص – نوع التعاقد ومكانه – تاريخ بدء العمل – نوع الدفاتر المصرح له باستلامها وعددها – جهة تسليم الدفاتر – توقيع الطبيب بما يفيد صحة البيانات – وكذلك بيانات المندوب إن وجد ونموذج توقيعه... إلخ).\n\n* ويعتمد النموذج من مدير المنطقة ويحرر هذا النموذج بأرقام مسلسلة سنوية ومن أصل يحفظ طرف أمين المخزن وصورة ضوئية لكل من (الموظف المكلف بختم التذاكر / المراجعة الفنية الصيدلية / المراجعة الفنية الطبية / الاستحقاقات بالمنطقة).\n\n* تلتزم المنطقة بإخطار نفس الجهات السابقة فور انتهاء تكليف الطبيب بالعمل أو نقله لعمل آخر.\n\n* يتقدم الطبيب لأمين المخزن المختص لصرف التذاكر. وفي أول مرة يقوم بالتوقيع على الإقرار التالي الذي يحرر من أصل طرف أمين المخزن (وصورة ضوئية تسلم للطبيب وأخرى للموظف المكلف بختم التذاكر وصورة طرف مدير المنطقة/العيادة).", "الهيئة العامة للتأمين الصحي - نموذج (2)\nالإقرار الذي يحرره الطبيب عند صرف دفاتر تذاكر طبية لأول مرة\n\nفرع: ......... المنطقة: ......... مسلسل: ......... التاريخ: / / \nاسم الطبيب: ....................................... رقم وتاريخ الإخطار الوارد من المنطقة بالعمل: .........\n\nأقر بالالتزام التام بما يلي بالنسبة لدفاتر التذاكر الطبية الخاصة بالهيئة والتي تسلم لي حالياً ومستقبلاً كعهدة شخصية:\n1- أنني أعلم أنها دفاتر ذات قيمة وأنني مسئول عن المحافظة عليها من الضياع أو السرقة وغير مسموح للغير من الأطباء باستخدامها.\n2- أن أقوم فوراً بالإبلاغ عن فقد أي دفتر أو جزء منه أو كعب مستعمل فور علمي بذلك، وأن يتم الإبلاغ للشرطة وكذلك إدارة المنطقة التابع لها، وأن أتحمل كل ما يترتب على الفقد جنائياً ومالياً.\n3- أنني اطلعت على القانون 10 لسنة 67 واستلمت نسخة من دليل الأدوية طبعة 2019 والتعديلات التي صدرت له حتى آخر تعديل، وأنه يتعين علي استخدام هذه الدفاتر فقط في الغرض الذي خصصت من أجله وطبقاً للقواعد التفصيلية الموضحة بدليل الأدوية وتعديلاته، والتي تسهل للمنتفع الحصول على الدواء وكذلك ضوابط ترشيد استهلاك الدواء، كما أقر بأنني أعلم أن استخدام هذه التذاكر لوصف أدوية لغير المنتفعين هي مخالفة تندرج تحت طائلة القانون رقم (10) لسنة 67.\n4- ألتزم باستخدام الدفاتر طبقاً لتسلسل أرقام التذاكر، وأن أتحقق قبل إعادة الكعوب أنه لا توجد تذاكر لم تستخدم، وأن لا أطلب دفاتر جديدة إلا مقابل الكعوب المرتجعة وبها الصور كاملة العدد وواضحة البيانات، وأن يكون عدد الدفاتر عهدتي ثابتاً طبقاً للمدون بالإقرار.\n5- ألتزم برد كل ما لدي من دفاتر أو كعوب بمجرد انتهاء تكليفي بالعمل الذي تسلمت الدفاتر من أجله.\n6- أقر بعدم وجود أي دفاتر أو كعوب طرفي سبق استلامها من أي جهة بالهيئة.\n7- الدفاتر المصرح لي بها هي عدد .... دفتر، قانون ....\n\nتوقيع الطبيب بالإقرار بما ورد عاليه واستلامه لنسخة من الإقرار: ...................\nتوقيع مسئول التذاكر الطبية الذي سيتولى الصرف: ...................\nتوقيع أمين المخزن الذي سيتولى الصرف: ...................\n\nيعتمد،،،\nمدير الوحدة\n...................", "يوقع الطبيب باستلام الدفاتر (غير مختومة) من أمين المخزن على السجل المخصص لذلك كما هو موضح بالنموذج التالي:\n\nالهيئة العامة للتأمين الصحي - (نموذج رقم 399 \"ت.ص\")\nفرع: ......... المنطقة: ......... مستشفى / عيادة: ......... سجل تسليم التذاكر الطبية\n\n[جدول يحتوي على الأعمدة التالية: مسلسل | من رقم ... إلى رقم ... | اسم الطبيب | توقيع الطبيب | تاريخ الاستلام | توقيع المستلم في المنطقة | تاريخ التسليم]\n\n- على الطبيب أو مندوبه مراجعة سلامة الدفاتر وصحة البيانات المسجلة بالسجل خاصة رقم المجموعة والرقم المسلسل المطبوع وأن نوع الدفاتر والقانون هو الخاص به قبل التوقيع باستلامها.\n- على الطبيب أو مندوبه التوجه للموظف المختص بختم الدفاتر (المراجع)، والذي يكون مقره بنفس المبنى المتواجد به المخزن، ليقوم الأخير بختم الدفاتر بختم شعار الجمهورية المخصص لهذا الغرض كعهدة، ويراعى الوضوح التام لبيانات الختم وتستخدم دائماً ختامات سليمة وحبر مناسب، وعلى المراجع إعادة تسجيل بيانات الدفاتر في كارت يخصص لكل طبيب (أو صفحات مستقلة بسجل حرف ز) وتكون بيانات الكارت (اسم الطبيب ورقم الإخطار الوارد من المنطقة بالتصريح له باستلام دفاتر ثم جدول يدون به نوع الدفتر والقانون ورقم المجموعة ورقم أول تذكرة وتاريخ الختم وتوقيع الطبيب أو المندوب بما يفيد ختم الدفاتر / تاريخ ارتجاع الكعب من واقع صورة الاستمارة 111 ع.ح التي ترد إليه من أمين المخزن بإضافة الكعوب المرتجعة).\n- وعلى الطبيب أو مندوبه التحقق من ختم كل التذاكر والتوقيع بما يفيد ذلك على السجل المشار إليه.\n- عند انتهاء استخدام الدفاتر ترتجع لنفس أمين المخزن، وعليه التحقق أنها منصرفة من نفس المخزن وأنها لا تحتوي على صور تذاكر مفقودة أو أصول لم تستخدم غير ملغاة، وعلى الطبيب التحقق من تسديد بيانات الارتجاع المشار إليها عاليه بنفس سجل الاستلام، ويوقع بما يفيد الارتجاع للكعب.\n* لا يقوم أمين المخزن بصرف أكثر من دفتر من كل فئة في الدفعة الواحدة (فيما عدا المناطق النائية) ويقوم الطبيب بالتوقيع في السجل المخصص لذلك.", "ثانياً -: الإجراءات التي تتبع في حال فقد دفتر التذاكر الطبية أو جزء منه:\n\nدفتر التذاكر الطبية هو أحد الدفاتر المالية ذات القيمة وبعد ختمه يصبح مثل دفاتر الشيكات، لذلك يجب المحافظة عليه بحرص ومراعاة إعداد أماكن مناسبة للحفظ بالعيادات وعدم السماح للغير بتداوله. أما إذا فقد الدفتر أو جزء منه فعلى الطبيب (أو أمين المخزن) اتباع الإجراءات الآتية:\n\n1. تقديم بلاغ عن الدفاتر التي فقدت وبياناتها (نوعها / القانون / رقم المجموعة / الرقم المسلسل / هل هي مختومة أم لا) وظروف الفقد لقسم الشرطة المختص.\n2. يقوم بإبلاغ رئاسته المباشرة وإدارة المنطقة التابع لها بالأمر مع إرفاق صورة من بلاغ الشرطة، وتقوم المنطقة بدورها بعمل تحقيق داخلي وإبلاغ مدير الفرع وذلك لاتخاذ كافة الاحتياطات اللازمة لمنع استخدام الدفتر أو التذاكر المفقودة.\n3. يتم إبلاغ قسم الصيدليات بالفرع في نفس اليوم برقم الدفتر أو الدفاتر أو التذاكر المفقودة ورقم المجموعة ونوع الدفتر والقانون وهل هي مختومة بشعار الجمهورية من عدمه، وهل عليها اسم الطبيب أو الأكلاشيه الخاص به من عدمه، وعلى رئيس قسم الصيدليات في نفس اليوم عمل نشرة بهذه البيانات ترسل لجميع الصيدليات المملوكة والمتعاقدة في الحدود الجغرافية لصرف هذه النوعية من التذاكر.\nوترسل مع مندوب أو أكثر بسركي خاص أو بخطابات مسجلة بعلم الوصول، وذلك بالإضافة إلى نشر إعلان في ثلاثة أعداد متتالية في جريدة رسمية، أو جريدتين يوميتين متى رأى مدير الفرع ما يبرر ذلك.\nوذلك لمصادرة ما قد يقدم منها للصيدليات للصرف وإبلاغ النيابة العامة لمباشرة التحقيق، واتخاذ باقي الإجراءات القانونية. كما تبلغ نشرة لكل مكاتب المراجعة الفنية بالفرع لكي يقوم الصيادلة بالبحث عن أي تذكرة تكون قد صرفت من إحدى الصيدليات فعلاً. وتحصل كل مصاريف النشر من صاحب العهدة المسئول عن الفقد.\n4. يجب على مدير المنطقة تشكيل لجنة فوراً (لا يكون صاحب الدفتر المفقود عضواً فيها) للبحث عن سبب الفقد ومدى الضرر الناتج عنه والسبب في تأخير التبليغ إن وجد، وهل الفقد ناتج عن عمد أو إهمال أو قصور في تعليمات الهيئة أو وسائل المحافظة على الدفاتر؟ وهل توجد دفاتر أخرى مفقودة لم يبلغ عنها؟ وتقدم اللجنة تقريرها لمدير المنطقة الذي يحيله لمدير الفرع وعليه اتخاذ الإجراءات المناسبة التي يراها حيال المسئولين، وإذا ظهر لمدير الفرع ما يدعو لإبلاغ النيابة العامة فعليه الإسراع في ذلك حتى لا يكون من وراء التأخير ضياع لبعض معالم الجريمة.\n5. إذا اتضح من التحقيقات أن الفقد هو نتيجة سرقة أو اختلاس أو للتغطية على تلاعب، ففي هذه الحالة تشكل لجنة لمراجعة أعمال الموظف المسئول أو صاحب العهدة وحصر ما قد يكتشف من دفاتر مفقودة لم يبلغ عنها، ومعرفة الطرق التي اتخذت في ارتكاب الحادث، ومعرفة الأسباب التي سهلت ارتكابه، وتقترح أنجح الطرق أو الوسائل لتلافي تكرار الحادث، ويتم إيقاف المسئول عن العمل وتخطر النيابة العامة.", "ثالثاً -: إجراءات التعامل مع المنتفع في تحرير وصرف التذكرة الطبية\n\n- التعامل مع المنتفع:\n\n1. التحقق من شخصية طالب الخدمة وصلاحية البطاقة العلاجية:\n* على الطبيب التأكد من شخصية المنتفع قبل إجراء الكشف الطبي عليه وذلك بالاطلاع على البطاقة العلاجية الخاصة به المثبت عليها صورته والتي يجب أن تكون مختومة من الفرع، كما يتم التأكد من تجديد البطاقة وأن جميع البيانات مدونة بها وعدم وجود صفحات منزوعة منها.\n- كما أن كارنيهات الطلبة المثبت عليها الصورة يتم تجديدها سنوياً بختم ضاغط على ركن الكارنيه المخصص للعام الدراسي حتى لا تستخدم بعد ترك الطالب للدراسة، كما أن بطاقات المواليد تجدد سنوياً بلصق طابع تأمين صحي في المكان المخصص مع التأشير بالتجديد عليها من الجهة المختصة.\n* وعلى الصيدلي الصارف الاطلاع على البطاقة العلاجية للتحقق من شخصية المنتفع وصحة البيانات.\n\n2. الاطلاع على البيانات العلاجية السابقة بالبطاقة:\n* على الطبيب قبل توقيع الكشف الطبي على المنتفع الاطلاع على البيانات العلاجية السابقة المدونة بالبطاقة قبل وصف أي علاج لتجنب حصول المنتفع على دواء لا يزال لديه، حيث يحصل محترفو التردد على أدوية متشابهة أكثر من مرة من أكثر من طبيب أو تكرار العلاج قبل الموعد المحدد له، وأي مخالفة في ذلك فإن الطبيب يتحمل قيمة أي أدوية توصف وتصرف للمنتفع بدون وجه حق.\n\n3. توقيع الكشف الطبي على المنتفع:\nعلى الطبيب أن يراعي الدقة وطلب ما يلزم من أبحاث معملية أو إشعاعية (حسب سلطة الطبيب) حتى يتم وصف الأدوية اللازمة للحالة دون زيادة أو إسراف مع عدم وصف أدوية متشابهة في المفعول، ويتم إثبات كافة البيانات (التشخيص والفحوص المعملية والإشعاعية وتاريخ الكشف والعلاج الموصوف كاملاً وجرعاته ومدة استعماله وتوقيع وأكلاشيه الطبيب) في الصفحات المخصصة لذلك في البطاقة.\n\n4. ضوابط تحرير التذكرة الطبية:\n1- يستعمل القلم الجاف ولا يجوز استخدام القلم الرصاص.\n2- يستخدم كربون ذو وجهين عند تحريرها وأن يكون المستعمل جيداً، وفي حالة عدم توافره يستعمل النوع العادي بعد أن يتم ثنيه، ويجب التحقق من وضوح كل البيانات على صورة التذكرة التي تبقى بكعب الدفتر.\n3- يتم ختمها بخاتم شعار الجمهورية.\n4- إملاء بيانات الجزء العلوي من التذكرة باللغة العربية بخط واضح:\nأ- اسم العيادة\nب- اسم الطبيب\nج- تاريخ الكشف\nد- رقم بطاقة التأمين الصحي", "وعدم الدقة في كتابة البيانات يعرض التذكرة للطعن في صحتها وبالتالي تعتبر التذكرة مزورة ما لم يتمكن محررها من إثبات خلاف ذلك.\n\nذ- وكتابة التشخيص بخط واضح باللغة الإنجليزية وبدون رموز أو اختصارات.\n- بالنسبة للعلاج الشهري استخدام التعبيرات الواردة بالقرار (مع إمكانية إضافة أي إيضاحات أخرى للتشخيص بين قوسين)، والهدف من ذلك هو أن يتمكن الصيدلي والمفتشون من مراجعة التشخيص المزمن على القرارات المحددة للأمراض المزمنة لاكتشاف أي مخالفة للقرار أو تزوير يكون قد أضيف للحصول على أدوية بدون وجه حق.\n5- ختم الروشتة بأكلاشيه صغير باسم وتخصص الطبيب دون أي بيانات أخرى، وعدم وجود الأكلاشيه أو اسم الطبيب بخط واضح يمنع صرف التذكرة.\n6- يسلم الأصل للمنتفع وتظل الصورة بكعب الدفتر.\n7- عند الإلغاء يظل الأصل والصورة بكعب الدفتر مؤشراً عليها بالإلغاء.\n8- تحفظ أصول الدفاتر الطبية بالعيادات عامين خلاف عام العمل الحالي ما لم تكن مطلوبة في تحقيق أو فحص أعمال.\n\n* وعلى الصيدلي التحقق من صلاحية التذكرة واستيفائها لضوابط الصرف:\n- تقديم التذكرة خلال مدة صلاحيتها (تاريخ الكشف لم يمر عليه أكثر من أربعة أيام).\n- وجود خاتم شعار الجمهورية المختص بالهيئة.\n- وجود الرقم المسلسل المطبوع على التذكرة ورقم المجموعة (يمكن للطبيب إذا تمزق هذا الجزء من التذكرة عند نزعه من الدفتر كتابته باليد والتوقيع بجانبه، وفي حالة عدم وجوده يمكن للطبيب كتابته والتوقيع بجواره).\n- وجود التشخيص (طبقاً للتعليمات المنظمة).\n- أكلاشيه باسم الطبيب وتخصصه (في المكان المخصص).\n- توقيع الطبيب بنهاية التذكرة وبجوار أي تأشيرات أو تعديلات (وليس الأكلاشيه).\n- استيفاء بيانات الجزء العلوي من التذكرة ومطابقتها لبيانات البطاقة العلاجية.\n- نوع التذكرة مطابق للقانون الخاضع له المنتفع (لنوع البطاقة العلاجية) لتحصيل المبلغ المطلوب.\n- التذكرة صالحة للصرف لمدة ثلاثة أيام خلاف يوم تحريرها (بما في ذلك تذاكر العلاج الشهري وتكراره).\n- التذكرة صالحة للصرف الخارجي طبقاً للتعليمات والقواعد التي يضعها الفرع (بالنسبة للصيدليات المتعاقدة).", "ملحوظات هامة يجب مراعاتها:\n\n* تاريخ الكشف:\nوأهميته أن التذكرة صالحة لمدة 3 أيام خلاف يوم تحريرها، ولكن في الأحوال التي لا يتمكن المنتفع من صرف التذكرة خلال المدة الموضحة بسبب نقص الدواء في السوق، يجوز للمنتفع إذا انقضت مدة صلاحية التذكرة الطبية للصرف التقدم للطبيب محرر التذكرة أو لمدير العيادة خلال أسبوع من تحرير التذكرة العادية أو خمسة عشر يوماً من تحرير تذكرة علاج شهري أو تكراره إذا ما تحقق أن الحاجة للدواء ما زالت قائمة طبقاً لقواعد التصويب الصحيحة التالية:\n- شطب التاريخ المنتهي كلياً.\n- كتابة التاريخ الجديد كاملاً أعلاه.\n- توقيع الطبيب محرر التذكرة بجوار التاريخ الجديد (أو توقيع مدير العيادة وختم العيادة) ولا يستخدم الأكلاشيه كبديل للتوقيع.\n- التأشير بالتاريخ الجديد بالبطاقة لمراعاة ذلك عند وصف العلاج في المرة التالية.\nتصبح التذكرة بعدها سارية المفعول لأربعة أيام أخرى (تلغى بعدها).\n\nملحوظة:\n* لا يجوز استخدام ختم للتاريخ حيث أنه لن يظهر على خلفية أو صورة التذكرة، وأي تعديل للتاريخ بخلاف هذا يمنع صرف التذكرة.\n* لا يجوز على الإطلاق استخراج تذكرة بدل فاقد لأي سبب كان، ولكن يجوز استخراج تذكرة بدل تالف، وإذا قدمت التذكرة التالفة خلال مدة صلاحيتها يتم تمزيق الجزء السفلي من التذكرة الملغاة وترفق باقي التذكرة بصورة التذكرة الجديدة بالدفتر ويؤشر عليها بدل تالف.\n\nوصف الأدوية اللازمة لحالة المريض مع الالتزام بالتعليمات كما يلي:\n* يجب على الأطباء الالتزام بوصف الأدوية بالاسم العلمي (الكيميائي) طالما كان الدواء يحتوي على مادة فعالة أساسية واحدة أو مادتين فعالتين على الأكثر، وطالما يوجد أكثر من دواء تجاري بنفس التركيب الكيميائي والتركيز، وفي غير ذلك يمكن وصف الدواء بالاسم التجاري. ويراعى في وصف الأدوية اختيار الدواء الأقل سعراً ما دام يؤدي الغرض المطلوب بنفس الكفاءة، وتراعى البروتوكولات والأوامر الإدارية الصادرة عن الهيئة لعالج بعض الأمراض أو استخدام بعض الأدوية، ولا يتم وصف أدوية خارج التشخيص المدون أو خارج تخصص الطبيب المعالج أو أدوية متشابهة المفعول.\n* يتم كتابة الأدوية باللغة الإنجليزية مع توضيح ما يلي:\n- الشكل الدوائي والجرعة اليومية وموعدها والمدة المحددة للعلاج.\n- التركيز (وفي حال عدم توضيح التركيز يتم صرف أقل تركيز).\n- الالتزام بالكتابة بين الأسطر في الخانات المخصصة للطبيب، وعدم الكتابة في الخانات المخصصة للسعر بمعرفة الصيدلي لتسهيل مراجعة التذكرة.\n* وضع خط نهاية التذكرة وتفقيط عدد الأدوية بالحروف (مثلاً Three items).\n* التوقيع في الخانة المخصصة لتوقيع الطبيب وليس الأكلاشيه، وكذلك التوقيع بجوار أي تعديل أو تصويب وبجوار التأشيرات (مثل زيارة منزلية - ملازم الفراش - تكرار علاج ....).\n* أكلاشيه (باسم الطبيب وتخصصه فقط) ويوضع في المكان المخصص ومرة واحدة فقط.", "تسليم التذكرة للمنتفع:\nيسلم المنتفع التذكرة من الأصل فقط، ويراعى عند نزعها من الدفتر عدم تمزيق الجزء الذي يحتوي على الرقم المسلسل ورقم المجموعة وهو الأمر الذي يمنع صرف التذكرة، فإذا حدث ذلك عفواً يتم كتابته باليد على أصل التذكرة مع التوقيع بجواره.\n\nوعلى الصيدلي التحقق من مطابقة الأدوية الموصوفة للتعليمات وأهمها:\n- مطابقة لسلطة الوصف مع مراعاة دليل الطلبة والمواليد.\n- مطابقة العدد وكمية كل صنف لتعليمات وصف الدواء.\n- علاج (أو تكرار علاج) لمدة > أسبوع يراجع التشخيص (ليكون من بين الأمراض المزمنة المحددة).\n- وصف أكثر من 3 أصناف يراجع التشخيص (ليكون لأكثر من تشخيص من التشخيصات المزمنة المحددة).\n- كتابة الجرعة اليومية ومدة استعمال كل صنف على حدة مدونة لإمكان حساب الكمية المطلوبة.\n\nالحالات التي لا يجوز فيها تحرير التذكرة الطبية:\n- عدم وجود البطاقة العلاجية المثبت عليها الصورة والمختومة بخاتم الهيئة مع المنتفع أو عدم صلاحيتها.\n- عدم وجود خاتم شعار الجمهورية على أصل التذكرة.\n- عدم وجود رقم المجموعة مع / أو رقم التذكرة المسلسل.\n- تحرير التذكرة على نموذج يخص قانون يخالف القانون الخاضع له المنتفع.\n- تحرير تذكرة على دفتر يخص طبيب آخر.\n- تحرير تذكرة طلاب بتشخيص مرض غير مزمن على نموذج التذاكر المجانية الخاصة بالأمراض المزمنة للطلاب.", "وصف الدواء:\nيقتصر وصف الأدوية المدرجة بدليل أدوية الهيئة نوعاً وعدداً وكماً تبعاً للقواعد المنظمة لصرف الأدوية كالآتي:\n1- أصناف توصف بمعرفة الطبيب الممارس والأخصائي والاستشاري، ويرمز بجانبها بالرمز .Gp\n2- أصناف توصف بمعرفة الطبيب الأخصائي والاستشاري، ويرمز بجانبها بالرمز .Sp\n3- أصناف توصف بمعرفة الطبيب الاستشاري فقط، ويرمز بجانبها بالرمز .Con\n\n[جدول يوضح طريقة الوصف وسلطة الوصف والفئة والرمز]:\n\n* الممارس:\n- نوعاً: يلتزم بوصف الأدوية المحددة للممارس (الرمز: .Gp) لفئة الكبار والطلبة والمواليد.\n- كماً: بحد أقصى في الزيارة الواحدة بما يكفي علاج أربعة أيام طبقاً للجرعة اليومية التي يحددها الطبيب. وفي حالة الربو الشعبي وضغط الدم يحق له كتابة ما يكفي علاج أسبوع، وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام.\n- عدداً: بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة.\n\n* الأخصائي:\n- نوعاً: يلتزم بوصف الأدوية المحددة للأخصائي بالإضافة للأدوية المحددة للممارس (الرمز: .Sp) لفئة الكبار والطلبة والمواليد.\n- كماً: بحد أقصى في الزيارة الواحدة بما يكفي علاج أسبوع طبقاً للجرعة اليومية التي يحددها الطبيب حتى ولو أدى ذلك لوصف أكثر من عبوة، وبالنسبة للمواليد فإن الحد الأقصى هو ما يكفي علاج خمسة أيام، أما في حالة الأمراض المزمنة المحددة فيما بعد والتي استقرت علاجياً فإنه يمكن للأخصائي وصف علاج في الزيارة الواحدة لمدة حدها الأقصى شهرين طبقاً لمدى استقرار الحالة.\n- عدداً: بحد أقصى حتى ثلاثة أصناف في الزيارة الواحدة للكبار والمواليد والطلبة، أما إذا كان التشخيص لأكثر من مرض مزمن فيمكن لأخصائي واحد أو أكثر وصف لغاية ستة أصناف في الزيارة الواحدة (مع مراعاة أن للكبار جدول للأمراض المزمنة وللطلبة جدول آخر).\n\n* الاستشاري:\n- نوعاً: وله الحق في وصف جميع الأدوية المدرجة بالدليل ولا يجوز له بالخروج عنها إلا في الحالات الحرجة التي ترفق بها التحاليل الطبية وبموافقة اللجنة العليا للدواء (على ألا يكون من مجموعة الفيتامينات أو الأدوية التي تحتوي على حبوب اللقاح أو غذاء ملكات النحل) (الرمز: .Con) لفئة الكبار والطلبة والمواليد وأن يكون مسجلاً بوزارة الصحة ومدون بالعبوة ذلك وأن يكون مسعراً جبرياً.\n- كماً وعدداً: كماً وعدداً مثل الأخصائي.\n\n* أطباء الأسنان:\nيصرح لهم بوصف أدوية الممارس فقط، فيما عدا الحاصلين على دبلوم أو ماجستير تخصص على الأقل ويعاملون بهذه الصفة بالهيئة فيجوز لهم وصف أدوية الأخصائي ويحدهم مدير الشئون الطبية المختص بكل فرع (الفئة: الكبار والطلبة والمواليد، الرمز: .Gp, .Sp).", "لجنة تنسيق العلاج:\nتشكل لجنة لكل عيادة برئاسة مدير العيادة وعضوية صيدلي العيادة والأخصائيين حسب الحالات المرضية المعروضة على اللجنة كالآتي:\n- الحالات التي تعاني من أكثر من مرض مزمن.\n- الحالات التي تحتاج لوصف فيتامينات.\nوتقوم اللجنة بتجميع الأدوية الخاصة بالحالات المزمنة التي تعاني من أكثر من مرض مزمن حيث تتأكد من عدم تكرار وصف الدواء والتأكد من عدم وجود تفاعلات دوائية بين الأدوية الموصوفة على أن تجتمع اللجنة بكامل تشكيلها ويكون قرارها بالأغلبية.\n\nمجموعات أدوية خاصة وهي:\n- المسكنات وخافضات الحرارة.\n- الأدوية الباسطة للعضلات.\nيراعى عند وصف أدوية من المجموعات السابقة بمعرفة أخصائي أو استشاري لعلاج الأمراض المزمنة فإنه يصرح فقط بوصف علاج في دفعة واحدة وبشكل صيدلي واحد (سواء كان مرهم أو حقن أو أقراص) بحد أقصى عشرة أيام.\n- تصرف الأدوية لمدة شهر في حالات الأمراض الآتية:\n* الأمراض المناعية والروماتيزم\n* ارتفاع الكوليسترول\n* الدوالي\n* الأوعية الدموية الطرفية والمركزية\nولا يجوز وصف أكثر من دواء واحد من كل مجموعة في شكل صيدلي واحد.", "الأمراض المزمنة\n\n1- بالنسبة للمنتفعين بقانون 79 والتي يشار إليها إجمالاً بالكبار وهو ما جاء بالمادة الثالثة من قرار رئيس مجلس الإدارة رقم 1966 لسنة 2001.\n2- الأمراض المزمنة بقرار وزير الصحة رقم 321 لسنة 1992 وتعديلاته بالنسبة للطلاب، والتي استقرت علاجياً.\n\nأولاً -: قوائم الأمراض المزمنة المحددة بالنسبة للمنتفعين بقانون رقم 79\n\n1- الأمراض الخبيثة بجميع أجزاء الجسم (All Types Of Malignant Diseases).\n2- الدرن بأنواعه (Pulmonary & Extra Pulmonary T.B.).\n3- أمراض الدم المزمنة (Chronic Blood Diseases):\n- مرض تزايد كرات الدم الحمراء (polycythaemia).\n- اللوكيميا (Leukemia).\n- الأنيميا المزمنة (Chronic Anemia).\n- الأنيميا الخبيثة (Pernicious Anemia).\n- نقص صفائح الدم (Thrombocytopenia).\n- الهيموفيليا (Hemophilia).\n4- أمراض الجهاز الدوري والقلب ومضاعفاتها (Cardiac & Vascular Diseases):\n- ارتفاع ضغط الدم المزمن (Hypertension).\n- أمراض القلب المزمنة ومضاعفاتها وأمراض القلب الخلقية ومضاعفاتها (Cardiac Diseases).\n- أمراض الشرايين التاجية ومضاعفاتها (Coronary Artery Diseases).\n- التهاب وانسداد الأوعية الدموية ومضاعفاتها (Peripheral Vascular Diseases).\n- مرض رينودز (Raynaud's Disease).\n- مرض بيرجر (Buerger's Disease).\n5- أمراض الجهاز الهضمي (Gastro-Intestinal Diseases):\n- تمدد أوردة المريء ومضاعفاتها (Esophageal Varices and Its Complications).\n- قرحة المعدة والاثني عشر (Peptic & Duodenal Ulcer).\n- الالتهاب البريتوني المزمن (Chronic Peritonitis).\n- تضخم الطحال المصحوب بمضاعفات خطيرة (Splenomegaly).\n- أمراض الكبد المصحوبة باختلال وظائف الكبد (Chronic Liver Diseases).\n- اليرقان بأنواعه (Jaundice).\n- التهاب البنكرياس المزمن (Chronic Relapsing Pancreatitis).\n- التهاب القولون المتقرح (Ulcerative Colitis).\n6- أمراض الجهاز البولي والتناسلي (Chronic Urogenital Diseases):\n- الالتهاب الكلوي المزمن (Chronic Nephritis).\n- هبوط كفاءة الكليتين (Renal Failure).\n- النزيف الرحمي المزمن (Chronic Uterine Bleeding).\n7- أمراض الجهاز الحركي والجهاز الضام المزمنة (Skeletal Diseases):\n- مرض روماتويد والأمراض المماثلة (Rheumatoid & Like Diseases).\n- مرض الحمى الروماتزمية (Rheumatic Fever).\n- مرض تآكل الفقرات (Spondylitis).\n- تيبس مفاصل العمود الفقري (Spondylosis Ankylosing Spondylitis).\n- أمراض ضمور العضلات (Myopathies).\n- الانزلاق الغضروفي المزمن (Chronic Disc Prolapse).\n- التهاب العظام المزمن (Chronic Osteomyelitis).", "8- أمراض الجهاز العصبي المزمنة (Chronic Neurological Diseases):\n- الصرع بأنواعه (Epilepsy).\n- الشلل العضوي (Organic Paralysis).\n- أمراض الجهاز العصبي العضوية المزمنة (Chronic Neurological Organic Diseases).\n- الأمراض النفسية والعقلية المزمنة (Chronic Psychiatric & Mental Diseases).\n9- أمراض الجهاز التنفسي المزمنة (Chronic Respiratory Diseases):\n- تمدد الشعب الهوائية (Bronchiectasis).\n- تكيسات الرئة (Cystic Lung Diseases).\n- الانسكابات البلورية بأنواعها (Pleural Effusions).\n- الأمفزيما (Emphysema).\n10- أمراض الغدد الصماء والتمثيل الغذائي والجهاز الليمفاوي (Endocrine Lymph & Metabolic Diseases):\n- أمراض الغدد الجنسية فيما عدا العقم (فيرجع للبروتوكول المنظم لعلاجه) (Chronic Sexual Organic Diseases).\n- التسمم الدرقي (Thyrotoxicosis).\n- هبوط نشاط الغدة الدرقية (Myxedema).\n- مرض السكر ومضاعفاته (Diabetes mellitus & Its Complication).\n- أمراض الغدة النخامية (Chronic Pituitary Diseases).\n- أمراض الغدد جارات الدرقية (Chronic Parathyroid Diseases).\n- مرض القناع الأحمر المنتشر (Lupus Erythematosus).\n- مرض النقرس (Gout).\n- مرض هودجكين (Hodgkin's Disease).\n- داء الفيل (Elephantiasis).\n- تضخم الغدد الليمفاوية لأسباب مزمنة (Lymphadenopathy).\n- أمراض غدد فوق الكلى (Chronic Supra-Renal Diseases).\n11- الأمراض الجلدية المزمنة (Chronic Skin disease):\n- الإكزيما المزمنة (Chronic - Eczema).\n- الإكزيما العصبية (Chronic Neuro-Dermatitis).\n- الصدفية (Psoriasis).\n- مرض الحزاز البسيط (البنفسج) (Lichen Planus).\n- مرض داء الفقاع (Pemphigus).\n- البهاق (Vitiligo).\n- الدرن الجلدي (T.B. Skin).\n- سكليروديرما (Systemic Sclerosis Mycosis Fungoidis).\n- مرض بهجت (Behcet's Disease).\n12- أمراض العيون المزمنة (Chronic Eye Diseases):\n- أمراض تحلل الشبكية المزمنة (Chronic Myopic Degenerative Diseases).\n- انفصال الشبكية (Retinal Detachment).\n- الالتهاب القزحي المزمن (Chronic Iridocyclitis).\n- الجلوكوما المزمنة (Chronic Glaucoma).\n- أمراض العصب البصري المزمنة (Chronic Optic Neuritis Diseases).\n- التهاب الشبكية في مرض السكر (Diabetic Retinopathy).\n13- الجذام (Leprosy).", "ثانياً: قائمة الأمراض المزمنة الخاصة بالطلاب المنوه عنها بقرار وزير الصحة رقم 321 لسنة 1992\n\nأولاً : الأورام الخبيثة بجميع أنواعها ومضاعفاتها بأي من أجزاء الجسم إذا ثبت تشخيصها بصفة قاطعة (All types of Malignant diseases & its complications).\nثانياً : الأمراض الدرنية بأنواعها (All types of tuberculosis).\nثالثاً : الأمراض العقلية العضوية المزمنة بعد ثبوتها بصفة قاطعة (Chronic Organic mental diseases).\nرابعاً : أمراض الدم المزمنة (Chronic haematological Diseases):\n- الأنيميا الوراثية (Hereditary anaemia):\n* أنيميا البحر المتوسط (Thalassemia).\n* الأنيميا المنجلية (Sickle cell anaemia).\n* الأنيميا التكورية (Spherocytic anaemia).\n* أنيميا الفول (Glucose-6-phosphate dehydrogenase deficiency (G6PDD) / Favism).\n- اللوكيميا (Leukaemia).\n- الأنيميا الخبيثة (Pernicious anaemia).\n- الأنيميا الضمورية (Aplastic pancytopenia).\n- نقص كرات الدم البيضاء الدوري (Cyclic neutropenia).\n- أمراض النزيف الوراثية (Coagulation disorders):\n* الهيموفيليا أ ، ب ، ج (Hemophilia A,B,C).\n* العيوب الوظيفية بالصفائح الدموية (Thrombocytopenia).\n- سرطان الدم (Malignant blood diseases):\n* اللوكيميا الحادة (Acute leukemia).\n* اللوكيميا المزمنة (Chronic leukemia).\n- سرطان الغدد الليمفاوية (Malignant lymphomas):\n* الهودجكن (Hodgkin lymphomas).\n* غير هودجكن (Non - Hodgkin lymphomas).\nخامساً : أمراض القلب والأوعية الدموية ومضاعفاتها (Cardiovascular diseases & its complications):\n- ارتفاع ضغط الدم المزمن (Chronic hypertension).\n- أمراض القلب المزمنة وتشمل (Chronic heart diseases):\n* أمراض صمامات القلب الروماتزمية (Rheumatic valvular diseases).\n* العيوب الخلقية بالقلب (Congenital heart diseases).\n* اختلال ضربات القلب المزمن (Chronic arrhythmia).\n- أمراض عضلة القلب التحللية (الأولية والثانوية) (Cardiomyopathy).\n- هبوط البطين الأيمن للقلب الناتج من الأمراض المزمنة بالرئتين أو تشوهات القفص الصدري (Congestive heart failure due to chronic lung diseases or abnormalities in the thoracic cage).\nسادساً : أمراض الجهاز الهضمي وتشمل (Gastro-Intestinal Diseases):\n- مضاعفات تمدد أوردة المريء (Complications of esophygeal varices).\n- الالتهاب البريتوني المزمن لأسباب مختلفة (Chronic Peritonitis of different causes).\n- الاستسقاء بأنواعه (All types of ascites).\n- تضخم الطحال المصحوب بمضاعفات خطيرة (Splenomegaly & its complications).\n- أمراض الكبد المزمنة المصحوبة باختلال وظائف الكبد (Chronic Hepatic diseases with disturbance of liver functions).\n- التهاب القولون المتقرح (Ulcerative colitis).\n- التضخم الخلقي للقولون (Congenital megacolon).\n- ضيق المريء الخلقي والمكتسب (Congenital & acquired esophageal stenosis).", "سابعاً : أمراض الجهاز البولي وتشمل (Urological Diseases):\n- التهاب الكلى وحوض الكلى (Chronic glomerulonephritis & pyelonephritis).\n- هبوط كفاءة الكليتين المزمن لأقل من 50 % عن الطبيعي (Reduction of kidney function to less than 50 % of normal).\n- المثانة العصبية (Neurogenic bladder).\nثامناً : أمراض الجهاز الحركي والجهاز الضام المزمنة وتشمل (Chronic diseases of locomotor system and connective tissue):\n- مجموعة الأمراض الروماتزمية المزمنة (Chronic rheumatic diseases / collagen - vascular diseases).\n- تيبس مفاصل العمود الفقري المصحوبة بتغييرات عصبية شديدة (Stiffness of the spine with neurological changes).\n- نكروز العظام - التهاب العظام المزمن (Bone necrosis , chronic osteomyelitis).\n- تشوهات الجهاز الحركي والعمود الفقري (Abnormalities of the spine & locomotor system).\n- أمراض العضلات الوراثية والخلقية (Hereditary & congenital myopathies).\nتاسعاً : أمراض الجهاز العصبي المزمنة وتشمل (Chronic Neurological Diseases):\n- أورام المخ (Brain tumors).\n- الصرع بأنواعه (All types of epilepsy).\n- الشلل العضوي بالأطراف (Organic neuropathy).\nعاشراً : أمراض الجهاز التنفسي المزمنة (Chronic Chest Diseases):\n- تمدد الشعب الهوائية المصحوبة بمضاعفات (Complicated bronchiectasis).\n- تكيسات الرئة (Lung cysts).\n- الخراج الرئوي إلى أن يشفى (Lung abscess till cure).\n- الأمفيزيما (Emphysema).\n- الانسكاب البلوري بجميع أنواعه إلى أن يشفى (All types of pleural effusions till cure).\n- الربو الشعبي (مضافة بقرار وزير الصحة رقم 89 لسنة 96) (Bronchial asthma).\nحادي عشر : أمراض الغدد الصماء والتمثيل الغذائي (Endocrine & metabolic Diseases):\n- أمراض الغدد الصماء المزمنة (Chronic endocrine diseases).\n- أمراض البول السكري ومضاعفاته (Diabetes mellitus & its complications).\n- داء الفيل (Elephantiasis).\n- أمراض التمثيل الغذائي (Metabolic diseases).\n- البهاق (مضافة بقرار وزير الصحة رقم 89 لسنة 96) (Leukoderma).\nثاني عشر : الأمراض الجلدية المزمنة (Chronic Skin Diseases):\n- الإكزيما المزمنة المنتشرة لأسباب مختلفة (Different types of generalized eczema).\n- مرض الحزاز البسيط (البنفسج) (Lichen planus).\n- الصدفية (Psoriasis).\n- مرض البمفيجوس (داء الفقاعات) (Pemphigus).\nثالث عشر : أمراض العيون المزمنة (Chronic Ophthalmic Diseases):\n- كاتاركت إلى أن يشفى (Cataract till cure).\n- أمراض تحلل الشبكية المزمنة (قصر النظر) (Chronic progressive Myopia).\n- انشطار أو انفصال الشبكية إلى أن يشفى (Retinal detachment till cure).\n- الالتهاب القزحي أو الهدبي أو المشيمي المزمن (Iritis, Iridocyclitis , ophthalmitis).\n- الجلوكوما المزمنة (Chronic Glaucoma).\n- أمراض العصب البصري المزمن (Chronic Optic nerve disease).\n- التهاب أو تورم العصب البصري (Optic neuritis & edema).\n- القرح المزمنة بالقرنية إلى أن تشفى (Chronic coronial ulcers till cure).\n- التهاب الشبكية والارتشافات والأنزفة الداخلية (Retinitis & retinal hemorrhage).\n- الضمور الشبكي التلوني (Retinitis pigmentosa).\nرابع عشر : الجذام (Leprosy).\nخامس عشر : الإصابات الشديدة ومضاعفات العمليات الجراحية التي تتطلب علاجاً طويلاً خارج المستشفى (أكثر من شهر) إلى أن يشفى (Sever complicated trauma or surgical operations that need long treatment (more than one month) till cure).\nسادس عشر : الحميات الشديدة المصحوبة بمضاعفات إلى أن يشفى (Prolonged sever fevers associated with complications till cure).", "إرشادات عامة للصيادلة\n\n* صرف الدواء\nيتم الصرف من أحد الجهات الآتية:\n- الصيدليات المملوكة للهيئة.\n- الصيدليات المتعاقدة في حالة عدم توفر الدواء أو بدائله في صيدليات الهيئة.\n\nفي حالة عدم توفر الأدوية بالصيدلية يتم إتباع الإجراءات الآتية:\nيقوم الصيدلي بكتابة البدائل المتاحة من نفس المجموعة الدوائية على ظهر التذكرة، ليعود بها المنتفع للطبيب محرر التذكرة (المتواجد بنفس مقر العيادة) لاختيار المناسب للحالة وتعديل التذكرة والتوقيع (ولا بد من توضيح البديل المصروف على التذكرة).\n\nفي حالة عدم توفر بديل مناسب أو رفض الطبيب البدائل المتاحة:\n- توضع دائرة حول الدواء الذي لم يصرف.\n- تحرير الدواء الناقص على تذكرة (صرف من صيدليات خارج الهيئة).\n- يؤشر بخط واضح تماماً برقم وتاريخ كلاً منهما على الأخرى مع إيضاح كافة البيانات الخاصة باسم الطبيب محرر التذكرة الأصلية وتخصصه.\n- إرفاق صورة من التذكرة المستخرجة بالتذكرة الأصلية.\n- توقيع الصيدلي محرر التذكرة في المكان المخصص للتوقيع وكذلك وضع الأكلاشيه الخاص باسمه.\n\n* يقوم شطب الصيدلية يومياً بمراجعة جميع صور التذاكر المستخرجة بمعرفة الصيدلية والتحقق من صحتها بمراجعة التذكرة الأصلية والتأشير على صور كعب الدفتر بما يفيد المطابقة. ويعتبر الإخلال بهذه المراجعة من قبيل الإهمال الذي يستوجب المساءلة وإذا ثبت وجود أخطاء فيعتبر المسئول عن الشطب مشاركاً في المخالفة (لا يتم إعادة كعب هذه التذاكر للمخزن قبل مراجعتها والتأشير بما يفيد ذلك بمعرفة الشطب).\n\n- يمكن للمنتفع صرف التذكرة المستخرجة من أي صيدلية مملوكة داخل نطاق الفرع أو من أي صيدلية متعاقدة داخل النطاق الجغرافي الذي يحدده الفرع.\n- إذا لم يتوفر الدواء بـ 3 صيدليات متعاقدة (ويثبت ذلك بأختامها خلف التذكرة) فإنه يجوز:\n- للمنتفع شراءه من أي صيدلية خارجية.\n- ويتقدم لصيدلية العيادة التابع لها (خلال مدة استخدام الدواء) ومعه أصل التذكرة الخارجية + أصل الفاتورة + جميع علب الدواء.\n- تقوم الصيدلية بمراجعة الدواء على التذكرة والفاتورة والتأكد من صلاحية الدواء وختم جميع العلب بخاتم الصيدلية وتدون إقرار على الفاتورة بالآتي: (روجع والأدوية مطابقة للتذكرة ومسعرة جبرياً وصالحة للاستخدام) مع توقيع مدير الصيدلية والأكلاشيه الخاص به.", "تسعير التذكرة لتحديد المبلغ الذي يتحمله المنتفع، والتأكد من تحصيل القيمة:\n- (لا يتم تحصيل أي رسوم مقابل صرف الدواء لجميع منتفعي التأمين الصحي ما عدا الحالات غير المزمنة لطلاب المدارس والرضع فيتم سداد ثلث قيمة العلاج الجبرية دون حد أقصى).\n- استيفاء بيانات الجزء السفلي من التذكرة من واقع بيانات بطاقة التأمين الصحي.\n- ختم الدواء وتسليمه للمنتفع (أدوية تأمين صحي محظور بيعها) وختم التذكرة (تم الصرف) ويراعى وضوح الأختام. علماً بأن عدم ختم الأدوية أو عدم وضوحه يعرض الصيدلي للمساءلة.\n\n* العمل على تقديم أعلى خدمة صيدلية ممكنة من خلال:\nتوعية المرضى (Patient Education) بالمعلومات الآتية:\n- شرح طريقة الاستعمال والجرعات وحسن تغليف الدواء.\n- معلومات عن المرض.\n- معلومات عن الدواء وتشمل:\n1. تفاعلات الأدوية مع بعضها البعض (Drug – Drug Interactions).\n2. تفاعلات الأدوية مع الغذاء (Drug – Food Interactions).\n3. الآثار الجانبية المحتمل حدوثها (Side Effects).\n4. الجرعات المستخدمة من الدواء وطريقة استخدامه.\n5. التغيرات الطبيعية التي تصاحب استخدام بعض الأدوية مثل (تغير لون البول - غثيان.. إلخ).\n- الرد على استفسارات المرضى.\n\nتعليمات هامة:\n- تقرب الكميات المنصرفة لأقرب وحدة (أي حذف ما يقل عن نصف العبوة أو الشريط واستكمال نصف العبوة أو أكثر لعبوة كاملة) ويؤشر بذلك في البطاقة.\n- الأقراص المتوفرة في شكل عبوات كبيرة (لعلاج الأمراض المزمنة مثل النوكسين 100 قرص) وتزيد عن احتياج المنتفع تصرف عبوات كاملة ويؤشر بذلك في البطاقة (مع ختم الصيدلية) ليتم مراعاة ذلك طوال مدة توافر العلاج.\n- يقوم الصيدلي بعمل قائمة أسبوعية بالأصناف المتوفرة بالصيدلية بالاسم العلمي المكتوب على العبوة وكذلك بيان بالأدوية الموجودة بكميات غير كافية لعدم كتابة علاج شهري منها بينما يكتب علاج أسبوع لحين توفير العلاج ويتم تعميمها على الأطباء.", "في جميع حالات التكرار لا بد من ملاحظة الآتي:\n\n- أن يوضح القائم بالتكرار: التشخيص كاملاً باللغة الإنجليزية وبدون اختصار أو رموز، ثم عبارة: تكرار (رقم التكرار) علاج د/ (اسم الطبيب الموصي بالتكرار) أخصائي/ استشاري (تخصصه) بالتوصية صـ (رقم الصفحة) بالبطاقة العلاجية (ورقم التذكرة المحررة أول مرة) بتاريخ......... ويوقع القائم بالتكرار بجوارها وترفق بها صورة تذكرة الأخصائي أو الاستشاري.\n- التأكد من عدم مرور المدة المحددة لإعادة العرض طبقاً لمدة أو عدد مرات التكرار الموصى بها.\n- التأكد من عدم تأخر المريض عن موعد التكرار ويمكن التجاوز عن تأخير 10 أيام بحد أقصى على تاريخ التوصية للأمراض المزمنة في ظروف حضور المنتفع بعد إجازة رسمية طويلة لتعطل العمل خلالها بعيادات الهيئة أو ظروف خاصة لدى المنتفع منعته من الحضور (التأشير بالتاريخ الجديد بالبطاقة لمراعاته المرة التالية)، أما إذا تجاوز التأخير 10 أيام فلا بد من إعادة العرض لإعادة تقييم الحالة وتقرير ما يلزم.\n- التأكد من نفاذ العلاج المنصرف في الدفعة السابقة فقد تصرف عبوة 100 قرص بينما اللازم 30 قرصاً فلا يكرر، والتعليمات للصيدلي بإيضاح العبوة المنصرفة في البطاقة مع ختم الصيدلية لتنبيه الطبيب عند التكرار التالي.\n- يراعى الدقة في تنفيذ تأشيرة التكرار فقد يكون المطلوب تكرار أصناف معينة دون أخرى.\nلا يجوز تكرار علاج لمدة أو بجرعة تخالف تعليمات صرف العلاج السابق ذكرها. ويعرض الأمر على مدير العيادة لمراجعة الطبيب الموصي أو التوجيه بما يلزم.", "حالات عدم صلاحية التذكرة الطبية للصرف:\n\n- عدم وجود خاتم شعار الجمهورية.\n- عدم وجود رقم التذكرة المسلسل أو رقم المجموعة.\n- عدم وجود أكلاشيه باسم الطبيب وتخصصه (أو كتابته بشكل واضح).\n- عدم وجود توقيع الطبيب بنهاية التذكرة أو بجوار أي تأشيرات أو تعديلات.\n- تحرير تذكرة على نموذج مخالف للنموذج الصحيح طبقاً للقانون الخاضع له المنتفع.\n- تحرير تذكرة بتشخيص غير مزمن على النموذج الخاص بالأمراض المزمنة.\n- وصف أدوية غير مصرح بها (خارج سلطة الوصف) مع مراعاة القواعد الموضحة بالدليل.\n- وصف أو تكرار علاج شهري لغير الأمراض المزمنة المنصوص عنها تحديداً.\n- عدم وجود تشخيص أو كتابته بخلاف التعليمات المنظمة.\n- استخدام القلم الرصاص.\n- عدم وجود البطاقة التأمينية أو الكارنيه.\n- عدم وجود اسم المنتفع أو الرقم التأميني (أو عدم تطابق اسم المنتفع كليةً بين التذكرة والبطاقة).\n- انتهاء المدة المقررة لصرف التذكرة (ثلاثة أيام خلاف يوم تحريرها بما في ذلك العلاج الشهري).\n- انتهاء المدة المقررة لتكرار العلاج للأمراض المزمنة.\n- تصويب تاريخ الكشف بغير الطريقة الصحيحة.\n- تحرير تذكرة لتكرار علاج الأخصائي أو الاستشاري مع عدم كتابة بيانات التكرار.\n- وجود كشط أو تلاعب في الأصناف أو الجرعات أو عدد العبوات مع عدم توقيع الطبيب بجانبها (لا يمكن استبدال التوقيع بالأكلاشيه حيث لا يوضع الأكلاشيه بالتذكرة سوى مرة واحدة وفي مكانه).\n- أن يتقدم لصرف التذكرة شخص لا يجوز له ذلك طبقاً لقواعد الصرف.\n- تقديم تذكرة داخلية لا تصرف إلا من الصيدليات المملوكة للهيئة للصرف من الصيدليات المتعاقدة مع عدم وجود تعليمات بصرفها.", "الأخطاء الممكن حدوثها من بعض الأطباء والصيادلة وما يتبع حيالها من المراجعة الفنية\n\nأولاً : - الأخطاء المتعلقة بنوع التذكرة\n\n1- المخالفة: تحرير تذكرة لمنتفع مخالفة للقانون التابع له.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): يحصل الحد الأقصى لما يجب أن يسدده المنتفع مناصفة بين الطبيب والصيدلي.\n\n2- المخالفة: تحرير تذكرة طلاب بتشخيص مرض غير مزمن على النموذج المجاني الخاص بالأمراض المزمنة للطلبة.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): يخصم المبلغ الواجب سداده للهيئة كذلك فرق مدة العلاج إذا تم وصفه لمدة شهر على الطبيب فقط.\n\n3- المخالفة: تحرير تذكرة على دفتر تذاكر يخص طبيب آخر.\n- تعليمات للصيدلي: تصرف.\n- الغرامة الموقعة (الصرف بالخطأ): يتم إجراء التحقيق الإداري واتخاذ ما يلزم.\n\nثانياً : الأخطاء والمخالفات المتعلقة بنقص بيانات التذكرة:\n\n4- المخالفة: تحرير وصرف التذكرة مع عدم وجود رقم المجموعة أو الرقم المسلسل المطبوع على التذكرة وعدم كتابته بمعرفة الطبيب والتوقيع.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n5- المخالفة: عدم وجود أكلاشيه باسم الطبيب وتخصصه أو عدم كتابة اسمه واضحاً على التذكرة.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n6- المخالفة: تحرير التذكرة سهواً بدون تدوين أحد هذه البيانات (اسم العيادة / جهة العمل / تاريخ الكشف أو كتابته بأكلاشيه).\n- تعليمات للصيدلي: تصرف بعد التحقق من صحة التذكرة بالاطلاع على البطاقة العلاجية ويدون الصيدلي البيان الناقص بالجزء السفلي بالتذكرة بالإضافة للبيانات الخاصة به ويترك الجزء العلوي كما هو.\n- الغرامة الموقعة (الصرف بالخطأ): تحصل غرامة 25 قرش من الطبيب عن كل بند ناقص.\n\n7- المخالفة: تحرير التذكرة بدون اسم المنتفع أو رقم التأمين الصحي.\n- تعليمات للصيدلي: عدم الصرف وتعاد لمحرر التذكرة للاستيفاء.\n- الغرامة الموقعة (الصرف بالخطأ): تحصل القيمة مناصفة بين الطبيب والصيدلي.\n\n8- المخالفة: تحرير وصرف التذكرة مع عدم وجود ختم شعار الجمهورية.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n9- المخالفة: تحرير تذكرة بدون كتابة التشخيص (أو كتابته بخلاف التعليمات المنظمة).\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n10- المخالفة: تحرير تذكرة بدون توقيع الطبيب (لا يجوز استخدام الأكلاشيه في مكان التوقيع كبديل عنه).\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n11- المخالفة: تحرير تذكرة مع عدم كتابة طريقة الاستعمال والجرعة اليومية ومدة الاستعمال.\n- تعليمات للصيدلي: تصرف بما يكفي علاج أربعة أيام للممارس وسبعة أيام للأخصائي والاستشاري.\n- الغرامة الموقعة (الصرف بالخطأ): تحصيل غرامة 50 قرش من الطبيب محرر التذكرة.\n\n12- المخالفة: تحرير تذكرة مع عدم كتابة التركيز أو العبوة.\n- تعليمات للصيدلي: تصرف بأقل تركيز وأقل عبوة.\n- الغرامة الموقعة (الصرف بالخطأ): تحصيل غرامة 50 قرش من الطبيب محرر التذكرة.\n\n13- المخالفة: تحرير تذكرة مع عدم توضيح عدد العبوات من الأصناف مثل (المراهم / الغسول / النقط...).\n- تعليمات للصيدلي: صرف عبوة واحدة فقط.\n- الغرامة الموقعة (الصرف بالخطأ): ---------\n\n14- المخالفة: تحرير تذكرة مع عدم تفقيط إجمالي عدد الأصناف كتابة.\n- تعليمات للصيدلي: تصرف إذا تم التأكد من عدم وجود أصناف مضافة، وفي حالة اكتشاف أصناف مضافة.\n- الغرامة الموقعة (الصرف بالخطأ): تحصيل غرامة 50 قرش من الطبيب، خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.", "ثالثاً -: الأخطاء والمخالفات المتعلقة بتحرير بيانات أو تعديلها بأسلوب خطأ أو مخالف لتعليمات الهيئة\n\n15- المخالفة: استخدام القلم الرصاص في تحرير التذكرة.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة مناصفة بين الطبيب والصيدلي.\n\n16- المخالفة: تحرير تذكرة بدون استخدام كربون بوجهين أو ثني ورقة الكربون.\n- تعليمات للصيدلي: تصرف بعد التحقق من عدم وجود تلاعب بها.\n- الغرامة الموقعة (الصرف بالخطأ): يحصل 25 قرش غرامة من الطبيب.\n\n17- المخالفة: تحرير تذكرة بها أدوية خارج سلطة الوصف للطبيب.\n- تعليمات للصيدلي: يصرف المثيل المناسب من الدليل طبقاً لسلطة الوصف، وإن لم يوجد مثيل تعاد التذكرة لمحررها، في حالة الصرف بالخطأ.\n- الغرامة الموقعة (الصرف بالخطأ): تحصيل غرامة 50 قرش على الطبيب، خصم قيمة الأدوية المخالفة مناصفة بين الطبيب والصيدلي.\n\n18- المخالفة: وصف أدوية بكميات تزيد عن التعليمات.\n- تعليمات للصيدلي: تصرف بكميات حسب التعليمات، في حال الصرف بالخطأ.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة الكميات الزائدة مناصفة بين الطبيب والصيدلي.\n\n19- المخالفة: تحرير تذكرة بها تصويب في تاريخ الكشف.\n- تعليمات للصيدلي: إذا كان التصويب بالطريقة الصحيحة وهي شطب التاريخ كاملاً وإعادة كتابته من جديد كاملاً مع التوقيع فإنه يمكن صرف التذكرة، أما إذا كان التصويب بأية طريقة أخرى فلا يجوز الصرف، في حالة الصرف بالخطأ.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة على الصيدلي فقط (حيث يحتمل التعديل بمعرفة المنتفع).\n\n20- المخالفة: وصف أو تكرار علاج شهري للكبار لغير الأمراض المزمنة المنصوص عنها تحديداً.\n- تعليمات للصيدلي: تعاد للطبيب لتصويب مدة العلاج.\n- الغرامة الموقعة (الصرف بالخطأ): في حالة الوصف لأول مرة يخصم ما يزيد عن علاج أسبوع مناصفة بين الطبيب والصيدلي، وفي حالة التكرار تخصم القيمة بالكامل مناصفة بين الطبيب محرر التذكرة والصيدلي.\n\n21- المخالفة: وصف أكثر من دواء واحد من مجموعات (الأدوية المسكنة وخافضات الحرارة / أدوية علاج الروماتيزم / موسعات الأوعية الدموية الطرفية والمركزية / الأدوية الباسطة للعضلات الإرادية / مجموعة الأدوية المعالجة للدوالي / مجموعة الأدوية المعالجة لارتفاع الكوليسترول).\n- تعليمات للصيدلي: يصرف دواء واحد من كل مجموعة وفي شكل دوائي واحد.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة الأصناف الزائدة مناصفة بين الطبيب والصيدلي.", "رابعاً -: الأخطاء والمخالفات المتعلقة بإجراءات صرف التذكرة\n\n22- المخالفة: تقديم التذكرة للصرف بعد الموعد المحدد لصلاحيتها.\n- تعليمات للصيدلي: عدم الصرف.\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة على الصيدلي.\n\n23- المخالفة: ضبط التذكرة أثناء التفتيش بالصيدلية بعد مغادرة المنتفع أو بالمراجعة الفنية بدون توقيع بالاستلام أو بدون تدوين السعر.\n- تعليمات للصيدلي: ---------\n- الغرامة الموقعة (الصرف بالخطأ): خصم قيمة التذكرة بالكامل في الصيدليات المتعاقدة.\n\n24- المخالفة: ضبط التذكرة أثناء التفتيش بالصيدلية بعد مغادرة المنتفع أو بالمراجعة الفنية بدون استيفاء أحد أو كل البيانات التالية (تاريخ الاستلام – اسم المستلم – رقم التأمين الصحي للمنتفع بالكامل – رقم بطاقة الرقم القومي للمستلم – ختم الصيدلية الصارفة – توقيع الصيدلي).\n- تعليمات للصيدلي: ---------\n- الغرامة الموقعة (الصرف بالخطأ): خصم غرامة 25 قرش على الصيدلي لكل بيان غير مستوفٍ.\n\n25- المخالفة: تعديل السعر بعد صرف الدواء، بدون اتباع القواعد الصحيحة لتعديله في حضور المنتفع وهي شطبه كاملاً وإعادة كتابته من جديد مع ذكر سبب التعديل وتوقيع المستلم والصيدلي.\n- تعليمات للصيدلي: ---------\n- الغرامة الموقعة (الصرف بالخطأ): إلغاء السعر المعدل.\n\nخامساً-: الأخطاء والمخالفات المتعلقة بصور التذاكر\n\n26- المخالفة: اكتشاف تذاكر بيضاء بدون إلغاء بمعرفة المراجعة الفنية الطبية ضمن الكعب المرتجع (لا يدخل فيها باقي الدفتر الذي لم يستخدم لسبب ما) عند مراجعة الكعوب.\n- تعليمات للصيدلي: ---------\n- الغرامة الموقعة (الصرف بالخطأ): غرامة عشرة جنيهات عن كل تذكرة على الطبيب صاحب عهدة الدفتر.\n\n27- المخالفة: وجود عجز في عدد الصور بالكعب أو وجود صور غير مدون عليها أية بيانات.\n- تعليمات للصيدلي: ---------\n- الغرامة الموقعة (الصرف بالخطأ): تخصم غرامة على الطبيب صاحب عهدة الدفتر بواقع سعر أعلى متوسط لتكلفة التذكرة لنفس الطبيب خلال العام السابق للفقد.", "إرشادات عامة للصيدليات المتعاقدة\n\nتلتزم الصيدلية المتعاقدة بالآتي:\n1. تعلن الصيدلية المتعاقدة عن الخدمة التي تؤديها وعليه يجب وجود لافتة مناسبة على واجهة الصيدلية من الخارج بعبارة (تأمين صحي).\n2. بصفة عامة فإن التعاقد مع الهيئة يتيح للصيدلية صرف كافة أنواع التذاكر الصالحة للصرف الخارجي مع مراعاة النطاق الجغرافي الذي يحدده كل فرع ويستثنى من ذلك:\n- الصيدليات المتعاقدة بالقرى غير الموجود بها عيادة تأمين صحي للكبار فهذه لا يسمح لها إلا بصرف تذاكر الطلبة والمواليد فقط.\n- في بعض البلاد التي يقل فيها صرف نوع معين من التذاكر، فللفرع تحديد صيدلية واحدة أو أكثر لصرف هذا النوع من التذاكر، مع إخطار باقي الصيدليات بذلك.\n3. من الالتزامات الجوهرية حسن معاملة المنتفعين وحسن أداء الخدمة وعدم تفضيل المريض الذي يدفع نقداً، ويعتبر عدم صرف أدوية للمنتفعين لو ثبت وجودها بالصيدلية في نفس الوقت مخالفة صريحة للعقد.\n4. في حساب السعر يتم كتابة السعر لكسور العبوة بالجنيه وكسوره كذلك المجموع، أما عند حساب الثلث الواجب سداده من المنتفع فيتم رفعه لأقرب كسر من الجنيه.\n5. يراعى تقريب الكميات المنصرفة إلى أقرب شريط أو عبوة فإذا كانت الكمية المقررة 12 كبسولة والشريط 10 فقط يصرف شريط واحد أما إذا كانت الكمية المقررة 15 كبسولة فيصرف شريطان × 10، أما عبوات الأقراص غير المعبأة كشرائط فلا يجوز فتحها.\nوإذا ما وصف الطبيب علبة أقراص غير معبأة في شرائط (تزيد العبوة فيها عن احتياج المنتفع كأن تكون 100 قرص والجرعة قرص يومياً لمدة شهر مثل النوكسين – ماريفان ....) فإن الصيدلي يسجل ببطاقة المنتفع أنه تم صرف عبوة بعدد .... قرص بتاريخ .... مع ختم الصيدلية حتى يراعى الطبيب ذلك عند التكرار.\nوبالنسبة للأمبولات فإنه عدا الأصناف التي لا يسهل صرفها فرط وغير شائعة الصرف فيتم التقريب إلى أصغر عبوة.\n6. يجب أن تكون التذاكر المنصرفة موجودة بالصيدلية باستمرار وبشكل يسهل للمفتش الصيدلي الاطلاع عليها، أما في الحالات التي تقوم بعض الصيدليات بإرسال تذاكرها لأحد المحاسبين فيجب أن تتواجد باستمرار الدفعات التي تم تسجيلها ويكون في الإمكان إحضار الباقي أثناء وجود المفتش.\n7. كما تلتزم الصيدلية بالحصول على الأدوية من مصادرها القانونية، وأن تحتفظ بفواتير الشراء لمدة خمس سنوات طبقاً لقانون مزاولة مهنة الصيدلة حيث يحتاج الأمر أحياناً تأكيد حصول الصيدلية على ما تم صرفه للمنتفعين من كميات كبيرة من بعض الأصناف وحتى لا يكون العجز عن تقديم ما يثبت شراء هذه الكميات الكبيرة مبرراً للشك في سلامة وجدية الصرف وبالتالي عدم تجديد التعاقد.", "8. يلزم تدوين البدائل المنصرفة وكذلك السعر نقلاً من العبوة لكل صنف أمام المنتفع وقبل توقيعه بالاستلام وبالتالي لا يجوز إجراء أي تعديل في السعر بعد مغادرة المنتفع للصيدلية (حتى ولو حدث خطأ في الصرف بصرف دواء مخالف أو كمية أو تركيز مخالف طالما غادر المنتفع الصيدلية ولكن في الحالات التي حدث بها خطأ في الصرف مثل صرف علبة بدلاً من علبتين أو صرف تركيز مخالف... وعاد المنتفع للصيدلية لتصحيح الخطأ أو أمكن الاتصال به وحضر، هنا فقط يمكن شطب السعر بالكامل وكتابة السعر الصحيح أعلاه وكتابة سبب التصحيح ويوقع المنتفع والصيدلي، وأي تصويب للسعر بدون الالتزام بما سبق مثل استخدام المزيل أو تكرار الكتابة فوق السابق يعرض الصيدلية لإلغاء هذا السعر المعدل).\n9. إذا لم يتم كتابة السعر لصنف واحد أو أكثر وسواء تم ضبط ذلك أثناء التفتيش بعد توقيع المستلم، أو في المراجعة الفنية، فستعتبر الهيئة أن الدواء لم يصرف ولن تتم المحاسبة عليه ولا يقبل أي عذر بعدم معرفة السعر.\nأما إذا تم كتابة سعر مخالف فستقوم الهيئة بإتباع ما يلي:\n- تصويب السعر إذا كان مدوناً في خانات خطأ (بالقروش وليس الجنيهات).\n- تصويب السعر إذا كان المدون هو سعر الصنف قبل آخر تعديل.\n- اعتماد السعر إذا كان يماثل سعر مثيل أو بديل أرخص (مطابق لتعليمات صرف البدائل) ولم يؤشر به. أما إذا كان السعر لمثيل أو لبديل أغلى لم يؤشر به بالتذكرة فسيتم تعديل السعر للدواء الأصلي.\n- اعتماد السعر إذا كان يمثل كمية أو تركيز أقل من نفس الدواء كصرف علبة بدلاً من إثنين أو 250 مجم بدلاً من 500 مجم، مع توجيه إنذار للصيدلية لعدم تكرار الخطأ.\n- شطب السعر المدون تماماً في غير الأحوال السابقة حيث سيعتبر أن الدواء المنصرف دواء مخالف.\n10. يحظر الاحتفاظ بأدوية داخل الصيدلية عليها خاتم التأمين الصحي لنفس الصيدلية أو لصيدليات أخرى لأي سبب ويعتبر ذلك مخالفة تعاقدية وجنائية ينطبق عليها القانون 10 لسنة 67، كما أن تواجد عبوات عليها آثار محو أختام في الصيدلية من المخالفات التي تبرر عدم تجديد التعاقد، كما يعتبر تواجد أدوية عليها أختام وزارة الصحة أو هيئات أو شركات لها نظم علاجية من المخالفات التي تبرر إخطار وزارة الصحة لعمل المحضر اللازم وكذلك تبرر عدم تجديد التعاقد مع الصيدلية.\n11. لا يسمح بصرف أدوية عن طريق مندوبين من الشركات أو الهيئات إلا في بعض الحالات للهيئات والشركات البعيدة عن العمران، وبتصديق كتابي من مدير الفرع المختص بناء على عرض مدير إدارة التموين الطبي والصيدليات. ويراعى أن يتم توقيع صاحب التذكرة سلفاً بالاستلام وترسل التذكرة مرفقاً بها البطاقة العلاجية مع المندوب الذي يوقع أيضاً بالصيدلية بما يفيد استلامه للعلاج.\n12. إذا قامت الشركة المنتجة لدواء مدرج بالدليل بتغيير السعر أو العبوة (مع إلغاء العبوة الأولى) يستمر وصف الدواء طبقاً لنفس القواعد أما إذا تغير الاسم نفسه فيعتبر دواء جديد ويتم عرضه على لجنة الدواء للنظر في إضافته إلى الدليل من عدمه.", "13. إذا توافر دواء بالسوق بنفس التركيب والعبوة والتركيز لدواء بالدليل وكان سعره يقل أو يماثل المثيل بالدليل يتم العرض على الإدارة المركزية للتموين الطبي والصيدليات لاتخاذ إجراءات إدراجه بالدليل.\n14. في حالة وصف أدوية مؤثرة على الحالة النفسية والخاضعة لقرار وزير الصحة رقم 487 وتعديلاته، والتي يلزم احتفاظ الصيدلية بالتذكرة، فإنه يتم صرف التذكرة وإرسالها مع صورة ضوئية للعيادة، حيث يتم اعتماد وختم الصورة، والتأشير على الأصل بما يفيد تسليم الصيدلية صورة وتحتفظ الصيدلية بالصورة مستنداً للتفتيش بمعرفة وزارة الصحة.\n15. يلتزم صاحب الصيدلية المتعاقد مع الهيئة بإخطار الهيئة عن أي تصرف في الملكية بالمشاركة أو بالبيع.\n16. لا يجوز للمنتفع التنازل عن دواء أو جزء من الكمية، مقابل إعفائه من سداد النسبة المقررة ويعتبر هذا التصرف من الصيدلية مخالفة، وليس هناك ما يمنع إذا قرر المنتفع استغناءه عن صنف ما لوجوده طرفه، وأن يتم التأشير على الصنف (مستغنى عنه) مع توقيع المنتفع وبالطبع لن يحتسب سعره.\n17. يصرح للصيدلي بصرف الماء المقطر اللازم للحقن ومعلقات المضاد الحيوي، ويتم تحضير المعلق داخل الصيدلية بمعرفة الصيدلي ولا يترك ذلك لولي أمر الطالب أو المولود ويضاف سعر الماء المقطر كبند مستقل ولا يحتسب ضمن عدد الأصناف المصرح بوصفها.\n\nثالثاً : خطوات تقديم المطالبة الشهرية\n- يراعى فصل تذاكر كل قانون على حدة حيث يقدم لكل قانون مطالبة منفصلة طبقاً للخطوات التالية:\n- يتم فصل تذاكر كل طبيب على حدة (سواء ممارس أو أخصائي أو استشاري) علماً بأن تذاكر التكرار يتم إضافتها طبقاً للطبيب محرر تذكرة التكرار.\n- يتم ترتيب مجموعة تذاكر كل طبيب على حدة طبقاً لتاريخ صرف التذكرة تصاعدياً (وليس تاريخ تحريرها) من 1 إلى نهاية العدد وتوضع كل مجموعة من 50 تذكرة في دوسيه مستقل.\nويراعى تخريم التذاكر من المكان المخصص لذلك يسار التذكرة، وتثبيتها جيداً، وبحيث لا تحجب أية بيانات، ويدون على كل ملف بخط واضح (اسم الصيدلية / البلد / العنوان / الرقم الكودي / اسم صاحب الصيدلية / نوع المطالبة أي القانون المنصرف بموجبه التذاكر / نوع التذاكر (ممارس – أخصائي – استشاري) – المدة المقدم عنها المطالبة / عدد التذاكر بكل دوسيه وأرقامها من .... إلى ....).\n- تقوم كل صيدلية بطبع دفاتر فواتير خاصة بها من أصل وصورتين، ويدون على الفواتير اسم الصيدلية والبلد أو الحي – عنوانها بالكامل – اسم صاحبها المتعاقد ثلاثياً – الرقم الكودي للصيدلية – رقم مسلسل الفواتير – نوع المطالبة - نوع التذاكر - الفترة المقدم عنها الحساب.", "وتقسم الفاتورة إلى الخانات الرأسية التالية:\n- مسلسل (رقم المسلسل للتذكرة الموضوع بمعرفة الصيدلية).\n- اسم المنتفع أو الطالب أو المولود.\n- الرقم التأميني للمنتفع أو الطالب أو المولود.\n- رقم التذكرة المسلسل المطبوع عليها.\n- تاريخ تحرير التذكرة.\n- إجمالي قيمة الأدوية.\n- المبلغ المسدد.\n- الباقي.\n- اسم وتخصص الطبيب.\n\nوفي نهاية الفاتورة يتم جمع الخانات الحسابية رأسياً وتوقيع صاحب الصيدلية وختم الصيدلية ويراعى عدم ترحيل إجمالي الفاتورة وإنما تستقل كل فاتورة بمجموعها لتسهيل إجراء التصويب عند المراجعة.\nيتم حصر إجمالي المطالبة لتذاكر الممارس / الأخصائي / الاستشاري على نموذج تفريغ للفواتير كالتالي (من أصل وصورتين):\nصيدلية: ........................... لصاحبها: ...........................\nفاتورة إجمالية لتذاكر (الممارس / الأخصائي / الاستشاري) قانون (.......) عن الفترة من ......... إلى .........\n\n[جدول الفواتير يشتمل على الأعمدة التالية: رقم الفاتورة | إجمالي (قرش/جنيه) | المسدد من المنتفع (قرش/جنيه) | الباقي (قرش/جنيه)]\n\nتوقيع صاحب الصيدلية: ................... ختم الصيدلية: ...................\n\nومن الطبيعي في حالة وجود فاتورة واحدة فقط، لا داعي لعمل النموذج مع مراعاة أي تعليمات تفصيلية صادرة عن الفروع بخصوص تحرير المطالبات.\nمع فصل تذاكر المزمن المجاني للطلاب عن تذاكر الأخصائي غير المزمن.", "ثم عمل كشف مطالبة نهائي من أصل وصورتين على النموذج كالتالي:\nاسم الصيدلية: ......... عنوانها: ......... الرقم الكودي: ......... اسم صاحبها ثلاثياً: .........\nالمطلوب من الهيئة العامة للتأمين الصحي فرع: .........\nعن الفترة من ......... إلى ......... قانون (......)\n\n[جدول المطالبة النهائية يشتمل على الأعمدة التالية: النوع (ممارس/أخصائي/استشاري/الإجمالي) | عدد التذاكر | عدد الفواتير | عدد الدوسيهات | الإجمالي (ق/ج) | المسدد (ق/ج) | الباقي (ق/ج)]\n\nفقط مبلغ وقدره ........................................ لا غير\n\n- توضع الفواتير والكشوف والمطالبة النهائية في ملف مستقل وتسلم المطالبة للفرع المختص ويكرر ما سبق لكل قانون، حيث يسلم لكل قانون على حدة:\n- ملف أو أكثر بها تذاكر الممارس.\n- ملف أو أكثر بها تذاكر الأخصائي وتكرار علاج الأخصائي.\n- ملف أو أكثر بها تذاكر الاستشاري وتكرار علاج الاستشاري.\n- ملف واحد أو أكثر به كشوف التفريغ والفواتير والمطالبة النهائية.\n\nيتم التسليم في المواعيد المحددة لكل صيدلية وحتى خمسة أيام على الأكثر:\n- يوم 1 من كل شهر للدفعة (أ).\n- يوم 10 من كل شهر للدفعة (ب).\n- يوم 20 من كل شهر للدفعة (ج).\nأو أي مواعيد أخرى يحددها الفرع المختص.\n\nويتم التسليم للموظف المختص بالهيئة، مقابل التوقيع على صورة المطالبة النهائية بالاستلام تحت المراجعة وتحتفظ الصيدلية بهذه الصورة وذلك بالإضافة لصورة من الفواتير والكشوف السابقة حتى ورود الشيك.\n\nوعلى الصيدلية المتعاقدة المطالبة شهرياً عند تسليم المطالبات ببيانات المخالفات عن المطالبات السابقة لمعرفة الأخطاء وتفاديها حتى لا تتكرر.", "أحكام عامة\n\n1. مصرح للفروع في بعض الحالات (مثل إغلاق صيدليات الهيئة للجرد أو لسبب مفاجئ – تواجد بعض عيادات الشركات بعيدة عن مقار الصيدليات المملوكة – عدم توافر الأدوية بصيدليات الهيئة) بوضع قواعد محددة بشكل مؤقت أو دائم لما يسمح بصرفه من الصيدليات المتعاقدة سواء طبقاً لنوع التذكرة أو جهة تحريرها أو بموجب أختام خاصة خلف التذكرة مع توقيع المسئول، ولا يتم تنفيذ هذه التعليمات إلا إذا تم إخطار الصيدليات المتعاقدة كتابةً وكذلك إخطار مكاتب المراجعة الفنية المختصة وإدارة المنطقة بهذه التعليمات وبتعديلها أو إلغائها.\n2. لا يصرح بحجز التذكرة أو البطاقة العلاجية بالصيدلية لحين توافر الأصناف حيث تكون التذكرة عرضة للإلغاء إذا تم ضبطها، وبالنسبة للبطاقات التي يتركها أصحابها سهواً تظل مدة أسبوع ثم تسلم بعدها لأقرب عيادة أو منطقة تأمين صحي بمقابل إيصال.\n3. في حالة مصادرة التأمين للإيقاف المؤقت يلتزم الطرف الثاني بأداء تأمين جديد خلال شهر على الأكثر من تاريخ إخطاره بتوقيع الجزاء، وذلك دون انتظار انتهاء فترة إيقاف التعامل، وإلا اعتبر التعاقد مفسوخاً ولا يكون للطرف الثاني أي حق في المطالبة باستمرار التعاقد.\n4. يكون ضبط المخالفة بمعرفة مفتشي الهيئة أو مفتشي الصيدلة بوزارة الصحة، ويتم تحرير محضر بالواقعة وإجراء تحقيق مبدئي بالصيدلية (إن أمكن) بمعرفة القائم بالتفتيش، وبالنسبة للمخالفات التي تكون عقوبتها غرامة يتم توقيعها اكتفاءً بتقرير التفتيش مع / أو التحقيق المبدئي.\nأما المخالفات التي تكون عقوبتها الإيقاف المؤقت (لأي مدة)، فيتعين التحقيق مع المخالف وصاحب الصيدلية المتعاقدة، بمعرفة لجنة تشكل بكل فرع برئاسة مدير إدارة التموين الطبي والصيدليات، وعضوية صيدلي من العاملين بالفرع وأحد أعضاء الشئون القانونية بالفرع، ويتم إخطار النقابة الفرعية المختصة للصيادلة لإيفاد مندوباً عنها لحضور التحقيق، وفي حالة عدم حضوره (وعدم موافقة المخالف على التحقيق بدونه) يخطر للحضور مرتين متتاليتين بخطاب مسجل بعلم الوصول وفي حالة عدم حضوره بعد الإخطار الثاني، يكون انعقاد اللجنة صحيحاً بدونه.\n5. بالنسبة للمخالفات التي عقوبتها إيقاف، فإنه يحق للهيئة الإيقاف التحفظي الفوري للتعامل مع الصيدلية، لحين انتهاء التحقيقات، لمدة لا تزيد عن شهر (إذا كانت العقوبة إيقاف لغاية عام) وشهرين (إذا كانت العقوبة إيقاف لغاية ثلاث سنوات) وحتى انتهاء التحقيقات (إذا كانت العقوبة إيقاف أكثر من ثلاث سنوات أو تخضع للقانون 10 لسنة 1967)، ولا يتم الإيقاف التحفظي إلا إذا كانت أدلة المخالفة قوية وبعد موافقة مدير الفرع، ويخطر صاحب الصيدلية بهذا الإيقاف التحفظي.", "6. إذا كانت المخالفة جريمة جنائية ينطبق عليها القانون رقم 10 لسنة 67 فإن إبلاغ النيابة العامة أو حكم القضاء الصادر لا يخل بحق الهيئة في توقيع الجزاءات التعاقدية المنصوص عليها بهذه اللائحة حتى لو حفظت النيابة الشكوى أو صدر حكم القضاء بالبراءة، حيث تختلف ضوابط إثبات الجريمة الجنائية عنها في المخالفة التعاقدية.\n7. يتم توقيع الجزاءات التعاقدية المنصوص عليها بهذه اللائحة أياً كان مرتكب المخالفة بالصيدلية سواء أكان المخالف صاحبها أو مديرها أو أي عامل أو موظف بها ويتم توقيع الجزاء على الموقع على التعاقد مع الهيئة، حيث أنه هو المسئول أمام الهيئة، أما المخالفات الجنائية فهي شخصية في حق مرتكبها فقط بالإضافة إلى توقيع العقوبة التعاقدية على صاحب الصيدلية.\n8. إذا ارتكب الطرف الثاني إخلالاً في تنفيذ التعاقد لم يرد صراحة بهذه اللائحة يؤخذ رأي الشئون القانونية بالفرع لإبداء الرأي في تحديد البند الذي يطبق على المخالفة.\n9. تخصم الغرامة المالية التي توضع على الطرف الثاني من مستحقاته لدى الطرف الأول – وإذا لم توجد له مستحقات، تخصم من قيمة التأمين ويلتزم الطرف الثاني باستكمال التأمين خلال شهر على الأكثر من تاريخ إخطاره، وإلا يعتبر التعاقد مفسوخاً.\n10. تسقط المخالفات التي عقوبتها إنذار أو غرامة مالية فقط بعد مرور سنة واحدة من تاريخ ارتكاب المخالفة، وتعتبر في حالة التكرار مرة أولى، أما المخالفات التي عقوبتها إيقاف أياً كانت مدة الإيقاف فلا تسقط بالتقادم وتعتبر في حالة التكرار مرة تالية.\n11. في حالة ارتكاب الصيدلية المتعاقدة التي سبق أن وقع عليها جزاء الإيقاف عن التعامل لمدة خمس سنوات لأي مخالفة عقوبتها الإيقاف خمس سنوات يلغى التعاقد نهائياً مع عدم جواز التعاقد معها مستقبلاً.\n12. في حالة تكرار المخالفة بعد المرة الثالثة (وتكون العقوبة ما زالت إيقاف مؤقت) تضاعف مدة الإيقاف (مع مصادرة التأمين) كل مرة حتى تصل للإيقاف خمس سنوات بعدها يتم إلغاء التعاقد نهائياً.\n13. حيث أن التعاقد في حالة الإيقاف المؤقت لا يكون ملغياً وإنما موقوفاً بشكل مؤقت فإنه يتعين إعادة معاينة الصيدلية بعد الإيقاف لمدة عام أو أكثر قبل إعادة التعاقد للتحقق من صلاحية الصيدلية وحسن السمعة.", "رابعاً : لائحة المخالفات والجزاءات للصيدليات المتعاقدة\n(ويعتبر ملحق لعقد توريد وصرف أدوية من الصيدليات)\n\nتنفيذاً لبنود العقد يكون من حق الطرف الأول (الهيئة) توقيع الجزاءات التعاقدية التالية عن المخالفات المنصوص عنها وذلك مع عدم الإخلال بحق الطرف الأول طبقاً للتعاقد في عدم تجديد التعاقد للأسباب التي تقتنع بها الهيئة، دون أن يكون للطرف الثاني أي حق في الاعتراض أو التعويض.\n\n[جدول المخالفات والجزاءات]:\n\n1- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين صرف أدوية مخالفة في المفعول بطريق الخطأ، دون إضرار بحالة المنتفع، وتدوين سعر الدواء المنصرف بالفعل.\n- أول مرة: غرامة من 20 إلى 40 جنيه.\n- ثاني مرة: غرامة من 50 إلى 100 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n2- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين صرف دواء بديل رغم توافر الدواء الأصلي المدون بالتذكرة (المسموح بصرفه) بالصيدلية نفسها.\n- أول مرة: غرامة من 20 إلى 40 جنيه.\n- ثاني مرة: غرامة من 50 إلى 100 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n3- المخالفة: عدم تقديم تذاكر التأمين الصحي للمفتش فور طلبها.\n- أول مرة: غرامة من 20 إلى 40 جنيه.\n- ثاني مرة: غرامة من 50 إلى 100 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n4- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين عدم صرف الدواء للمنتفع رغم توافره بالصيدلية وعدم وجود موانع للصرف طبقاً لتعليمات الهيئة.\n- أول مرة: غرامة من 50 إلى 90 جنيه.\n- ثاني مرة: غرامة من 100 إلى 150 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n5- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين صرف أدوية انتهت صلاحيتها للاستخدام أو أن تاريخ التحضير وانتهاء المفعول مطموس عمداً.\n- أول مرة: غرامة من 50 إلى 90 جنيه.\n- ثاني مرة: غرامة من 100 إلى 150 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n6- المخالفة: صرف الدواء بالخطأ الذي يسبب ضرراً جسيماً بصحة المريض.\n- أول مرة: إيقاف التعامل نهائياً ومصادرة التأمين والمساءلة الجنائية.\n- ثاني مرة: -------\n- ثالث مرة: -------\n\n7- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أن إجراءات الصرف صحيحة، عدا أن الصارف لم يطلب البطاقة العلاجية ولم يطلع عليها لإثبات البيانات نقلاً منها.\n- أول مرة: غرامة من 20 إلى 40 جنيه.\n- ثاني مرة: غرامة من 50 إلى 100 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n8- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أن إجراءات الصرف صحيحة، عدا أنه لم يتم كتابة السعر قبل توقيع المستلم.\n- أول مرة: غرامة من 20 إلى 40 جنيه.\n- ثاني مرة: غرامة من 50 إلى 100 جنيه.\n- ثالث مرة: إيقاف التعامل ستة شهور ومصادرة التأمين.\n\n9- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أن إجراءات الصرف صحيحة، عدا أنه لم يتم ختم عبوات الأدوية بختم التأمين الصحي أو عدم وضوح الختم.\n- أول مرة: غرامة من 50 إلى 90 جنيه.\n- ثاني مرة: غرامة من 100 إلى 150 جنيه.\n- ثالث مرة: إيقاف التعامل سنتين ومصادرة التأمين.\n\n10- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف بدائل مسموح بها طبقاً لتعليمات الهيئة، أقل سعراً من المدون، ولم يتم تسديد السعر قبل توقيع المستلم.\n- أول مرة: غرامة من 50 إلى 90 جنيه.\n- ثاني مرة: غرامة من 100 إلى 150 جنيه.\n- ثالث مرة: إيقاف التعامل سنة ومصادرة التأمين.", "11- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف عينات طبية أو أدوية خاصة بجهات حكومية.\n- أول مرة: إيقاف التعامل لمدة ستة شهور ومصادرة التأمين.\n- ثاني مرة: إيقاف التعامل لمدة سنتين ومصادرة التأمين.\n- ثالث مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n\n12- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أن إجراءات الصرف صحيحة عدا أن المستلم ليس صاحب حق في الاستلام طبقاً لتعليمات الهيئة.\n- أول مرة: غرامة من 50 إلى 100 جنيه.\n- ثاني مرة: إيقاف التعامل لمدة ستة شهور ومصادرة التأمين.\n- ثالث مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n\n13- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف بدائل أقل سعراً وتم تسديد السعر بالتذكرة على أساس المدون الأعلى سعراً، أو تم صرف كمية أقل من المدون وتم سداد السعر على أساس المدون بالتذكرة.\n- أول مرة: إيقاف التعامل لمدة سنتين ومصادرة التأمين.\n- ثاني مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n- ثالث مرة: إلغاء التعاقد نهائياً ومصادرة التأمين.\n\n14- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف تذاكر مجمعة صحيحة مرفقاً بها البطاقات العلاجية، لوسيط وبعلم أصحابها، وتم صرف الأدوية صحيحة ولكن بدون وجود تصريح بذلك من الهيئة.\n- أول مرة: إيقاف التعامل لمدة سنة ومصادرة التأمين.\n- ثاني مرة: إيقاف التعامل لمدة ثلاث سنوات ومصادرة التأمين.\n- ثالث مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n\n15- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف تذاكر مجمعة صحيحة شكلاً، لوسيط بدون علم أصحابها وبدون وجود بطاقاتهم، وتم صرف الأدوية صحيحة ولكن بدون وجود تصريح بذلك من الهيئة.\n- أول مرة: إيقاف التعامل لمدة ثلاث سنوات ومصادرة التأمين.\n- ثاني مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n- ثالث مرة: إلغاء التعاقد نهائياً ومصادرة التأمين.\n\n16- المخالفة: تقديم تذاكر ضمن المطالبة أو (ضبطها بالصيدلية) ويتبين أنها قد حررت بدون علم أصحابها وأن التوقيع بالاستلام مزور عليهم أو يتضح أن الاسم المسجل وهمي أو لا علاقة له بالرقم الكودي.\n- أول مرة: الإيقاف التحفظي لحين استكمال التحقيق، وإذا تبين تزوير البيانات يتم إيقاف التعامل نهائياً والإحالة للنيابة العامة.\n- ثاني مرة: -------\n- ثالث مرة: -------\n\n17- المخالفة: مراقبة الصرف، ويتبين أنه تم صرف أدوية فيتامينات أو أدوية خاصة بدلاً من أدوية المنتفع نفسه الموصوفة بتذكرة التأمين الصحي.\n- أول مرة: إيقاف التعامل لمدة سنتين ومصادرة التأمين.\n- ثاني مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n- ثالث مرة: إلغاء التعاقد نهائياً ومصادرة التأمين.\n\n18- المخالفة: مراقبة الصرف بمعرفة التفتيش الصيدلي ويتبين أنه تم صرف مستحضرات أو أدوات تجميل أو مستلزمات طبية بدلاً من الأدوية العلاجية الموصوفة للمنتفع نفسه / أو تم عمل مقاصة بين قيمة التذكرة أو جزء منها مع حساب جاري للمنتفع بالصيدلية أو مقابل بون بالقيمة.\n- أول مرة: إيقاف التعامل لمدة خمس سنوات ومصادرة التأمين.\n- ثاني مرة: إلغاء التعاقد نهائياً مع مصادرة التأمين.\n- ثالث مرة: -------\n\n19- المخالفة: شراء تذاكر التأمين الصحي من المنتفع أو من وسيط بالثمن بدلاً من صرف الدواء.\n- أول مرة: إلغاء التعاقد نهائياً مع مصادرة التأمين.\n- ثاني مرة: -------\n- ثالث مرة: -------\n\n20- المخالفة: شراء، أو تواجد أدوية بالصيدلية عليها ختم التأمين الصحي لصيدلية أخرى أو وجود أدوية عليها آثار محو أختام.\n- أول مرة: إلغاء التعاقد نهائياً مع مصادرة التأمين.\n- ثاني مرة: -------\n- ثالث مرة: -------\n\n21- المخالفة: صرف تذاكر من صيدلية غير متعاقدة لحساب صيدلية متعاقدة.\n- أول مرة: الصيدلية المتعاقدة: إيقاف التعامل ثلاث سنوات ومصادرة التأمين. الصيدلية الغير متعاقدة: الإحالة للنقابة للمساءلة التأديبية مع تأخير التعاقد ثلاث سنوات.\n- ثاني مرة: الصيدلية المتعاقدة: إيقاف التعامل خمس سنوات ومصادرة التأمين. الصيدلية الغير متعاقدة: عدم التعاقد نهائياً.\n- ثالث مرة: الصيدلية المتعاقدة: إيقاف التعامل نهائياً ومصادرة التأمين. الصيدلية الغير متعاقدة: -------", "آلية صرف أدوية الاسم التجاري\n\n- يتم التوريد من الشركات إلى المخازن بناءً على أمر توريد صادر من التموين الطبي مع ذكر أن البضاعة موردة بصفة أمانة في شرط التوريد.\n- إضافة الأصناف الموردة من الشركات في دفتر 3 م0ح مع تسجيل بيانات الفاتورة لكل صنف في خانة الملاحظات (وبقاء أصل الفاتورة بالمخزن وصورة من الفاتورة للمراجعة الفنية بالفرع وصورة للحسابات).\n- يتم الصرف من المخزن لصيدليات الاسم التجاري على أذون 2 م0ح أصل وصورتين مع الاحتفاظ بأصل الأذون في المخزن.\n\nصيدلية الاسم التجاري-:\n- إضافة الكميات الموردة من المخزن إلى الصيدلية في الدفاتر.\n- التأكد من استكمال بيانات تذكرة 56 ب المحررة بمعرفة الصيدلية الرئيسية (بيانات المنتفع – التشخيص – تاريخ الكشف - توقيع وأكلاشيه الطبيب – خاتم الشعار) وتحديد قيمة ما يتحمله المنتفع للصنف المطلوب بمعرفة صيادلة الاسم التجاري.\n- تحصل قيمة الأصناف من المنتفع بمعرفة الإيرادات كل شركة على حدة مع فصل الموازنات.\n- ترفق صورة إيصال الدفع بتذكرة 56 ب.\n- يتم تنزيل الكمية المنصرفة يومياً في استمارة 9 ت0ص أو استمارة 321 أو شيت الكمبيوتر.\n- ثم القيد في دفتر اليومية 322 والمطابقة مع مراقب العهدة يومياً.\n- تجمع الكميات المنصرفة للأصناف في أذون 2 م0ح كل شركة على حدة نهاية كل شهر يوم 25 (اليوم الخامس والعشرون من الشهر) وترفق بالمطالبات طبقاً للكشف المقترح من الإدارة العامة للتموين الطبي والصيدليات.\n\n[جدول يضم البيانات التالية: اسم الشركة | عدد التذاكر | الإجمالي بسعر الشراء | المسدد | الباقي]\n\nوترسل للمراجعة الفنية بالفرع في موعد أقصاه يوم 27 (اليوم السابع والعشرون من الشهر).\n- وعند وجود أخطاء بالمطالبة تعاد بعد ثلاثة أيام لصيدلية الاسم التجاري مرفق بها أذون 2 م0ح لفصل الروشتات الوارد بها أخطاء عن باقي المطالبة وتعديل الكمية الفعلية المنصرفة والقيمة المالية والكمية المتبقية في أذون 2 م0ح.\n- وتعاد خلال يومين بعد التعديل إلى المراجعة الفنية بالفرع للمطابقة والتوقيع.\n- وتخصم الكميات من الدفاتر بمعرفة أصحاب العهدة بموجب أذون 2 م0ح المراجعة والموقعة عليها من المراجعة الفنية بحيث يتم الانتهاء من ذلك في موعد أقصاه اليوم الخامس من الشهر التالي.\n- عند تكرار صرف الصيدلية من المخزن لنفس الأصناف يتم تقديم صور من أذون 2 م0ح السابقة.", "آلية التعامل مع اللجنة العليا للدواء\n\nالالتزام بالبروتوكولات السابق إرسالها وعدم كتابة أدوية غير مسجلة وغير مسعرة بوزارة الصحة.\nلا بد من إرسال طلبات الأدوية إلى اللجنة العليا مباشرةً وليس عن طريق المريض على أن تكون مستوفاة لجميع الفحوصات ومدونة بالحاسب الآلي وليست بخط اليد ومرفق بها صورة من بطاقة الرقم القومي وصورة البطاقة العلاجية.\n\nلن يلتفت إلى أي تقرير صادر من اللجنة الثلاثية بالفرع غير مستوفي الآتي:\n- تاريخ العرض على اللجنة.\n- توقيع وأختام أعضاء اللجنة والمقرر.\n- عند إرسال طلبات الأدوية يجب أن يكون اسم المريض رباعي ومطابق للاسم المذكور على صورة بطاقة الرقم القومي للمريض (ولن يلتفت إلى الطلبات غير المستوفاة لهذا الشرط).\n- التقارير المرسلة يجب أن تشتمل على العلاج المطلوب بالجرعة المحددة والتاريخ المرضي وخطوط العلاج السابقة ومدى الاستجابة لها.\n\nيقوم التموين الطبي بالفرع بفتح سجل لتسجيل الموافقات الخاصة باللجنة العليا للدواء مع الاحتفاظ بصورة منها وتسليم الأصل لمدير الصيدلية بالعيادة وصورة للمريض بعد ختمهما بختم التموين الطبي بالفرع.\n\nعند تحويل المريض إلى خط علاجي آخر مختلف عن قرار اللجنة العليا يتم إصدار تقرير جديد من اللجنة الثلاثية بإيقاف قرار اللجنة ويتم إخطار اللجنة العليا بذلك والأسباب.\n\nفي حالات الموافقة على التكرار عن طريق الفرع يكون التكرار بمعرفة نفس لجنة الأورام بالفرع التي عرض عليها المريض عند رفع الطلب إلى اللجنة العليا وليس الاستشاري أو لجنة أخرى.\n\nفي حالات التكرار يجب إرسال فحوصات حديثة للتقييم مرفق بها مقارنة للحالة قبل وبعد العلاج مع ضرورة إرفاق بيان بعدد الموافقات السابقة وتواريخها وعدد الجرعات المستخدمة فعلياً عند التكرار من اللجنة العليا.\n\nيقوم الطبيب المسئول بتحرير تذكرة طبية للمريض ويرفق بها صورة من قرار اللجنة.\n\nيقوم مدير الصيدلية بعمل ملف لحفظ قرارات اللجنة ووضع أرقام مسلسلة لها من الأقدم إلى الأحدث بداية كل سنة مالية (مع الاحتفاظ بالقرارات المستمر تنفيذها في السنة الجديدة).\n- يتم فتح دفتر (حرف ز) بالأدوية الخاصة بقرارات اللجنة على النموذج التالي:\nاسم الصنف:\n\n[جدول يضم البيانات التالية: اسم المريض | تاريخ القرار ورقمه | عدد الجرعات أو الشهور | الجرعة الأولى | الجرعة الثانية | الجرعة الثالثة | الخ.....]", "- في حالة الصرف الداخلي:\nيقوم الصيدلي بمراجعة جدول الحقن الخاص بالقسم مع ملفات المرضى وتسلم الأدوية للممرضة مسئولة القسم بإيصال صباح يوم الحقن مع مراعاة ظروف حفظ الدواء.\nفي نهاية يوم الحقن يتم تسليم الصيدلية (استمارة 305) بالأدوية والمحاليل التي تم استخدامها والأدوية المرتجعة ليتم مراجعتها مع الإيصال (واتخاذ الإجراءات المخزنية السليمة).\n\n- في حالة الصرف الخارجي:\nيقوم الصيدلي بإرفاق صورة من قرار اللجنة مع التذكرة المحررة وتأخذ أرقام مسلسلة في نهاية ترتيب اليومية.\nفي حالة تأخر تنفيذ القرار عن شهر من تاريخ الموافقة يعاد العرض على اللجنة الثلاثية بالفرع لتحديد مدى أحقية المريض في صرف العلاج.\n\nيتم تسليم الفوارغ للصيدلية والاحتفاظ بها لحين إعدامها كل شهر عن طريق لجنة تشكل بمعرفة التموين الطبي بالفرع وبعضوية مدير العيادة ومدير الصيدلية كل شهر.", "البروتوكولات المنظمة لصرف الأدوية", "-1 أدوية الأورام", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Everolimus) Protocol\n\nPatients with confirmed metastatic Renal Cell Carcinoma\n• Adequate hematologic values\n• Normal kidney & liver functions\n• Good performance status of ECOG :0-2\n• Treatment is given as Second line\n• Baseline chest, abdomen & pelvic radiography\n• No serious co-morbidities\n• No other malignancy\n• Re-evaluate after 3 months of therapy.\n• Assessment of treatment related toxicity especially elevation of liver enzymes, development of diabetes mellites & hematologic toxicity.\n• Treatment should be discontinued in case of disease progression or drug toxicity.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Pemetrexed) protocol:\n\n1- Patients with pathologically confirmed diagnosis of Malignant Mesothelioma (Epithelial Type).\n2- Patients with good performance status (ECOG 0-2)\n3- Patients with no contraindication to the drug.\n4- In combination with Platinum based chemotherapy.\n5- Patients should receive premedication with folic acid & Vitamin B12 supplement to avoid serious complications.\n6- Patients should have normal values of renal & liver functions as well as blood picture.\n7- Patient should have a baseline recent CT chest.\n8- Patient should be assessed for response after 3 cycles.\n9- Responding patients continue another 3 cycles with reevaluation till reaching maximum response.\n10- Non- responding or relapsing patients should receive another line of therapy according to their condition.\n11- Patients should not have a second malignancy.\n12- Patients developing severe side effects to the drug should discontinue treatment with the drug.", "(Exemestane) Protocol\n\n1- Patients with confirmed breast cancer\n2- ER, PR positive tumors\n3- Metastatic breast after prior hormonal therapy\n4- Base line radiography and scans before starting treatment\n5- No contraindications to the drug\n6- No serious co morbidities\n7- No other malignancy\n8- Re-evaluation after 3 months\n9- Responding patients continue treatment\n10- Discontinue treatment in case of disease progression or intolerable toxicity.", "أدوية لا تصرف إلا بموافقة اللجنة العليا للدواء\n(Bevacizumap) Protocol\n\nAVASTIN in Metastatic Cancer Colon:\n1- Patients with pathologically confirmed adenocarcinoma of colon.\n2- Patients with radiologically proven metastatic cancer colon.\n3- Patients with no prior therapy in the metastatic setting.\n4- Good Performance status ECOG: 0-2\n5- Patients with adequate Blood picture, liver functions & renal functions.\n6- Patients with normal coagulation profile to avoid the possibility of bleeding.\n7- No history of active bleeding\n8- No serious co-morbidity\n9- Patients with no history of intestinal perforati
